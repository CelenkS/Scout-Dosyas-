  try{ data = await apiFetch('/fixtures/players', {fixture:fx.fixture.id}, 'high'); }
  catch(e){ box.innerHTML = `<div class="banner">Oyuncu istatistikleri alınamadı: ${esc(e.message)}</div>`; return; }
  if(!data || !data.length){ box.innerHTML = '<div class="card empty"><div class="display">Henüz oyuncu istatistiği yok</div><p>Maç başlayınca burada her oyuncunun reytingi ve istatistikleri görünecek.</p></div>'; return; }
  const rows = [];
  data.forEach(tb=> (tb.players||[]).forEach(p=>{
    const s = (p.statistics && p.statistics[0]) || {};
    const g = s.games||{}, gl = s.goals||{}, sh = s.shots||{}, ps = s.passes||{}, du = s.duels||{}, tk = s.tackles||{}, dr = s.dribbles||{}, fo = s.fouls||{}, cd = s.cards||{};
    if(!g.minutes && !g.rating) return;
    rows.push({id:p.player.id, name:p.player.name, photo:p.player.photo, team:tb.team, side: tb.team.id===fx.teams.home.id ? 'h' : 'a', pos:g.position||'', sub:!!g.substitute,
      r: parseFloat(g.rating)||0, min:g.minutes||0, g:gl.total||0, a:gl.assists||0, sh:sh.total||0, son:sh.on||0, kp:ps.key||0, pt:ps.total||0, pa: parseInt(ps.accuracy)||0,
      dw:du.won||0, dt:du.total||0, tk:tk.total||0, int:tk.interceptions||0, ds:dr.success||0, da:dr.attempts||0, fd:fo.drawn||0, fc:fo.committed||0, y:cd.yellow||0, rd:cd.red||0, sv:gl.saves||0});
  }));
  const cols = [
    ['r','Reyting', r=> ratingChip(r.r) || '–'], ['min','Dk', r=>r.min], ['g','Gol', r=>r.g||'·'], ['a','Asist', r=>r.a||'·'],
    ['sh','Şut (isb.)', r=> r.sh ? `${r.sh} <small>(${r.son})</small>` : '·'], ['kp','Kilit pas', r=>r.kp||'·'], ['pt','Pas (%)', r=> r.pt ? `${r.pt} <small>(${r.pa}%)</small>` : '·'],
    ['dw','İkili', r=> r.dt ? `${r.dw}/${r.dt}` : '·'], ['tk','Top kapma', r=>r.tk||'·'], ['int','Araya girme', r=>r.int||'·'], ['ds','Çalım', r=> r.da ? `${r.ds}/${r.da}` : '·'],
    ['fd','Faul (yap.)', r=> `${r.fd||0} <small>(${r.fc||0})</small>`], ['sv','Kurtarış', r=>r.sv||'·']
  ];
  let sortKey = 'r', dir = -1, side = 'all';
  const posTr = {G:'K', D:'D', M:'OS', F:'F'};
  function draw(){
    const list = rows.filter(r=> side==='all' || r.side===side).sort((x,y)=> ((x[sortKey]||0)-(y[sortKey]||0))*dir || y.r-x.r);
    box.querySelector('.ptbl-wrap').innerHTML = `<table class="ptbl"><thead><tr><th class="pn">Oyuncu</th>${cols.map(([k,l])=>`<th data-k="${k}" class="${sortKey===k?'on':''}">${l}${sortKey===k ? (dir<0?' ↓':' ↑') : ''}</th>`).join('')}</tr></thead>
      <tbody>${list.map(r=>`<tr data-pid="${r.id}" data-team-id="${r.team.id}" data-team-name="${esc(r.team.name)}" data-team-logo="${esc(r.team.logo||'')}">
        <td class="pn"><span class="pc ${r.side}"></span><img loading="lazy" decoding="async" src="${r.team.logo}" alt="" onerror="this.style.visibility='hidden'"><span class="nm">${esc(r.name)}</span><small>${posTr[r.pos]||''}${r.sub?' · Y':''}</small></td>
        ${cols.map(([k,,f])=>`<td class="${sortKey===k?'on':''}">${f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    box.querySelectorAll('th[data-k]').forEach(th=> th.onclick = ()=>{ const k = th.getAttribute('data-k'); if(sortKey===k) dir = -dir; else { sortKey = k; dir = -1; } draw(); });
    box.querySelectorAll('tbody tr').forEach(tr=> tr.onclick = ()=> openPlayerModalById(parseInt(tr.getAttribute('data-pid'),10), {id:parseInt(tr.getAttribute('data-team-id'),10), name:tr.getAttribute('data-team-name'), logo:tr.getAttribute('data-team-logo')}, undefined, fx));
  }
  box.innerHTML = `<div class="lu-seg" style="margin-bottom:10px;display:flex">
      <button data-sd="all" class="active">Tümü</button>
      <button data-sd="h"><img loading="lazy" decoding="async" src="${fx.teams.home.logo}" alt="" onerror="this.remove()"><span>${esc(fx.teams.home.name)}</span></button>
      <button data-sd="a"><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" alt="" onerror="this.remove()"><span>${esc(fx.teams.away.name)}</span></button></div>
    <div class="ptbl-wrap"></div>
    <p style="font:500 11px var(--font-ui);color:var(--ink2);margin:8px 2px 0">Sütun başlığına dokunarak sırala · oyuncuya dokun → profil</p>`;
  box.querySelectorAll('[data-sd]').forEach(b=> b.onclick = ()=>{ side = b.getAttribute('data-sd'); box.querySelectorAll('[data-sd]').forEach(x=> x.classList.toggle('active', x===b)); draw(); });
  draw();
}

// ---------- H2H (aralarındaki maçlar + form) ----------
async function renderH2HTab(fx, box){
  box.innerHTML = '<div class="lgrp" style="padding:6px">'+'<div class="skel"></div>'.repeat(5)+'</div>';
  const H = fx.teams.home, A = fx.teams.away;
  try{
    const [h2h, fh, fa] = await Promise.all([
      apiFetch('/fixtures/headtohead', {h2h: H.id+'-'+A.id, last:10}, 'high').catch(()=>[]),
      apiFetch('/fixtures', {team:H.id, last:5}, 'high').catch(()=>[]),
      apiFetch('/fixtures', {team:A.id, last:5}, 'high').catch(()=>[])
    ]);
    const past = (h2h||[]).filter(f=>['FT','AET','PEN'].includes(f.fixture.status.short)).sort((a,b)=> new Date(b.fixture.date)-new Date(a.fixture.date));
    let hw = 0, d = 0, aw = 0;
    past.forEach(f=>{ const hg = f.teams.home.id===H.id ? f.goals.home : f.goals.away, ag = f.teams.home.id===H.id ? f.goals.away : f.goals.home; if(hg>ag) hw++; else if(hg<ag) aw++; else d++; });
    const tot = (hw+d+aw)||1;
    const formRow = (team, list)=>{
      const fl = (list||[]).filter(f=>['FT','AET','PEN'].includes(f.fixture.status.short)).sort((a,b)=> new Date(a.fixture.date)-new Date(b.fixture.date));
      return `<div class="h2f"><span><img loading="lazy" decoding="async" src="${team.logo}" alt="" onerror="this.remove()">${esc(team.name)}</span><div>${fl.map(f=>{ const r = fixtureResultForTeam(f, team.id); const opp = f.teams.home.id===team.id ? f.teams.away : f.teams.home; return `<span class="h2f-i" title="${esc(opp.name)} ${f.goals.home}-${f.goals.away}">${resultBadgeHtml(r)}<img loading="lazy" decoding="async" src="${opp.logo}" alt="" onerror="this.remove()"></span>`; }).join('') || '<small style="color:var(--ink2)">veri yok</small>'}</div></div>`;
    };
    const flags = await fixtureFlagSets();
    box.innerHTML = `
      <div class="sect-h">Son form</div>
      <div class="lgrp" style="padding:4px 12px">${formRow(H, fh)}${formRow(A, fa)}</div>
      <div class="sect-h">Aralarındaki son ${past.length} maç</div>
      ${past.length ? `<div class="lgrp" style="padding:14px">
        <div class="h2s"><div><b style="color:var(--home)">${hw}</b><span>${esc(H.name)}</span></div><div><b>${d}</b><span>Beraberlik</span></div><div><b style="color:var(--away)">${aw}</b><span>${esc(A.name)}</span></div></div>
        <div class="h2bar"><i style="width:${hw/tot*100}%;background:var(--home)"></i><i style="width:${d/tot*100}%;background:var(--ink2);opacity:.45"></i><i style="width:${aw/tot*100}%;background:var(--away)"></i></div>
      </div>
      <div class="lgrp">${past.map(f=> sofaRowHtml(f, flags, null, `<small style="color:var(--ink2);font:500 10.5px var(--font-ui);text-align:center">${new Date(f.fixture.date).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit'})}</small>`).replace('class="sr ','class="sr wide ')).join('')}</div>` : '<div class="card empty"><p>Aralarında oynanmış maç bulunamadı.</p></div>'}`;
    box.querySelectorAll('.sr[data-fx]').forEach(r=> r.onclick = ()=>{ const f = past.find(x=> String(x.fixture.id)===r.getAttribute('data-fx')); if(f) openFixtureModal(f); });
  }catch(e){ box.innerHTML = `<div class="banner">H2H alınamadı: ${esc(e.message)}</div>`; }
}
function fxLazyPane(p, overlay, fx){
  const el = overlay.querySelector(p==='players' ? '#fxPlayers' : p==='h2h' ? '#fxH2H' : null);
  if(!el || el.getAttribute('data-loaded')) return;
  el.setAttribute('data-loaded','1');
  if(p==='players') renderPlayersTab(fx, el); else renderH2HTab(fx, el);
}

// ================= v5: koyu "stadyum gecesi" tasarımı — kadro sahası + istatistikler =================
function getTheme(){ try{ return localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){ return 'dark'; } }
function applyTheme(t){
  const r = document.documentElement;
  if(t==='light' || t==='dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const dark = t==='dark' || (t==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark ? '#15161B' : '#2B3AE0');
}
function matchRatingColor(v){
  v = parseFloat(v);
  if(isNaN(v)) return '#7C818E';
  if(v>=9) return '#3D5AFE';
  if(v>=8) return '#00B4D8';
  if(v>=7) return '#18B85C';
  if(v>=6.5) return '#D4B000';
  if(v>=6) return '#F08A24';
  return '#E5383B';
}
function ratingChip(v){ v = parseFloat(v); return isNaN(v) ? '' : `<span class="rchip" style="background:${matchRatingColor(v)}">${v.toFixed(1)}</span>`; }

// küçük SVG ikonlar (emoji yerine — her ekranda aynı, net)
const IC = {
  ball: `<svg viewBox="0 0 16 16" class="ic-ball"><circle cx="8" cy="8" r="7.2" fill="#fff" stroke="#16171C" stroke-width="1.2"/><path d="M8 4.6l2.9 2.1-1.1 3.4H6.2L5.1 6.7z" fill="#16171C"/><path d="M8 4.6V1.2M10.9 6.7l3.1-1.2M9.8 10.1l2 2.8M6.2 10.1l-2 2.8M5.1 6.7L2 5.5" stroke="#16171C" stroke-width="1"/></svg>`,
  og: `<svg viewBox="0 0 16 16" class="ic-ball"><circle cx="8" cy="8" r="7.2" fill="#E5383B" stroke="#fff" stroke-width="1.2"/><path d="M8 4.6l2.9 2.1-1.1 3.4H6.2L5.1 6.7z" fill="#fff"/></svg>`,
  yc: `<i class="ic-card y"></i>`, rc: `<i class="ic-card r"></i>`, yrc: `<i class="ic-card y2"></i>`,
  out: `<svg viewBox="0 0 16 16" class="ic-sub"><circle cx="8" cy="8" r="8" fill="#E5383B"/><path d="M8 4v8M4.8 8.8L8 12l3.2-3.2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  inn: `<svg viewBox="0 0 16 16" class="ic-sub"><circle cx="8" cy="8" r="8" fill="#18B85C"/><path d="M8 12V4M4.8 7.2L8 4l3.2 3.2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ast: `<svg viewBox="0 0 16 16" class="ic-ast"><circle cx="8" cy="8" r="8" fill="#fff"/><path d="M5 11.5L8 4.5l3 7M6.1 9h3.8" stroke="#16171C" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
function shortName(n){
  n = String(n||'').trim(); if(!n) return '';
  const parts = n.split(/\s+/);
  if(parts.length===1 || n.length<=13) return n;
  if(/^[A-ZÇĞİÖŞÜ]\.$/.test(parts[0])) return parts[0]+' '+parts.slice(-1)[0];
  return parts[0][0]+'. '+parts.slice(-1)[0];
}

// ---------- KADROLAR ----------
async function renderLineupsFull(lineups, events, lineupsBox, fx, overlay, loadMatchDetailsRef){
  let statsMap = {};
  try{
    const ps = await apiFetch('/fixtures/players', {fixture:fx.fixture.id}, 'high');
    (ps||[]).forEach(tb=> (tb.players||[]).forEach(p=>{ const s = (p.statistics && p.statistics[0]) || {}; statsMap[p.player.id] = {...s, photo:p.player.photo}; }));
  }catch(e){}
  const subOut = {}, subIn = {}, gl = {}, as = {}, og = {}, yc = {}, rc = {};
  const xi = new Set(); (lineups||[]).forEach(l=> (l.startXI||[]).forEach(x=> x.player && xi.add(x.player.id)));
  (events||[]).forEach(ev=>{
    const pid = ev.player && ev.player.id;
    if(ev.type==='Goal'){
      if(ev.detail==='Own Goal'){ if(pid) og[pid] = (og[pid]||0)+1; }
      else if(ev.detail!=='Missed Penalty'){ if(pid) gl[pid] = (gl[pid]||0)+1; if(ev.assist && ev.assist.id) as[ev.assist.id] = (as[ev.assist.id]||0)+1; }
    }
    if(ev.type==='Card' && pid){ if(/Yellow/.test(ev.detail)) yc[pid] = (yc[pid]||0)+1; else rc[pid] = 1; }
    if(ev.type==='subst'){ const m = ev.time && ev.time.elapsed; [ev.player, ev.assist].forEach(pl=>{ if(!pl || !pl.id) return; if(xi.has(pl.id)) subOut[pl.id] = m; else subIn[pl.id] = m; }); }
  });
  const homeL = lineups.find(l=> l.team.id===fx.teams.home.id) || lineups[0];
  const awayL = lineups.find(l=> l !== homeL) || null;
  const rOf = (id)=>{ const s = statsMap[id]; return s && s.games && s.games.rating ? parseFloat(s.games.rating) : null; };
  const avg = (l)=>{ const r = (l.startXI||[]).map(x=> rOf(x.player.id)).filter(v=>v); return r.length ? r.reduce((a,b)=>a+b,0)/r.length : null; };
  // maçın oyuncusu (en yüksek reyting)
  let motm = null, motmR = 0; Object.keys(statsMap).forEach(id=>{ const r = rOf(id); if(r && r>motmR){ motmR = r; motm = parseInt(id,10); } });
  const teamBar = (l, side)=> l ? `<div class="lu5-h ${side}"><img loading="lazy" decoding="async" src="${l.team.logo}" alt="" onerror="this.style.visibility='hidden'"><div class="t"><b>${esc(l.team.name)}</b><small>${esc(l.formation||'')}${l.coach&&l.coach.name? ' · '+esc(l.coach.name):''}</small></div>${avg(l)? `<span class="avg" title="İlk 11 ortalama reyting"><i style="background:${matchRatingColor(avg(l))}"></i>${avg(l).toFixed(2)}</span>`:''}</div>` : '';
  const badges = (pid)=>{
    const st = statsMap[pid] || {}; const goals = st.goals || {}, cards = st.cards || {};
    const g = Math.max(goals.total||0, gl[pid]||0), a = Math.max(goals.assists||0, as[pid]||0);
    let tr = '', tl = '', bl = '';
    if(g) tr += `<span class="bd">${IC.ball}${g>1?`<em>${g}</em>`:''}</span>`;
    if(og[pid]) tr += `<span class="bd">${IC.og}</span>`;
    if(a) tr += `<span class="bd">${IC.ast}${a>1?`<em>${a}</em>`:''}</span>`;
    if(rc[pid] || cards.red) tl = IC.rc; else if((yc[pid]||0)>=2) tl = IC.yrc; else if(yc[pid] || cards.yellow) tl = IC.yc;
    if(subOut[pid]!==undefined) bl = `<span class="sb">${IC.out}<em>${subOut[pid]}'</em></span>`;
    if(subIn[pid]!==undefined) bl = `<span class="sb">${IC.inn}<em>${subIn[pid]}'</em></span>`;
    return {tr, tl, bl};
  };
  const node = (p, l, side, x, y, r, maxRow, i, count)=>{
    const st = statsMap[p.id] || {}; const rt = rOf(p.id); const b = badges(p.id);
    const cap = st.games && st.games.captain;
    // mac henuz oynanmadiysa /fixtures/players istatistik dondurmuyor, dolayisiyla st.photo bos kaliyor -
    // bu durumda API-Sports'un sabit foto URL kalibina (media.api-sports.io/football/players/{id}.png) dusuyoruz,
    // o da yoksa onerror formadaki numaraya geri donuyor
    const photoUrl = st.photo || `https://media.api-sports.io/football/players/${p.id}.png`;
    return `<div class="pl5 ${side} lineup-slot-click ${p.id===motm?'motm':''}" data-pid="${p.id}" data-team-id="${l.team.id}" data-team-name="${esc(l.team.name)}" data-team-logo="${esc(l.team.logo||'')}" style="left:${x}%;top:${y}%">
      <div class="ph"><div class="av"><img loading="lazy" decoding="async" src="${photoUrl}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(p.number ?? '')}'))"></div>
        ${rt ? `<span class="rt" style="background:${matchRatingColor(rt)}">${rt.toFixed(1)}</span>` : ''}
        ${b.tr? `<span class="tr">${b.tr}</span>`:''}${b.tl? `<span class="tl">${b.tl}</span>`:''}${b.bl? `<span class="bl">${b.bl}</span>`:''}
        ${cap? '<span class="cap">C</span>':''}
        <button class="mp-note-btn" data-pid="${p.id}" data-pname="${esc(p.name)}" data-poskey="${guessScoutPositionKey(p.pos, r, maxRow, i+1, count)}" title="Bu maça özel not">✎</button>
      </div>
      <span class="nm"><em>${esc(p.number ?? '')}</em>${esc(shortName(p.name))}</span>
    </div>`;
  };
  const half = (l, side)=>{
    if(!l) return '';
    const withGrid = (l.startXI||[]).map(x=>x.player).filter(p=>p.grid);
    if(!withGrid.length) return '';
    const rows = {}; withGrid.forEach(p=>{ const [r,c] = p.grid.split(':').map(Number); (rows[r] = rows[r]||[]).push({...p, col:c}); });
    const keys = Object.keys(rows).map(Number).sort((a,b)=>a-b); const maxRow = Math.max(...keys, 1);
    let out = '';
    keys.forEach(r=>{
      const rp = rows[r].slice().sort((a,b)=> b.col-a.col);
      const t = (r-1)/((maxRow-1)||1);
      // iki takim alt alta gosterildigi icin (sahanin iki yarisi gibi), deplasman takiminin dizilisini dikeyde ters ceviriyoruz:
      // ev sahibinde kaleci ustte/forvet altta (ortadaki cizgiye yakin); deplasmanda forvet ustte (ortadaki cizgiye yakin)/kaleci altta
      // - boylece iki takim gercek bir sahada oldugu gibi karsi karsiya geliyor
      const y = side==='away' ? 9 + (1-t)*80 : 9 + t*80;
      rp.forEach((p,i)=>{ const x = ((i+1)/(rp.length+1))*100; out += node(p, l, side, x, y, r, maxRow, i, rp.length); });
    });
    return out;
  };
  // deplasmanda kaleci alta, forvet usten (ortadaki sinira) tasindigi icin saha cizgileri de
  // (kale önü, altı pas, orta cizgi/yuvarlak) ayni yonde ters cevrilmeli - yoksa oyuncular dogru yerde
  // ama kale/orta saha cizgileri eski (ev sahibi) yonunde kaliyor, kaleci forvet gibi görünüyordu
  const pitchLinesHtml = (side)=> side==='away'
    ? `<div class="ln p-b1"></div><div class="ln p-b2"></div><div class="ln p-ba"></div><div class="ln p-mid" style="bottom:auto;top:2px"></div><div class="ln p-c" style="bottom:auto;top:2px;transform:translate(-50%,-50%)"></div>`
    : `<div class="ln p-t1"></div><div class="ln p-t2"></div><div class="ln p-ta"></div><div class="ln p-mid"></div><div class="ln p-c"></div>`;
  const pitchFor = (l, side)=> l && (l.startXI||[]).some(x=> x.player && x.player.grid) ? `<div class="lu5">${teamBar(l, side)}<div class="pitch5">${pitchLinesHtml(side)}${half(l, side)}</div></div>` : '';
  const hasGrid = [homeL, awayL].some(l=> l && (l.startXI||[]).some(x=> x.player && x.player.grid));
  const benchCol = (l)=>{
    if(!l) return '';
    const subs = (l.substitutes||[]).slice().sort((a,b)=> (subIn[b.player.id]!==undefined) - (subIn[a.player.id]!==undefined));
    const xiList = hasGrid ? '' : (l.startXI||[]).map(x=> benchRow(x.player, l, statsMap, subIn, gl, as)).join('');
    return `<div class="bn5"><div class="bn5-h"><img loading="lazy" decoding="async" src="${l.team.logo}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(l.team.name)}</b></div>
      ${xiList ? '<div class="bn5-t">İlk 11</div>'+xiList : ''}
      <div class="bn5-t">Yedekler</div>
      ${subs.map(x=> benchRow(x.player, l, statsMap, subIn, gl, as)).join('') || '<div class="bn-row" style="cursor:default;color:var(--ink2)">Yok</div>'}</div>`;
  };
  const confirmed = (lineups||[]).length && !(fx.fixture.status.short==='NS');
  lineupsBox.innerHTML = `
    <div class="lu5-tools"><span class="lu5-tag ${confirmed?'ok':''}">${confirmed? 'Kesin kadro' : 'Açıklanan kadro'}</span><span style="flex:1"></span><button class="chip-btn" id="luNotesBtn">✎ Oyuncu notu</button><button class="chip-btn" id="refreshLineupsBtn">↻ Yenile</button></div>
    ${hasGrid ? `<div class="lu5-wrap">${pitchFor(homeL,'home')}${pitchFor(awayL,'away')}</div>` : ''}
    <div class="lu5-leg"><span>${IC.ball} Gol</span><span>${IC.ast} Asist</span><span>${IC.yc} Kart</span><span>${IC.out} Çıktı</span><span>${IC.inn} Girdi</span><span><i class="rtk" style="background:${matchRatingColor(7.2)}"></i>Reyting</span>${motm? '<span><i class="motm-k"></i>Maçın oyuncusu</span>':''}</div>
    <div class="bench5">${benchCol(homeL)}${benchCol(awayL)}</div>`;
  lineupsBox.querySelectorAll('.ev-player-link, .lineup-slot-click').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('.mp-note-btn')) return;
      e.preventDefault();
      const pid = el.getAttribute('data-pid'); if(!pid) return;
      openPlayerModalById(parseInt(pid,10), {id:parseInt(el.getAttribute('data-team-id'),10), name:el.getAttribute('data-team-name'), logo:el.getAttribute('data-team-logo')}, undefined, fx);
    };
  });
  lineupsBox.querySelectorAll('.mp-note-btn').forEach(async btn=>{
    const pid = parseInt(btn.getAttribute('data-pid'),10);
    btn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); openMatchPlayerNoteModal(fx, pid, btn.getAttribute('data-pname'), btn, btn.getAttribute('data-poskey')); };
    const ex = await getNotePayload('matchplayer', fx.fixture.id+'_'+pid);
    if(ex && ex.payload && ((ex.payload.note && ex.payload.note.trim()) || (ex.payload.rating!==null && ex.payload.rating!==undefined))) btn.classList.add('has');
  });
  const nb = lineupsBox.querySelector('#luNotesBtn');
  if(nb) nb.onclick = ()=>{ lineupsBox.classList.toggle('notes-on'); nb.classList.toggle('on', lineupsBox.classList.contains('notes-on')); if(lineupsBox.classList.contains('notes-on')) showToast('Not eklemek için oyuncunun üstündeki ✎ simgesine dokun'); };
  const rb = lineupsBox.querySelector('#refreshLineupsBtn');
  if(rb && loadMatchDetailsRef) rb.onclick = ()=>{ rb.textContent = 'Yenileniyor…'; loadMatchDetailsRef(fx); };
}
function benchRow(p, l, statsMap, subIn, gl, as){
  const st = statsMap[p.id] || {}; const r = st.games && st.games.rating ? parseFloat(st.games.rating) : null;
  const inMin = subIn[p.id]; const g = gl[p.id]||0, a = as[p.id]||0;
  const posKey = p.pos==='G'?'gk':p.pos==='D'?'cb':p.pos==='F'?'st':'cm';
  const posTr = {G:'Kaleci', D:'Defans', M:'Orta saha', F:'Forvet'}[p.pos] || '';
  const photoUrl = st.photo || `https://media.api-sports.io/football/players/${p.id}.png`;
  return `<div class="bn-row ev-player-link ${inMin!==undefined?'played':''}" data-pid="${p.id}" data-team-id="${l.team.id}" data-team-name="${esc(l.team.name)}" data-team-logo="${esc(l.team.logo||'')}">
    <span class="av"><img loading="lazy" decoding="async" src="${photoUrl}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(p.number ?? '')}'))"></span>
    <span class="n"><b>${esc(p.name)}</b><small>${esc(p.number ?? '')}${posTr? ' · '+posTr:''}</small></span>
    <span class="bx">${g? IC.ball+(g>1?`<em>${g}</em>`:''):''}${a? IC.ast:''}${inMin!==undefined? `<span class="in">${IC.inn}${inMin}'</span>`:''}</span>
    ${r? `<span class="rt" style="background:${matchRatingColor(r)}">${r.toFixed(1)}</span>` : ''}
    <button class="mp-note-btn" data-pid="${p.id}" data-pname="${esc(p.name)}" data-poskey="${posKey}" title="Bu maça özel not">✎</button>
  </div>`;
}

// ---------- İSTATİSTİKLER ----------
function modernStatsHtml(stats, fx){
  const find = (idx, type)=>{ const arr = (stats[idx]&&stats[idx].statistics)||[]; const f = arr.find(s=>s.type===type); return (f && f.value!==null && f.value!==undefined) ? f.value : null; };
  const num = (v)=> v===null||v===undefined ? null : parseFloat(String(v).replace('%',''));
  const lowerBetter = new Set(['Fouls','Yellow Cards','Red Cards','Offsides']);
  const pct = new Set(['Passes %','Ball Possession']);
  function row(type, label, hRaw, aRaw){
    const h = hRaw!==undefined ? hRaw : find(0,type), a = aRaw!==undefined ? aRaw : find(1,type);
    if(h===null && a===null) return '';
    const hv = num(h)||0, av = num(a)||0;
    const isPct = pct.has(type) || /%$/.test(String(h||''));
    const max = isPct ? 100 : Math.max(hv, av) || 1;
    let hw = hv>av, aw = av>hv;
    if(lowerBetter.has(type)){ const t = hw; hw = aw; aw = t; }
    return `<div class="s5-row"><div class="s5-top"><span class="s5-v h ${hw?'win':''}">${esc(h ?? 0)}</span><span class="l">${esc(label)}</span><span class="s5-v a ${aw?'win':''}">${esc(a ?? 0)}</span></div>
      <div class="s5-bars"><div class="h"><i class="${hw?'win':''}" style="width:${Math.max(hv?3:0, hv/max*100)}%"></i></div><div class="a"><i class="${aw?'win':''}" style="width:${Math.max(av?3:0, av/max*100)}%"></i></div></div></div>`;
  }
  function group(title, items){
    const html = items.map(it=>row(...it)).join('');
    return html ? `<section class="s5-grp"><h5>${title}</h5>${html}</section>` : '';
  }
  const poss = num(find(0,'Ball Possession'));
  const xgH = find(0,'expected_goals'), xgA = find(1,'expected_goals');
  const shotsH = num(find(0,'Total Shots'))||0, onH = num(find(0,'Shots on Goal'))||0;
  const shotsA = num(find(1,'Total Shots'))||0, onA = num(find(1,'Shots on Goal'))||0;
  const known = new Set(['Ball Possession','expected_goals','Total Shots','Shots on Goal','Shots off Goal','Blocked Shots','Shots insidebox','Shots outsidebox','Total passes','Passes accurate','Passes %','Fouls','Yellow Cards','Red Cards','Offsides','Corner Kicks','Goalkeeper Saves','goals_prevented']);
  const others = ((stats[0]&&stats[0].statistics)||[]).filter(s=>!known.has(s.type)).map(s=>[s.type, translateStat(s.type)]);
  const accH = shotsH ? Math.round(onH/shotsH*100)+'%' : '0%', accA = shotsA ? Math.round(onA/shotsA*100)+'%' : '0%';
  // üst özet: 3 büyük kutu (topa sahip olma, xG, isabetli şut)
  const ring = (v)=>{ const c = 2*Math.PI*26; return `<svg viewBox="0 0 64 64" class="s5-ring"><circle cx="32" cy="32" r="26" class="tr"/><circle cx="32" cy="32" r="26" class="aw" style="stroke-dasharray:${c} ${c}"/><circle cx="32" cy="32" r="26" class="hm" style="stroke-dasharray:${c*v/100} ${c}"/></svg>`; };
  const hero = `<div class="s5-hero">
    ${poss!==null && !isNaN(poss) ? `<div class="s5-k"><div class="ringw">${ring(poss)}<b>${Math.round(poss)}<small>%</small></b></div><span>Topa sahip olma</span><div class="pr"><i class="h">${Math.round(poss)}%</i><i class="a">${Math.round(100-poss)}%</i></div></div>` : ''}
    ${xgH!==null || xgA!==null ? `<div class="s5-k"><div class="dual"><b class="h">${esc(xgH ?? '-')}</b><em>:</em><b class="a">${esc(xgA ?? '-')}</b></div><span>Gol beklentisi (xG)</span><div class="pr"><i>${fx.goals.home ?? 0} gol</i><i>${fx.goals.away ?? 0} gol</i></div></div>` : ''}
    ${shotsH||shotsA ? `<div class="s5-k"><div class="dual"><b class="h">${onH}</b><em>:</em><b class="a">${onA}</b></div><span>İsabetli şut</span><div class="pr"><i>${shotsH} şut</i><i>${shotsA} şut</i></div></div>` : ''}
  </div>`;
  return `<div class="s5">
    <div class="s5-teams"><span class="h"><img loading="lazy" decoding="async" src="${fx.teams.home.logo}" onerror="this.style.visibility='hidden'"><b>${esc(fx.teams.home.name)}</b></span><span class="a"><b>${esc(fx.teams.away.name)}</b><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" onerror="this.style.visibility='hidden'"></span></div>
    ${hero}
    ${group('Maça genel bakış', [['Ball Possession','Topa sahip olma'],['expected_goals','Gol beklentisi (xG)'],['Total Shots','Toplam şut'],['Goalkeeper Saves','Kaleci kurtarışı'],['Corner Kicks','Korner'],['Fouls','Faul'],['Total passes','Pas']])}
    ${group('Şutlar', [['Total Shots','Toplam şut'],['Shots on Goal','İsabetli şut'],['Shots off Goal','İsabetsiz şut'],['Blocked Shots','Engellenen şut'],['Shots insidebox','Ceza sahası içinden'],['Shots outsidebox','Ceza sahası dışından'],...(shotsH||shotsA ? [['_acc','Şut isabeti', accH, accA]] : [])])}
    ${group('Pas', [['Total passes','Toplam pas'],['Passes accurate','İsabetli pas'],['Passes %','Pas isabeti']])}
    ${group('Savunma ve disiplin', [['Goalkeeper Saves','Kaleci kurtarışı'],['goals_prevented','Önlenen gol'],['Fouls','Faul'],['Offsides','Ofsayt'],['Yellow Cards','Sarı kart'],['Red Cards','Kırmızı kart']])}
    ${others.length ? group('Diğer', others) : ''}
  </div>`;
}

// ---------- LİG LİDERLERİ (gol / asist krallığı) ----------
function leaderCardHtml(rank, photo, name, teamLogo, statVal, statLabel, color, badges, playerId, team){
  const teamId = team ? team.id : '', teamName = team ? team.name : '';
  const b = (badges||[]).filter(x=>x[1]!==null && x[1]!==undefined).map(([ic,t])=> esc(String(t))).join(' · ');
  return `<div class="ld-row lb-row" data-pid="${playerId||''}">
    <span class="rk ${rank<=3?'r'+rank:''}">${rank}</span>
    <span class="ph"><img loading="lazy" decoding="async" src="${photo||''}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"></span>
    <span class="n"><b>${esc(name)}</b><small><img loading="lazy" decoding="async" class="lb-team-logo" data-team-id="${teamId}" data-team-name="${esc(teamName)}" data-team-logo="${esc(teamLogo||'')}" src="${teamLogo||''}" onerror="this.style.display='none'">${esc(teamName||'')}${b? ' · '+b:''}</small></span>
    <span class="v">${esc(String(statVal).replace(/[^\d.,\-]/g,'') || statVal)}<small>${esc(statLabel||'')}</small></span>
  </div>`;
}
async function loadLeaderboards(league, season, standingGroups, box){
  if(!box) return;
  const TABS = [['g','Gol krallığı'],['a','Asist krallığı'],['ga','Gol + Asist'],['x','Kaleci & reyting']];
  let tab = 'g'; try{ tab = localStorage.getItem('scoutdosyasi_ldtab') || 'g'; }catch(e){}
  box.innerHTML = `<section class="ld5">
    <div class="ld5-h"><div><b>Lig liderleri</b><small>${esc(league.name||'')} · ${season}/${String(season+1).slice(2)}</small></div><button class="chip-btn" id="ldShare" title="Paylaşım kartı">📸 Kart</button></div>
    <div class="ld5-tabs">${TABS.map(([k,l])=>`<button data-k="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>
    <div id="ldBody"><div class="ld5-pod">${'<div class="skel" style="height:150px"></div>'.repeat(3)}</div>${'<div class="skel" style="height:52px;margin:6px 12px"></div>'.repeat(4)}</div>
    <div id="ldLegacy" style="display:none"></div>
  </section>`;
  const body = box.querySelector('#ldBody'), legacy = box.querySelector('#ldLegacy');
  let scorers = null, assists = null, legacyOn = false, showAll = false;
  const load = async (k)=>{
    try{
      if(k==='g' || k==='ga') scorers = scorers || await apiFetch('/players/topscorers', {league:league.id, season}, 'normal');
      if(k==='a' || k==='ga') assists = assists || await apiFetch('/players/topassists', {league:league.id, season}, 'normal');
    }catch(e){ body.innerHTML = `<div class="ld5-empty">Alınamadı. <button class="chip-btn" id="ldRetry">Tekrar dene</button></div>`; body.querySelector('#ldRetry').onclick = ()=> draw(); return false; }
    return true;
  };
  const listFor = (k)=>{
    const mk = (p, v, sub)=>{ const st = p.statistics[0]||{}; return {id:p.player.id, name:p.player.name, photo:p.player.photo, team:st.team||{}, v, sub, apps:(st.games&&st.games.appearences)||0, min:(st.games&&st.games.minutes)||0, g:(st.goals&&st.goals.total)||0, a:(st.goals&&st.goals.assists)||0, pen:(st.penalty&&st.penalty.scored)||0}; };
    if(k==='g') return (scorers||[]).map(p=> mk(p, (p.statistics[0].goals.total||0)));
    if(k==='a') return (assists||[]).map(p=> mk(p, (p.statistics[0].goals.assists||0)));
    const m = new Map();
    [...(scorers||[]), ...(assists||[])].forEach(p=>{ if(!m.has(p.player.id)) m.set(p.player.id, mk(p, 0)); });
    const arr = [...m.values()]; arr.forEach(x=> x.v = x.g + x.a);
    return arr.sort((a,b)=> b.v-a.v || b.g-a.g);
  };
  const unit = (k)=> k==='g' ? 'gol' : k==='a' ? 'asist' : 'G+A';
  async function draw(){
    box.querySelectorAll('.ld5-tabs button').forEach(b=> b.classList.toggle('on', b.dataset.k===tab));
    if(tab==='x'){
      body.style.display = 'none'; legacy.style.display = '';
      if(!legacyOn){ legacyOn = true; await __loadLeaderboardsOld(league, season, standingGroups, legacy); legacy.querySelectorAll('#lbScorers,#lbAssists').forEach(el=>{ const c = el.closest('.card'); if(c) c.remove(); }); }
      return;
    }
    body.style.display = ''; legacy.style.display = 'none';
    if(!(await load(tab))) return;
    const list = listFor(tab).filter(x=> x.v>0);
    if(!list.length){ body.innerHTML = '<div class="ld5-empty">Bu sezon için veri yok.</div>'; return; }
    const max = list[0].v || 1;
    const per90 = (x)=> x.min ? (x.v/x.min*90).toFixed(2) : '-';
    const pod = list.slice(0,3);
    const order = pod.length===3 ? [pod[1], pod[0], pod[2]] : pod;
    const podHtml = `<div class="ld5-pod">${order.map(x=>{ const r = list.indexOf(x)+1; return `<div class="pd r${r} lb-row" data-pid="${x.id}">
      <span class="ph"><img loading="lazy" decoding="async" src="${x.photo||''}" alt="" onerror="this.style.visibility='hidden'"><i class="md">${r}</i></span>
      <b>${esc(shortName(x.name))}</b>
      <small><img loading="lazy" decoding="async" src="${x.team.logo||''}" alt="" onerror="this.style.display='none'">${esc(x.team.name||'')}</small>
      <span class="big">${x.v}<em>${unit(tab)}</em></span>
      <span class="mini">${x.apps} maç · ${per90(x)} /90</span>
    </div>`; }).join('')}</div>`;
    const rest = list.slice(3, showAll ? 20 : 10);
    const rowsHtml = rest.map((x,i)=> `<div class="ld-row lb-row" data-pid="${x.id}">
      <span class="rk">${i+4}</span>
      <span class="ph"><img loading="lazy" decoding="async" src="${x.photo||''}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"></span>
      <span class="n"><b>${esc(x.name)}</b><small><img loading="lazy" decoding="async" class="lb-team-logo" data-team-id="${x.team.id||''}" data-team-name="${esc(x.team.name||'')}" data-team-logo="${esc(x.team.logo||'')}" src="${x.team.logo||''}" onerror="this.style.display='none'">${esc(x.team.name||'')} · ${x.apps} maç${tab==='ga'? ` · ${x.g}G ${x.a}A` : tab==='g' && x.pen ? ` · ${x.pen} pen.` : ''}</small><i class="bar"><i style="width:${x.v/max*100}%"></i></i></span>
      <span class="v">${x.v}<small>${per90(x)} /90</small></span>
    </div>`).join('');
    body.innerHTML = podHtml + `<div class="ld5-list">${rowsHtml}</div>` + (list.length>10 ? `<button class="ld5-more" id="ldMore">${showAll? 'Daha az göster' : 'İlk 20\'yi göster'}</button>` : '');
    const mb = body.querySelector('#ldMore'); if(mb) mb.onclick = ()=>{ showAll = !showAll; draw(); };
  }
  box.querySelectorAll('.ld5-tabs button').forEach(b=> b.onclick = ()=>{ tab = b.dataset.k; try{ localStorage.setItem('scoutdosyasi_ldtab', tab); }catch(e){} draw(); });
  body.addEventListener('click', (e)=>{
    const tl = e.target.closest('.lb-team-logo');
    if(tl && tl.dataset.teamId){ e.stopPropagation(); openTeam({id:parseInt(tl.dataset.teamId,10), name:tl.dataset.teamName, logo:tl.dataset.teamLogo}); return; }
    const row = e.target.closest('.lb-row'); if(row && row.dataset.pid) openPlayerModalById(parseInt(row.dataset.pid,10), null, undefined);
  });
  box.querySelector('#ldShare').onclick = async ()=>{
    try{
      if(tab==='a'){ await load('a'); openSimpleShareCard('Asist Krallığı Kartı', buildLeaderboardCardHtml('Asist Krallığı', '🅰️', assists, 'assists', '#3B82F6')); }
      else { await load('g'); openSimpleShareCard('Gol Krallığı Kartı', buildLeaderboardCardHtml('Gol Krallığı', '⚽', scorers, 'goals', 'var(--good)')); }
    }catch(e){ showToast('Kart oluşturulamadı'); }
  };
  draw();
}

// ---------- init ----------
(async function init(){
  await loadSettings();
  try{ const rt = localStorage.getItem('scoutdosyasi_route'); if(rt==='direct') state.routeDirect = true; }catch(e){}
  if(state.routeDirect) probeDirectRoute(); else await Promise.race([probeDirectRoute(), new Promise(r=>setTimeout(r,2500))]);
  let _lv = 'home'; try{ _lv = localStorage.getItem('scoutdosyasi_lastview') || 'home'; }catch(e){}
  if(!VIEW_META[_lv] || _lv==='team') _lv = 'home';
  state.view = state.apiKey ? _lv : 'setup';
  render();
  setTimeout(initCloud, 50);
  if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  new MutationObserver(()=>{ if(window.__cloudDirty && !document.querySelector('.modal-overlay')) onCloudChanged(); }).observe(document.body, {childList:true});
})();
</script>
