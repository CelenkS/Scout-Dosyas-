// Sabit dusuk bir hiza (saniyede 4) sabitlemek guvenliydi ama 114 lig gibi agir listelerde
// gereksiz yavasliga sebep oluyordu. Bunun yerine varsayilan olarak HIZLI gidiyoruz, sadece
// gercekten "too many requests" hatasi ALDIĞIMIZDA birkac saniyeligine yavaslayip sonra
// tekrar hizlaniyoruz - yani cogu zaman hizli, sadece gerektiginde frene basiyor.
// ---------- İSTEK KUYRUĞU (dakika limitine saygılı, öncelikli, iptal edilebilir) ----------
// Eski kuyruk saniyede 9 istekle basliyordu; API-Sports limiti dakikada (Pro: 300 ≈ 5/sn, Free: 10/dk).
// Oyuncularim gibi agir ekranlar limiti doldurunca acik olan mac penceresinin istekleri "limit asildi"
// diye patliyordu. Artik:
//  - hem saniye hem dakika penceresi takip ediliyor; limit mesajindaki sayi okunup otomatik ayarlaniyor
//  - limit asilinca hata vermek yerine istek sirada bekleyip kendiliginden tekrar deneniyor
//  - 3 oncelik: high (acik pencere) > normal > low (arka plan toplu yuklemeler)
//  - ekran degisince eski ekranin "low" istekleri kuyruktan atiliyor (bosuna limit yemesin)
const __rlStarts = [];
let __RL_PER_SEC = 5;
let __RL_PER_MIN = 280;
try{ const m = parseInt(localStorage.getItem('scoutdosyasi_rlmin')||'',10); if(m>0) __RL_PER_MIN = m; }catch(e){}
let __rlPauseUntil = 0;
const __rlQ = {high:[], normal:[], low:[]};
let __rlTimer = null;
let __navGen = 0;
// ayni tarayicidaki diger Scout sekmeleri de ayni API anahtarini kullanir - istek zamanlarini paylasiyoruz
let __rlBC = null;
const __rlForeign = [];
try{ __rlBC = new BroadcastChannel('scoutdosyasi_rl'); __rlBC.onmessage = (e)=>{ const d = e.data||{}; if(d.t==='start') __rlForeign.push(d.at); if(d.t==='pause' && d.until > __rlPauseUntil){ __rlPauseUntil = d.until; __rlIndicator(); } }; }catch(e){}
// sunucunun bildirdigi kalan dakika hakki (tum sekme/cihazlarin toplami)
const __apiQuota = {min:null, minLimit:null, day:null, dayLimit:null, t:0};
let __rlExternalHits = 0;
function __rlCanStart(){
  const now = Date.now();
  while(__rlStarts.length && now - __rlStarts[0] > 60000) __rlStarts.shift();
  while(__rlForeign.length && now - __rlForeign[0] > 60000) __rlForeign.shift();
  if(now < __rlPauseUntil) return false;
  if(__rlStarts.length + __rlForeign.length >= __RL_PER_MIN) return false;
  // sunucu "bu dakika az hakkin kaldi" diyorsa yavasla (baska cihaz/sekme de kullaniyor olabilir)
  if(__apiQuota.min!==null && now - __apiQuota.t < 5000 && __apiQuota.min <= 3) return false;
  let lastSec = 0; for(let i=__rlStarts.length-1;i>=0 && now-__rlStarts[i]<1000;i--) lastSec++;
  return lastSec < Math.min(4, __RL_PER_SEC);
}
function __rlPending(){ return __rlQ.high.length + __rlQ.normal.length + __rlQ.low.length; }
function __rlNext(){ return __rlQ.high.shift() || __rlQ.normal.shift() || __rlQ.low.shift(); }
function __rlPump(){
  if(__rlTimer) return;
  __rlTimer = setInterval(()=>{
    if(document.hidden) return; // arka plandaki sekme hic istek atmasin - hak sadece baktigin sekmeye kalsin
    while(__rlPending() && __rlCanStart()){
      const at = Date.now(); __rlStarts.push(at);
      if(__apiQuota.min!==null) __apiQuota.min--;
      try{ __rlBC && __rlBC.postMessage({t:'start', at}); }catch(e){}
      const job = __rlNext();
      job.run();
    }
    __rlIndicator();
    if(!__rlPending()){ clearInterval(__rlTimer); __rlTimer = null; }
  }, 60);
}
function __rlSchedule(taskFn, priority){
  const pr = priority==='high' ? 'high' : priority==='low' ? 'low' : 'normal';
  return new Promise((resolve, reject)=>{
    const job = {gen: __navGen, reject, run: ()=> taskFn().then(resolve, reject)};
    if(pr==='high') __rlQ.high.unshift(job); else __rlQ[pr].push(job);
    __rlPump();
  });
}
function __rlCancelLow(){
  __navGen++;
  const keep = [];
  __rlQ.low.forEach(j=>{ if(j.gen===__navGen) keep.push(j); else j.reject(new Error('İptal edildi')); });
  __rlQ.low = keep;
}
// limit asildi: kalan sureyi hesaplayip kuyrugu duraklat
function __rlTriggerBackoff(msg){
  const m = String(msg||'').match(/(\d+)\s*requests?\s*per\s*minute/i);
  if(m){ const n = parseInt(m[1],10); if(n>0 && n < __RL_PER_MIN){ __RL_PER_MIN = Math.max(1, n-1); __RL_PER_SEC = Math.min(__RL_PER_SEC, Math.max(1, Math.ceil(n/60)+1)); try{ localStorage.setItem('scoutdosyasi_rlmin', String(__RL_PER_MIN)); }catch(e){} } }
  const now = Date.now();
  const mine = __rlStarts.filter(t=> now - t < 60000).length + __rlForeign.length;
  if(mine < __RL_PER_MIN*0.6){ __rlExternalHits++; try{ if(state.proxyBase && !state.routeDirect) probeDirectRoute(); }catch(e){} }   // biz limite yakin degiliz ama sunucu "doldu" diyor -> anahtari baskasi da kullaniyor
  const oldest = __rlStarts.length ? __rlStarts[0] : now;
  const wait = mine >= __RL_PER_MIN ? (60000 - (now - oldest) + 300) : 4000;
  __rlPauseUntil = Math.max(__rlPauseUntil, now + Math.min(62000, Math.max(2500, wait)));
  try{ __rlBC && __rlBC.postMessage({t:'pause', until:__rlPauseUntil}); }catch(e){}
  __rlIndicator();
  return __rlPauseUntil - now;
}
let __rlIndEl = null;
function __rlIndicator(){
  const waiting = Date.now() < __rlPauseUntil && __rlPending() > 0;
  if(!waiting){ if(__rlIndEl){ __rlIndEl.remove(); __rlIndEl = null; } return; }
  if(!__rlIndEl){ __rlIndEl = document.createElement('div'); __rlIndEl.className = 'rlpill'; __rlIndEl.style.cursor='pointer'; __rlIndEl.title='Ayrıntılar için dokun'; __rlIndEl.onclick = ()=>{ try{ openApiLogModal(); }catch(e){} }; document.body.appendChild(__rlIndEl); }
  const s = Math.ceil((__rlPauseUntil - Date.now())/1000);
  const ext = __rlExternalHits>0;
  __rlIndEl.innerHTML = `<span class="spin"></span> ${ext ? 'API anahtarın başka yerde de kullanılıyor' : 'API dakika limiti doldu'} · ${__rlPending()} istek sırada · ~${s} sn · <u>ayrıntı</u>`;
  if(ext && !window.__extWarned){ window.__extWarned = true; setTimeout(()=> showToast('Bu uygulama limite yakın değil ama API "doldu" diyor: açık kalan eski Scout sekmeleri ya da başka bir cihaz aynı anahtarı tüketiyor. Diğer Scout sekmelerini kapat.', 'Tamam', ()=>{}), 200); }
  if(__RL_PER_MIN<=30 && !window.__lowPlanWarned){ window.__lowPlanWarned = true; try{ if(!sessionStorage.getItem('sd_lpw')){ sessionStorage.setItem('sd_lpw','1'); setTimeout(()=>showToast('API planın dakikada '+(__RL_PER_MIN+1)+' istekle sınırlı — yavaşlığın asıl nedeni bu. Ayarlar → API Durumu'), 300); } }catch(e){} }
}
setInterval(()=>{ if(__rlIndEl) __rlIndicator(); }, 1000);

// bir pencere kapaninca o pencerenin arka plan (low) istekleri bosuna limit yemesin
try{
  new MutationObserver(muts=>{
    for(const m of muts) for(const n of m.removedNodes){ if(n.nodeType===1 && n.classList && n.classList.contains('modal-overlay') && (n.querySelector('#pPosBox,#pSeasonMatchesBox,#pInjBox') || !document.querySelector('.modal-overlay'))){ __rlCancelLow(); return; } }
  }).observe(document.body, {childList:true});
}catch(e){}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && __rlPending()) __rlPump(); });

function __isRateLimitMsg(msg){
  return /too many requests|rate limit|limit of requests|istek limiti/i.test(String(msg||''));
}

// ---------- HIZLI ONBELLEK (IndexedDB + bellek, "once eskiyi goster, arkada yenile") ----------
// Eski surum tum onbellegi her istekte localStorage'a tek parca JSON olarak yaziyordu (MB'larca veri,
// her seferinde ana is parcacigini kilitliyordu) ve 5 dk sonra hepsini cope atiyordu. Artik:
//  - her yanit ayri ayri IndexedDB'ye yaziliyor (arka planda, ekrani dondurmadan)
//  - her veri turunun kendi omru var (ulke/lig/takim gunlerce, biten mac istatistigi 30 gun, canli veri saniyeler)
//  - suresi gecmis ama elde olan veri aninda gosteriliyor, yenisi arkada cekiliyor (stale-while-revalidate)
//  - ayni istek ayni anda iki kez gitmiyor (in-flight birlestirme)
try{ localStorage.removeItem('scoutdosyasi_apicache_v1'); }catch(e){} // eski agir onbellek - notlara yer acsin
const __STALE_MAX_MS = 21*24*3600e3;
const __MEM_MAX = 1500;
const __respCache = new Map();          // key -> {v,t,ttl}
const __inflight = new Map();           // key -> Promise
const __finishedFx = new Set();         // bitmis maclarin id'leri (istatistik/olay/kadro artik degismez)
const FINISHED_STATUSES = ['FT','AET','PEN','AWD','WO','CANC','ABD','PST'];
let __idbP = null;
function __idb(){
  if(__idbP) return __idbP;
  __idbP = new Promise(res=>{
    try{
      const rq = indexedDB.open('scoutdosyasi_cache', 1);
      rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore('r'); }catch(e){} };
      rq.onsuccess = ()=> res(rq.result);
      rq.onerror = ()=> res(null);
      rq.onblocked = ()=> res(null);
    }catch(e){ res(null); }
    setTimeout(()=>res(null), 2500);
  });
  return __idbP;
}
async function __idbGet(key){
  const db = await __idb(); if(!db) return undefined;
  return new Promise(res=>{
    try{ const rq = db.transaction('r','readonly').objectStore('r').get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(undefined); }
    catch(e){ res(undefined); }
  });
}
async function __idbPut(key, rec){
  const db = await __idb(); if(!db) return;
  try{ db.transaction('r','readwrite').objectStore('r').put(rec, key); }catch(e){}
}
function __idbPrune(){
  __idb().then(db=>{
    if(!db) return;
    try{
      const tx = db.transaction('r','readwrite'); const st = tx.objectStore('r'); const now = Date.now();
      const rq = st.openCursor();
      rq.onsuccess = ()=>{ const c = rq.result; if(!c) return; const v = c.value; if(!v || now - v.t > __STALE_MAX_MS) c.delete(); c.continue(); };
    }catch(e){}
  });
}
setTimeout(()=>{ (window.requestIdleCallback||setTimeout)(__idbPrune); }, 8000);

function __noteFinished(list){
  if(!Array.isArray(list)) return;
  list.forEach(fx=>{ try{ if(fx && fx.fixture && fx.fixture.status && FINISHED_STATUSES.includes(fx.fixture.status.short)) __finishedFx.add(String(fx.fixture.id)); }catch(e){} });
}
function __lowPlan(){ return typeof __RL_PER_MIN!=='undefined' && __RL_PER_MIN <= 30; }
function __ttlFor(path, params, resp){
  const H = 3600e3, D = 24*H, M = 60e3;
  params = params || {};
  if(path==='/status') return 0;
  if(path==='/fixtures'){
    if(params.live) return __lowPlan() ? 300e3 : 45e3;
    if(params.id){
      const fx = Array.isArray(resp) && resp[0];
      if(fx && fx.fixture && FINISHED_STATUSES.includes(fx.fixture.status.short)) return 30*D;
      if(fx && fx.fixture && new Date(fx.fixture.date) - Date.now() > 2*H) return 15*M;
      return 30e3;
    }
    if(params.date){ const d = params.date, t = new Date().toISOString().slice(0,10); return d < t ? 12*H : d===t ? (__lowPlan()? 5*M : 2*M) : 45*M; }
    if(params.from || params.to || params.next) return 10*M;
    return 30*M;
  }
  if(/^\/fixtures\/(statistics|events|lineups|players)$/.test(path)){
    if(params.fixture && __finishedFx.has(String(params.fixture))) return 30*D;
    if(path==='/fixtures/lineups' && Array.isArray(resp) && !resp.length) return 90e3;
    return __lowPlan() ? 150e3 : 45e3;
  }
  if(path==='/countries') return 30*D;
  if(path==='/leagues') return params.search ? 2*D : 7*D;
  if(path==='/teams') return 7*D;
  if(path==='/coachs' || path==='/trophies' || path==='/transfers') return 3*D;
  if(path==='/standings' || /^\/players\/top/.test(path)) return 3*H;
  if(path==='/players/squads') return D;
  if(path==='/players') return 12*H;
  if(path==='/injuries') return 6*H;
  return H;
}
function __memSet(key, rec){
  __respCache.delete(key); __respCache.set(key, rec);
  if(__respCache.size > __MEM_MAX){ __respCache.delete(__respCache.keys().next().value); }
}
function __buildUrl(path, params){
  const url = new URL(apiBase() + path);
  Object.keys(params||{}).forEach(k=>{ if(params[k]!==undefined && params[k]!==null && params[k]!=='') url.searchParams.set(k, params[k]); });
  return url.toString();
}
let __dailyLimitHit = false;
function __isDailyLimitMsg(msg){ return /for the day|daily|per day|request limit for the day/i.test(String(msg||'')); }
const __apiLog = [];
function __logApi(urlStr, status, err, res){
  try{
    const u = new URL(urlStr); const g = (k)=>{ try{ return res && res.headers.get(k); }catch(e){ return null; } };
    __apiLog.unshift({t:Date.now(), path:u.pathname+(u.search.length>60? u.search.slice(0,60)+'…' : u.search), status, err: err||'', mr:g('x-ratelimit-remaining'), ml:g('x-ratelimit-limit'), dr:g('x-ratelimit-requests-remaining'), via: u.host});
    if(__apiLog.length>60) __apiLog.length = 60;
  }catch(e){}
}
async function __networkJson(urlStr, priority){
  const started = Date.now();
  let netErrors = 0;
  while(true){
    let res;
    try{
      res = await __rlSchedule(()=> fetch(urlStr, { headers: { 'x-apisports-key': state.apiKey } }), priority);
    }catch(e){
      if(e && e.message==='İptal edildi') throw e;
      if(++netErrors <= 2){ await new Promise(r=>setTimeout(r, 800*netErrors)); continue; }
      throw new Error('Bağlantı kurulamadı (internet ya da proxy). '+(e && e.message ? '('+e.message+')' : ''));
    }
    try{
      const h = (k)=>{ const v = parseInt(res.headers.get(k),10); return isNaN(v) ? null : v; };
      const mr = h('x-ratelimit-remaining'), ml = h('x-ratelimit-limit'), dr = h('x-ratelimit-requests-remaining'), dl = h('x-ratelimit-requests-limit');
      if(mr!==null){ __apiQuota.min = mr; __apiQuota.t = Date.now(); }
      if(ml!==null){ __apiQuota.minLimit = ml; if(ml>0 && ml-1 !== __RL_PER_MIN && ml < 2000){ __RL_PER_MIN = Math.max(1, ml-1); } }
      if(dr!==null){ __apiQuota.day = dr; } if(dl!==null){ __apiQuota.dayLimit = dl; }
    }catch(e){}
    let rateMsg = null;
    if(res.status===429){ rateMsg = 'Too many requests'; let body=''; try{ body = (await res.clone().text()).slice(0,160); }catch(e){} __logApi(urlStr, 429, 'HTTP 429 '+body, res); }
    else if(!res.ok){
      if(res.status===401 || res.status===403) throw new Error('API anahtarı geçersiz görünüyor. Ayarlardan kontrol et.');
      if(res.status>=500 && ++netErrors<=2){ await new Promise(r=>setTimeout(r, 1000*netErrors)); continue; }
      throw new Error('API isteği başarısız oldu (kod '+res.status+').');
    }
    let data = null;
    if(!rateMsg){
      data = await res.json();
      if(data.errors){
        const errs = Array.isArray(data.errors) ? data.errors : Object.values(data.errors);
        if(errs.length){
          const msg = String(errs[0]);
          __logApi(urlStr, res.status, msg, res);
          if(__isDailyLimitMsg(msg)){ __dailyLimitHit = true; throw new Error('Günlük API istek hakkın bitti — yarın sıfırlanır. Şimdilik kayıtlı veriler gösteriliyor.'); }
          if(__isRateLimitMsg(msg)) rateMsg = msg;
          else if(/plan|subscription|access to this season|do not have access/i.test(msg)) throw new Error('API planın bu veriye izin vermiyor ('+msg+'). Ayarlar → API Durumu’na bak.');
          else throw new Error(msg);
        }
      }
    }
    if(!rateMsg && data && !(data.errors && Object.values(data.errors).length)) __logApi(urlStr, res.status, '', res);
    else if(!res.ok && !rateMsg) __logApi(urlStr, res.status, 'HTTP '+res.status, res);
    if(rateMsg){
      // hata vermek yerine dakika penceresi acilana kadar bekle ve tekrar dene
      const wait = __rlTriggerBackoff(rateMsg);
      if(Date.now() - started + wait > 95000) throw new Error('API şu an çok yoğun (dakika limiti). Birazdan tekrar dene.');
      continue; // __rlSchedule kuyruktaki duraklamaya kendisi uyar
    }
    return data;
  }
}
// arka planda yenilenen veri degistiyse acik ekrani sessizce tazele
let __bgTimer = null;
function __onBgRefresh(){
  clearTimeout(__bgTimer);
  __bgTimer = setTimeout(()=>{
    if(document.querySelector('.modal-overlay')) return;
    const c = document.getElementById('content');
    if(!c) return;
    if(state.view==='matches') renderMatchesHome(c, {silent:true});
    else if(state.view==='home') renderHome(c, {silent:true});
  }, 800);
}
async function __cachedRequest(kind, path, params, priority){
  params = params || {};
  const urlStr = __buildUrl(path, params);
  const key = (kind==='full' ? 'FULL:' : '') + urlStr;
  const extract = (data)=> kind==='full' ? data : (data.response || []);
  const ttlNoCache = __ttlFor(path, params, null)===0;
  let rec = __respCache.get(key);
  if(!rec && !ttlNoCache){
    rec = await __idbGet(key);
    if(rec) __memSet(key, rec);
  }
  const now = Date.now();
  const fetchFresh = ()=>{
    if(__inflight.has(key)) return __inflight.get(key);
    const p = __networkJson(urlStr, priority).then(data=>{
      const val = extract(data);
      if(path==='/fixtures') __noteFinished(val);
      const ttl = __ttlFor(path, params, val);
      if(ttl>0){ const r = {v:val, t:Date.now(), ttl}; __memSet(key, r); __idbPut(key, r); }
      return val;
    }).finally(()=> __inflight.delete(key));
    __inflight.set(key, p);
    return p;
  };
  if(rec && !ttlNoCache){
    if(path==='/fixtures') __noteFinished(rec.v);
    const age = now - rec.t;
    if(age <= rec.ttl) return rec.v;                      // taze
    const isEmpty = Array.isArray(rec.v) && !rec.v.length;
    if(rec.ttl >= 5*60e3 && !isEmpty && age < __STALE_MAX_MS){ // eski ama is gorur: hemen goster, arkada yenile
      const oldStr = (()=>{ try{ return JSON.stringify(rec.v).length; }catch(e){ return -1; } })();
      fetchFresh().then(v=>{ try{ if(JSON.stringify(v).length!==oldStr) __onBgRefresh(); }catch(e){} }).catch(()=>{});
      return rec.v;
    }
    if(__dailyLimitHit) return rec.v;
    try{ return await fetchFresh(); }catch(e){ if(!/anahtarı geçersiz/.test(e.message)) return rec.v; throw e; } // ag yoksa eldekini kullan
  }
  return fetchFresh();
}

// ---------- api ----------
function apiFetch(path, params, priority){ return __cachedRequest('resp', path, params, priority); }
function apiFetchFull(path, params){ return __cachedRequest('full', path, params); }


function esc(s){ const d=document.createElement('div'); d.textContent = (s==null? '' : s); return d.innerHTML; }

// Puan rengi: 0=koyu kirmizi, ~25%=kirmizi-turuncu, ~50%=sari, ~75%=sari-yesil, 100%=koyu yesil
function lerpColor(c1, c2, t){
  const a = parseInt(c1.slice(1),16), b = parseInt(c2.slice(1),16);
  const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
  const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return '#'+[r,g,bl].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function scoreColor(value, max){
  const pct = Math.max(0, Math.min(1, value/max));
  const stops = ['#7f1d1d', '#d64545', '#e8b93a', '#8bc34a', '#1b5e20'];
  const seg = pct*(stops.length-1);
  const i = Math.min(stops.length-2, Math.floor(seg));
  return lerpColor(stops[i], stops[i+1], seg-i);
}

// Mac/sezon reyting rengi: 0-5 kirmizi, 5-6.5 turuncu, 6.5-7.5 sari, 7.5-8.5 yesil, 8.5-10 mavi
function matchRatingColor(v){
  if(v===null || v===undefined || isNaN(v)) return 'var(--ink2)';
  const stops = ['var(--bad)','#E07B39','#E8C93A','var(--good)','#3B82F6'];
  const bounds = [0,5,6.5,7.5,10]; // stops.length ile ayni sayida referans noktasi (5)
  const n = stops.length;
  for(let i=0;i<n-1;i++){
    if(v<=bounds[i+1] || i===n-2){
      const t = Math.max(0, Math.min(1, (v-bounds[i])/(bounds[i+1]-bounds[i])));
      return lerpColor(stops[i], stops[i+1], t);
    }
  }
  return stops[n-1];
}

function statBarRow(label, homeVal, awayVal, gap){
  gap = gap || 26;
  const hv = parseFloat(homeVal)||0, av = parseFloat(awayVal)||0;
  const total = hv+av || 1;
  const hPct = Math.max(6, (hv/total)*100), aPct = Math.max(6, (av/total)*100);
  const barH = gap>22 ? 16 : gap>17 ? 13 : 10;
  const homeLeads = hv>av, awayLeads = av>hv;
  const pad = gap>22 ? '10px 16px' : gap>17 ? '7px 14px' : '5px 12px';
  return `
    <div style="background:rgba(255,255,255,0.045); border-radius:10px; padding:${pad}; margin-bottom:${Math.round(gap*0.42)}px;">

function pickPrimaryStats(statsArray){
  if(!statsArray || !statsArray.length) return {};
  let best = statsArray[0];
  let bestApps = (best.games && best.games.appearences) || 0;
  for(const s of statsArray){
    const apps = (s.games && s.games.appearences) || 0;
    if(apps > bestApps){ best = s; bestApps = apps; }
  }
  return best;
}
function sumField(arr, path){
  return arr.reduce((acc,s)=>{
    const parts = path.split('.');
    let v = s;
    for(const p of parts){ v = v && v[p]; }
    return acc + (typeof v === 'number' ? v : 0);
  }, 0);
}
function aggregateStats(statsArray){
  if(!statsArray || !statsArray.length) return {};
  const ratings = statsArray.map(s=> s.games && s.games.rating ? parseFloat(s.games.rating) : null).filter(v=>v!==null);
  // pas isabet yuzdesini turnuvalar arasinda TOPLAMAK yanlis (279% gibi anlamsiz sonuclar verir) -
  // pas sayisina gore agirlikli ortalama almak dogrusu
  let accWeightedSum = 0, accWeightTotal = 0;
  statsArray.forEach(s=>{
    const acc = s.passes && parseFloat(s.passes.accuracy);
    const total = (s.passes && s.passes.total) || 0;
    if(!isNaN(acc) && acc!==null && total>0){ accWeightedSum += acc*total; accWeightTotal += total; }
  });
  const passAccuracy = accWeightTotal ? Math.round(accWeightedSum/accWeightTotal) : null;
  return {
    games: {
      appearences: sumField(statsArray,'games.appearences'),
      minutes: sumField(statsArray,'games.minutes'),
      rating: (()=>{ let w=0, t=0; statsArray.forEach(s=>{ const r = s.games && s.games.rating ? parseFloat(s.games.rating) : NaN; const a = (s.games && s.games.appearences) || 0; if(!isNaN(r) && a>0){ t += r*a; w += a; } }); return w ? t/w : (ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : null); })(),
      position: (statsArray[0].games && statsArray[0].games.position) || '-'
    },
    goals: {
      total: sumField(statsArray,'goals.total'), assists: sumField(statsArray,'goals.assists'),
      conceded: sumField(statsArray,'goals.conceded'), saves: sumField(statsArray,'goals.saves')
    },
    shots: { total: sumField(statsArray,'shots.total'), on: sumField(statsArray,'shots.on') },
    passes: { total: sumField(statsArray,'passes.total'), key: sumField(statsArray,'passes.key'), accuracy: passAccuracy },
    tackles: { total: sumField(statsArray,'tackles.total'), blocks: sumField(statsArray,'tackles.blocks'), interceptions: sumField(statsArray,'tackles.interceptions') },
    duels: { total: sumField(statsArray,'duels.total'), won: sumField(statsArray,'duels.won') },
    dribbles: { attempts: sumField(statsArray,'dribbles.attempts'), success: sumField(statsArray,'dribbles.success') },
    fouls: { drawn: sumField(statsArray,'fouls.drawn'), committed: sumField(statsArray,'fouls.committed') },
    cards: { yellow: sumField(statsArray,'cards.yellow'), red: sumField(statsArray,'cards.red') },
    penalty: { won: sumField(statsArray,'penalty.won'), scored: sumField(statsArray,'penalty.scored'), missed: sumField(statsArray,'penalty.missed'), saved: sumField(statsArray,'penalty.saved'), commited: sumField(statsArray,'penalty.commited') }
  };
}

function playerRadarSvg(agg, isGK){
  const games=agg.games||{}, goals=agg.goals||{}, passes=agg.passes||{}, duels=agg.duels||{}, dribbles=agg.dribbles||{}, cards=agg.cards||{}, fouls=agg.fouls||{};
  const apps = games.appearences || 1;
  function norm(val, cap){ return Math.max(0.04, Math.min(1, val/cap)); }
  let axes;
  if(isGK){
    axes = [
      ['Kurtarış', norm((goals.saves||0)/apps, 4)],
      ['Pas İsabeti', norm((passes.accuracy||0)/100, 1)],
      ['İkili Mücadele', norm(duels.total? duels.won/duels.total : 0, 1)],
      ['Disiplin', norm(1 - Math.min(1, ((cards.yellow||0)+(cards.red||0)*2)/apps), 1)],
      ['Top Dağıtımı', norm((passes.total||0)/apps, 30)],
      ['Az Faul', norm(1 - Math.min(1, (fouls.committed||0)/apps), 1)]
    ];
  } else {
    axes = [
      ['Hücum', norm((goals.total||0)/apps, 0.8)],
      ['Yaratıcılık', norm(((goals.assists||0)+(passes.key||0)*0.3)/apps, 1)],
      ['Pas', norm((passes.accuracy||0)/100, 1)],
      ['İkili Mücadele', norm(duels.total? duels.won/duels.total : 0, 1)],
      ['Çalım', norm(dribbles.attempts? dribbles.success/dribbles.attempts : 0, 1)],
      ['Disiplin', norm(1 - Math.min(1, ((cards.yellow||0)+(cards.red||0)*2)/apps), 1)]
    ];
  }
  const n = axes.length;
  const cx=110, cy=108, R=82;
  const pts = axes.map((a,i)=>{
    const ang = -Math.PI/2 + i*(2*Math.PI/n);
    const r = R*a[1];
    return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];
  });
  const poly = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const rp = axes.map((a,i)=>{ const ang=-Math.PI/2+i*(2*Math.PI/n); return [(cx+R*f*Math.cos(ang)).toFixed(1), (cy+R*f*Math.sin(ang)).toFixed(1)]; });
    return `<polygon points="${rp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.4"/>`;
  }).join('');
  const spokes = axes.map((a,i)=>{
    const ang = -Math.PI/2 + i*(2*Math.PI/n);
    return `<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(ang)).toFixed(1)}" y2="${(cy+R*Math.sin(ang)).toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity="0.3"/>`;
  }).join('');
  const labels = axes.map((a,i)=>{
    const ang = -Math.PI/2 + i*(2*Math.PI/n);
    const lx = cx + (R+26)*Math.cos(ang), ly = cy + (R+26)*Math.sin(ang);
    return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink2)" font-family="Inter, sans-serif">${esc(a[0])}</text>`;
  }).join('');
  return `<svg viewBox="0 0 220 224" style="width:100%; max-width:280px; display:block; margin:0 auto;">
    ${rings}${spokes}
    <polygon points="${poly}" fill="rgba(216,166,58,0.35)" stroke="#F2B544" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#F2B544"/>`).join('')}
    ${labels}
  </svg>`;
}

  const duelPct = (duels.total) ? Math.round((duels.won||0)/duels.total*100)+'%' : '-';
  const shotPct = (shots.total) ? Math.round((shots.on||0)/shots.total*100)+'%' : '-';
  const apps = games.appearences || 0;

      <div class="stat-box"><div class="l">Şut (Toplam/İsabetli)</div><div class="v">${shots.total ?? 0} / ${shots.on ?? 0}</div></div>
      <div class="stat-box"><div class="l">Şut İsabet %</div><div class="v">${shotPct}</div></div>
      <div class="stat-box"><div class="l">Pas (Toplam/Anahtar)</div><div class="v">${passes.total ?? 0} / ${passes.key ?? 0}</div></div>
      <div class="stat-box"><div class="l">Pas İsabeti</div><div class="v">${passes.accuracy ?? '-'}${passes.accuracy?'%':''}</div></div>

      <div class="stat-box"><div class="l">Penaltı (Gol/Kaçan/Kazanılan)</div><div class="v">${penalty.scored ?? 0} / ${penalty.missed ?? 0} / ${penalty.won ?? 0}</div></div>
      <div class="stat-box"><div class="l">Kurtarış (Kaleci)</div><div class="v">${goals.saves ?? '-'}</div></div>
      <div class="stat-box"><div class="l">Sarı / Kırmızı</div><div class="v">${cards.yellow ?? 0} / ${cards.red ?? 0}</div></div>
    </div>
  `;
}
function timeAgo(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const diffMin = Math.floor((now-d)/60000);
  if(diffMin<1) return 'az önce';
  if(diffMin<60) return diffMin+' dk önce';
  const diffH = Math.floor(diffMin/60);
  if(diffH<24) return diffH+' sa önce';
  const diffD = Math.floor(diffH/24);
  if(diffD<30) return diffD+' gün önce';
  return d.toLocaleDateString('tr-TR');
}

async function renderHome(content, opts){
  opts = opts || {};
  const cards = [

    ['notes','c-not','Scout defterin','Notlarım', countNoteKeysSync()+' maç notu · formlar · puanlar'],

    ['myplayers','c-oyu','Takip','Oyuncularım', state.followedPlayers.length? '<b>'+state.followedPlayers.length+'</b> oyuncu takipte' : 'Henüz oyuncu eklemedin'],
    ['discover','c-kes','Ara · bul','Keşfet','Lig, takım ve oyuncu arama'],
    ['standings','c-pua','Tablolar','Puan Durumu','Lig sıralaması ve krallıklar'],
    ['sozluk','c-soz','Öğren','Taktik Sözlüğü','Half space, gegenpress... 90+ terim']
  ];
  const cardsHtml = `<div class="hcards">${cards.map(([k,c,hk,hn,hs])=>`
    <button type="button" class="hcard ${c}" data-go="${k}"><span class="hic">${ICONS[k]}</span><div><div class="hk">${hk}</div><div class="hn">${hn}</div><div class="hs">${hs}</div></div><span class="go">›</span></button>`).join('')}</div>`;
  if(!opts.silent){
    content.innerHTML = `<div class="sect-h">Bugün ve yakında <button data-go="matches">Tümü ›</button></div><div class="card" id="homeFx" style="padding:8px"><div class="skel"></div><div class="skel"></div><div class="skel" style="margin:0"></div></div>
      <div class="sect-h">Bölümler</div>${cardsHtml}<div id="homeNotes"></div>`;
    content.querySelectorAll('[data-go]').forEach(b=>{ b.onclick = ()=> goView(b.getAttribute('data-go')); });
  }
  // son notlar
  (async ()=>{
    const box = content.querySelector('#homeNotes'); if(!box) return;
    const notes = (await listAllNotes('fixture')).filter(n=>payloadHasContent(n.payload)).slice(0,4);
    if(!notes.length){ box.innerHTML=''; return; }
    box.innerHTML = `<div class="sect-h">Son maç notların <button data-go="notes">Tümü ›</button></div><div class="card" style="padding:8px 14px">${notes.map(n=>fixtureNoteRowHtml(n)).join('')}</div>`;
    box.querySelector('[data-go]').onclick = ()=> goView('notes');
    wireFixtureNoteRows(box);
  })();
  // bugun/yakinda
  const fxBox = content.querySelector('#homeFx');
  if(!fxBox) return;
  let data;
  try{ data = await fetchUpcomingFixtures(); }catch(e){ data = null; }
  if(!document.body.contains(fxBox)) return;
  if(!data){ fxBox.innerHTML = `<div class="empty" style="padding:18px">Takip ettiğin takım/lig yok. <br><button class="icon-btn" data-go="discover" style="margin-top:10px">🔍 Keşfet'ten takım ekle</button></div>`; fxBox.querySelector('[data-go]').onclick=()=>goView('discover'); return; }
  const flags = await fixtureFlagSets();
  const now = Date.now();
  let list = data.all.filter(fx=> LIVE_STATUSES.includes(fx.fixture.status.short) || new Date(fx.fixture.date).getTime() > now - 3*3600e3);
  const followedIds = new Set(state.followed.map(t=>t.id));
  list.sort((a,b)=>{
    const al = LIVE_STATUSES.includes(a.fixture.status.short)?0:1, bl = LIVE_STATUSES.includes(b.fixture.status.short)?0:1;
    if(al!==bl) return al-bl;
    const af = (followedIds.has(a.teams.home.id)||followedIds.has(a.teams.away.id))?0:1, bf=(followedIds.has(b.teams.home.id)||followedIds.has(b.teams.away.id))?0:1;
    const ad = new Date(a.fixture.date)-0, bd = new Date(b.fixture.date)-0;
    if(Math.abs(ad-bd) > 20*3600e3) return ad-bd;
    return af-bf || ad-bd;
  });
  list = list.slice(0,5);
  if(!list.length){ fxBox.innerHTML = '<div class="empty" style="padding:18px">Yakında maç görünmüyor.</div>'; return; }
  fxBox.innerHTML = list.map(fx=> matchRowHtml(fx, flags, true)).join('');
  fxBox.querySelectorAll('[data-fx]').forEach(row=>{
    row.onclick = ()=>{ const fx = list.find(f=>String(f.fixture.id)===row.getAttribute('data-fx')); if(fx) openFixtureModal(fx); };
  });
}

    banner.querySelectorAll('.live-banner-card').forEach(card=>{
      card.onclick = ()=>{
        const fx = mine.find(f=>String(f.fixture.id)===card.getAttribute('data-fx'));
        if(fx) openFixtureModal(fx);
      };
    });
  }catch(e){ /* sessizce gec, canli kontrolu opsiyonel bir ozellik */ }

      document.getElementById('connectBtn').textContent = 'Bağlan';
    }
  };
}

function normalizeName(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

async function getScoutLeagues(){
  try{
    const r = await store.get('scoutLeagues');
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return [];
}
async function addScoutLeague(league){
  const list = await getScoutLeagues();
  if(!list.some(l=>l.id===league.id)){ list.push(league); try{ await store.set('scoutLeagues', JSON.stringify(list)); }catch(e){} }
}
async function removeScoutLeague(id){
  const list = (await getScoutLeagues()).filter(l=>l.id!==id);
  try{ await store.set('scoutLeagues', JSON.stringify(list)); }catch(e){}
}

let COUNTRIES_CACHE = null;
async function getCountries(){
  if(COUNTRIES_CACHE && COUNTRIES_CACHE.length) return COUNTRIES_CACHE;

    if(list.length) COUNTRIES_CACHE = list.filter(c=>c.name).sort((a,b)=>a.name.localeCompare(b.name));

  }catch(e){ return COUNTRIES_CACHE || []; } // basarisiz olursa hafizaya "bos" olarak yazmiyoruz - bir sonraki cagri tekrar dener
}

function comboHtml(id, placeholder){
  return `<div class="combo-wrap"><input type="text" id="${id}" placeholder="${esc(placeholder)}" autocomplete="off"><div class="combo-list" id="${id}_list"></div></div>`;
}
function wireCombo(id, items, getLabel, getImage, onSelect){
  const input = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!input || !list) return;
  function render(query){
    const q = (query||'').trim().toLowerCase();
    const filtered = q ? items.filter(it=>getLabel(it).toLowerCase().includes(q)) : items;
    if(!filtered.length){
      list.innerHTML = '<div style="padding:8px 12px; font-size:12px; color:var(--chalk-dim);">Sonuç yok</div>';
    } else {
      list.innerHTML = filtered.slice(0,80).map((it,i)=>`
        <div class="combo-item" data-idx="${i}">
          ${getImage && getImage(it) ? `<img loading="lazy" decoding="async" src="${getImage(it)}" onerror="this.style.visibility='hidden'">` : ''}
          <span>${esc(getLabel(it))}</span>
        </div>
      `).join('');
      list.querySelectorAll('.combo-item').forEach(row=>{
        row.onclick = ()=>{
          const it = filtered[parseInt(row.getAttribute('data-idx'),10)];
          input.value = getLabel(it);
          list.style.display = 'none';
          onSelect(it);
        };
      });
    }
    list.style.display = 'block';
  }
  input.addEventListener('input', ()=> render(input.value));
  input.addEventListener('focus', ()=> render(input.value));
  document.addEventListener('click', (e)=>{ if(e.target!==input && !list.contains(e.target)) list.style.display='none'; });
}

// "harry kane" gibi 2 kelimeli bir arama bulamazsa, otomatik olarak sadece son kelimeyle (soyadi) tekrar dener
// (orta isim iceren kayitli tam isimlerde -orn "Harry Edward Kane"- bitisik arama eslesmeyi kacirabiliyor) - oyuncu ve teknik direktor aramasinda ortak kullaniliyor
async function searchWithFallback(path, query, params){
  let res = await apiFetch(path, {...params, search:query});
  if(!res.length){
    const words = query.trim().split(/\s+/).filter(Boolean);
    if(words.length>1){
      const lastWord = words[words.length-1];
      if(lastWord.length>=3){
        res = await apiFetch(path, {...params, search:lastWord});
      }
    }
  }
  return res;
}

async function runDiscoverSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const results = document.getElementById('results');
  if(!q) return;
  results.innerHTML = '<div class="loading">Aranıyor...</div>';
  const sel = window._playerCascadeSel ? window._playerCascadeSel() : {league:null, team:null};
  const leagueId = sel.league;
  const teamId = sel.team;
  const seasonInput = document.getElementById('playerSearchSeason');
  const searchSeason = seasonInput ? parseInt(seasonInput.value,10) : state.season;

  async function findLeagues(){
    let leagues = await apiFetch('/leagues', {search:q});
    if(!leagues.length) leagues = await apiFetch('/leagues', {country:q});
    return leagues;
  }
  async function findTeams(){
    return apiFetch('/teams', {search:q});
  }
  async function findCoaches(){
    if(q.length<3) return [];
    return searchWithFallback('/coachs', q, {});
  }
  async function findPlayers(){
    if(q.length<3) return [];
    if(teamId){
      // takim secilmisse tum kadroyu cekip aksan/kisaltmadan bagimsiz kendimiz filtreliyoruz
      // (API'nin kendi arama parametresi aksanli isimlerde -orn "Kante" ile "Kanté"- eslesme kacirabiliyor)
      let page=1, totalPages=1, squad=[];
      do{
        const resp = await apiFetchFull('/players', {team:teamId, season:searchSeason, page});
        squad = squad.concat(resp.response);
        totalPages = resp.paging ? resp.paging.total : 1;
        page++;
      } while(page<=totalPages && page<=4);
      // "harry kane" gibi cok kelimeli aramada, her kelimenin isimde AYRI AYRI gecmesi yeterli
      // (bitisik substring aramasi orta isimli oyuncularda -orn "Harry Edward Kane"- kaciriyordu)
      const qWords = normalizeName(q).split(/\s+/).filter(Boolean);
      return squad.filter(pl=>{
        const nf = normalizeName(pl.player.name);
        return qWords.every(w=> nf.includes(w));
      });
    } else if(leagueId){
      return searchWithFallback('/players', q, {league:leagueId, season:searchSeason});
    } else {
      // hicbir sey secilmemisse: API tek basina isim aramasini kabul etmiyor,
      // bu yuzden Scout Ligleri listeni + takip ettigin takimlarin liglerinde otomatik ariyoruz
      const scoutLeagues = await getScoutLeagues();
      const followedLeagueIds = state.followed.filter(t=>t.league && t.league.id).map(t=>t.league.id);
      const searchLeagueIds = [...new Set([...scoutLeagues.map(l=>l.id), ...followedLeagueIds])];
      if(!searchLeagueIds.length) return [];
      const resArr = await Promise.allSettled(searchLeagueIds.map(lid=>searchWithFallback('/players', q, {league:lid, season:searchSeason})));
      const merged = [];
      const seenIds = new Set();
      resArr.forEach(r=>{
        if(r.status!=='fulfilled') return;
        r.value.forEach(pl=>{ if(!seenIds.has(pl.player.id)){ seenIds.add(pl.player.id); merged.push(pl); } });
      });
      return merged;
    }
  }

  try{
    const [leaguesR, teamsR, coachesR, playersR] = await Promise.allSettled([findLeagues(), findTeams(), findCoaches(), findPlayers()]);
    const leagues = leaguesR.status==='fulfilled' ? leaguesR.value : [];
    const teams = teamsR.status==='fulfilled' ? teamsR.value : [];
    const coaches = coachesR.status==='fulfilled' ? coachesR.value : [];
    const players = playersR.status==='fulfilled' ? playersR.value : [];

    if(!leagues.length && !teams.length && !coaches.length && !players.length){
      const scoutLeagues = await getScoutLeagues();
      const followedLeagueIds = state.followed.filter(t=>t.league && t.league.id).map(t=>t.league.id);
      const hasPlayerScope = scoutLeagues.length || followedLeagueIds.length || leagueId || teamId;
      results.innerHTML = `<div class="empty display">Sonuç Yok</div><p style="text-align:center;color:var(--chalk-dim);font-size:12px;">${hasPlayerScope
        ? 'Farklı bir isim ya da sezon yılı dene. En güvenilir sonuç için oyuncularda sadece soyadıyla ara.'
        : 'Lig ve takım araması direkt çalışır. Oyuncu/teknik direktör aramak için de yukarıdan ülke + lig seçip "Scout Listeme Ekle" ile kalıcı kapsam ekle (takip etmene gerek yok), ya da birkaç takım takip et.'}</p>`;
      return;
    }

    const alreadyAdded = leagues.length ? new Set((await getScoutLeagues()).map(l=>l.id)) : new Set();
    let html = '';
    if(leagues.length){
      html += `<h3 style="font-size:13px; color:var(--chalk-dim); margin:10px 0 6px;">🏆 Ligler</h3>` + leagues.slice(0,15).map(l=>`
        <div class="card dossier" style="display:flex; align-items:center; gap:10px;">
          <div class="league-row" data-lid="${l.league.id}" data-lname="${esc(l.league.name)}" data-llogo="${esc(l.league.logo||'')}" style="display:flex; align-items:center; gap:10px; flex:1; cursor:pointer;">
            <img loading="lazy" decoding="async" src="${l.league.logo||''}" onerror="this.style.visibility='hidden'" style="width:32px;height:32px;object-fit:contain;">
            <div><b>${esc(l.league.name)}</b><br><span style="font-size:11.5px; color:var(--chalk-dim);">${esc(l.country.name)} · ${esc(l.league.type||'')}</span></div>
          </div>
          ${alreadyAdded.has(l.league.id)
            ? `<button class="follow-btn" disabled style="opacity:.7;">✓ Zaten Ekli</button>`
            : `<button class="follow-btn add-scout-league-btn" data-lid="${l.league.id}" data-lname="${esc(l.league.name)}" data-llogo="${esc(l.league.logo||'')}">+ Scout Listeme Ekle</button>`}
        </div>
      `).join('');
    }
    if(teams.length){
      html += `<h3 style="font-size:13px; color:var(--chalk-dim); margin:14px 0 6px;">🛡️ Takımlar</h3><div class="grid" id="teamSearchGrid"></div>`;
    }
    if(coaches.length){
      html += `<h3 style="font-size:13px; color:var(--chalk-dim); margin:14px 0 6px;">🎓 Teknik Direktörler</h3>` + coaches.slice(0,15).map(c=>`
        <div class="card dossier coach-row" data-opencoach="${c.id}" style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <img loading="lazy" decoding="async" src="${c.photo||''}" onerror="this.style.visibility='hidden'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
          <div><b>${esc(c.name)}</b><br><span style="font-size:11.5px; color:var(--chalk-dim);">${esc(c.nationality||'')}${c.age? ' · '+c.age+' yaş':''}${c.team && c.team.name? ' · '+esc(c.team.name):''}</span></div>
        </div>
      `).join('');
    }
    if(players.length){
      html += `<h3 style="font-size:13px; color:var(--chalk-dim); margin:14px 0 6px;">⚽ Oyuncular</h3>` + players.slice(0,25).map(pl=>{
        const st = pickPrimaryStats(pl.statistics);
        const teamInfo = st.team || {};
        return `
        <div class="card dossier player-row" data-openplayer="${pl.player.id}">
          <img loading="lazy" decoding="async" src="${pl.player.photo||''}" onerror="this.style.visibility='hidden'">
          <div class="pname"><b>${esc(pl.player.name)}</b><span>${esc((st.games&&st.games.position)||'-')} · ${esc(pl.player.age||'-')} yaş · ${esc(pl.player.nationality||'')}</span></div>
          ${teamInfo.name? `<span class="stat-chip">${esc(teamInfo.name)}</span>` : ''}
        </div>
      `;}).join('');
    }
    results.innerHTML = html;

    if(leagues.length){
      results.querySelectorAll('.league-row').forEach(row=>{
        row.onclick = ()=> showLeagueTeams(row.getAttribute('data-lid'), row.getAttribute('data-lname'), row.getAttribute('data-llogo'), results);
      });
      results.querySelectorAll('.add-scout-league-btn').forEach(btn=>{
        btn.onclick = async (e)=>{
          e.stopPropagation();
          await addScoutLeague({id:parseInt(btn.getAttribute('data-lid'),10), name:btn.getAttribute('data-lname'), logo:btn.getAttribute('data-llogo')});
          btn.textContent = 'Eklendi ✓';
          btn.disabled = true;
        };
      });
    }
    if(teams.length){
      renderTeamGrid(teams.map(t=>t.team), results.querySelector('#teamSearchGrid'));
    }
    if(coaches.length){
      results.querySelectorAll('[data-opencoach]').forEach(row=>{
        row.onclick = ()=>{
          const cid = parseInt(row.getAttribute('data-opencoach'),10);
          const c = coaches.find(x=>x.id===cid);
          if(c) openCoachModal(c);
        };
      });
    }
    if(players.length){
      results.querySelectorAll('[data-openplayer]').forEach(row=>{
        row.onclick = ()=>{
          const pid = row.getAttribute('data-openplayer');
          const pl = players.find(x=>String(x.player.id)===pid);
          const st = pickPrimaryStats(pl.statistics);
          openPlayerModalById(parseInt(pid,10), st.team ? {id:st.team.id, name:st.team.name} : null, searchSeason);
        };
      });
    }
  }catch(e){ results.innerHTML = '<div class="banner">⚠ '+esc(e.message)+'</div>'; }
}

async function showLeagueTeams(leagueId, leagueName, leagueLogo, results, season){
  season = season || state.season;
  results.innerHTML = '<div class="loading">'+esc(leagueName)+' takımları yükleniyor...</div>';
  try{
    const teams = await apiFetch('/teams', {league:leagueId, season:season});
    if(!teams.length){ results.innerHTML = '<div class="empty display">Bu sezon için takım bulunamadı</div><p style="text-align:center;color:var(--chalk-dim);font-size:12px;">Sezon yılını değiştirip tekrar dene.</p>'; return; }
    results.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin:6px 0 10px; flex-wrap:wrap; gap:8px;">
        <h3 style="color:var(--chalk); font-size:16px; margin:0;">${esc(leagueName)}</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="season-pill">Sezon <select id="leagueSeasonInput">${seasonOptionsHtml(season)}</select></div>
          <button class="icon-btn" id="followAllTeamsBtn">⚡ Tüm Takımları Takip Et (${teams.length})</button>
          <button class="icon-btn" id="viewStandingsBtn">Puan Durumunu Gör</button>
        </div>
      </div>
      <div class="grid" id="teamGrid"></div>
    `;
    renderTeamGrid(teams.map(t=>({...t.team, league:{id:leagueId, name:leagueName, logo:leagueLogo}})), document.getElementById('teamGrid'));
    document.getElementById('followAllTeamsBtn').onclick = async ()=>{
      const btn = document.getElementById('followAllTeamsBtn');
      btn.disabled = true; btn.textContent = 'Ekleniyor...';
      const leagueMeta = {id:leagueId, name:leagueName, logo:leagueLogo};
      let added = 0;
      teams.forEach(t=>{
        if(!state.followed.some(f=>f.id===t.team.id)){
          state.followed.push({id:t.team.id, name:t.team.name, logo:t.team.logo, country:t.team.country, league:leagueMeta});
          added++;
        }
      });
      await saveFollowed();
      renderTeamGrid(teams.map(t=>({...t.team, league:leagueMeta})), document.getElementById('teamGrid'));
      btn.textContent = added ? `✓ ${added} Takım Eklendi` : 'Hepsi Zaten Ekliydi';
      renderNavCountOnly();
    };
    document.getElementById('viewStandingsBtn').onclick = ()=>{
      state.standingsLeague = {id:leagueId, name:leagueName, logo:leagueLogo};
      state.view = 'standings'; render();
    };
    document.getElementById('leagueSeasonInput').addEventListener('change', (e)=>{
      const v = parseInt(e.target.value,10);
      if(v && v>1990 && v<2100) showLeagueTeams(leagueId, leagueName, leagueLogo, results, v);
    });
  }catch(e){ results.innerHTML = '<div class="banner">⚠ '+esc(e.message)+'</div>'; }
}

function renderTeamGrid(teams, container){
  container.innerHTML = teams.map(t=>{
    const isFollowed = state.followed.some(f=>f.id===t.id);
    return `
      <div class="card dossier team-card">
        <img loading="lazy" decoding="async" src="${t.logo||''}" onerror="this.style.visibility='hidden'">
        <div class="info" data-open="${t.id}"><b>${esc(t.name)}</b><span>${esc(t.country||'')}</span></div>
        <a href="https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=${encodeURIComponent(t.name)}" target="_blank" rel="noopener" onclick="event.stopPropagation();" title="Transfermarkt'ta Ara" style="text-decoration:none; font-size:15px; margin-right:2px;">🔗</a>
        <button class="follow-btn ${isFollowed?'on':''}" data-follow="${t.id}">${isFollowed?'Bırak':'Takip Et'}</button>
      </div>
    `;
  }).join('');
  container.querySelectorAll('[data-follow]').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const id = parseInt(btn.getAttribute('data-follow'),10);
      const team = teams.find(t=>t.id===id);
      const idx = state.followed.findIndex(f=>f.id===id);
      if(idx>=0){ state.followed.splice(idx,1); } else { state.followed.push({id:team.id, name:team.name, logo:team.logo, country:team.country, league:team.league||null}); }
      await saveFollowed();
      btn.textContent = idx>=0 ? 'Takip Et' : 'Bırak';
      btn.classList.toggle('on');
      renderNavCountOnly();
    };

async function fetchUpcomingFixtures(){
  const followedLeagueIds = state.followed.filter(t=>t.league && t.league.id).map(t=>t.league.id);
  const scoutLeagues = await getScoutLeagues();
  const leagueIds = [...new Set([...followedLeagueIds, ...scoutLeagues.map(l=>l.id)])].slice(0,40);
  const leagueIdsSet = new Set(leagueIds);
  const playerTeamIds = [...new Set(state.followedPlayers.filter(fp=>fp.team && fp.team.id).map(fp=>fp.team.id))].filter(id=>{
    // oyuncunun takimi zaten takip edilen bir ligdeyse tekrar cekmeye gerek yok
    const t = state.followed.find(x=>x.id===id); return !(t && t.league && leagueIdsSet.has(t.league.id));
  }).slice(0,20);
  const followedTeamIds = [...new Set(state.followed.filter(t=> !(t.league && leagueIdsSet.has(t.league.id))).map(t=>t.id))].slice(0,30);
  if(!leagueIds.length && !playerTeamIds.length && !followedTeamIds.length) return null;
  const teamIds = [...new Set([...followedTeamIds, ...playerTeamIds])];
  const allTeamIds = new Set([...teamIds, ...state.followed.map(t=>t.id)]);
  const seen = new Set(); const all = []; let failed = 0, total = 0;
  const push = (list)=> list.forEach(fx=>{ if(seen.has(fx.fixture.id)) return; seen.add(fx.fixture.id); all.push(fx); });
  const sources = leagueIds.length + teamIds.length;
  if(sources > 6){
    // COK KAYNAK: lig lig / takim takim (kaynak basina 1 istek) yerine GUN GUN cek (gun basina 1 istek, 8 istek sabit)
    // ve takip ettiklerini burada suz - dakika limiti dusuk planlarda en buyuk tasarruf bu
    const days = [];
    for(let i=-1;i<=6;i++){ const d = new Date(Date.now()+i*864e5); days.push(d.toLocaleDateString('en-CA',{timeZone:'Europe/Istanbul'})); }
    const order = [1,2,0,3,4,5,6,7].map(i=>days[i]); // once bugun ve yarin
    const res = await Promise.allSettled(order.map((d,i)=> apiFetch('/fixtures', {date:d, timezone:'Europe/Istanbul'}, i<2?'high':'normal')));
    total = res.length;
    res.forEach(r=>{
      if(r.status!=='fulfilled'){ failed++; return; }
      push(r.value.filter(fx=> leagueIdsSet.has(fx.league.id) || allTeamIds.has(fx.teams.home.id) || allTeamIds.has(fx.teams.away.id)));
    });
  } else {
    const fromStr = new Date(Date.now() - 24*3600e3).toISOString().slice(0,10);
    const toStr = new Date(Date.now() + 6*24*3600e3).toISOString().slice(0,10);
    const results = await Promise.allSettled([
      ...leagueIds.map(lid=> apiFetch('/fixtures', {league:lid, season:state.season, from:fromStr, to:toStr}, 'high')),
      ...teamIds.map(tid=> apiFetch('/fixtures', {team:tid, season:state.season, from:fromStr, to:toStr}, 'high'))
    ]);
    total = results.length;
    results.forEach(r=>{ if(r.status!=='fulfilled'){ failed++; return; } push(r.value); });
  }
  all.sort((a,b)=> new Date(a.fixture.date)-new Date(b.fixture.date));
  return {all, failed, total};
}
async function fixtureFlagSets(){
  const notes = new Set(), watched = new Set();
  try{ const r = await store.list('note:fixture:'); (r.keys||[]).forEach(k=> notes.add(k.split(':').pop())); }catch(e){}
  try{ const r = await store.list('watched:fixture:'); (r.keys||[]).forEach(k=> watched.add(k.split(':').pop())); }catch(e){}
  return {notes, watched};
}
function fxIsPlayed(fx){ return ['FT','AET','PEN'].includes(fx.fixture.status.short); }
function matchRowHtml(fx, flags, showDay){
  const s = fx.fixture.status.short;
  const played = fxIsPlayed(fx);
  const isLive = LIVE_STATUSES.includes(s);
  const d = new Date(fx.fixture.date);
  let mid;
  if(isLive) mid = `<span class="sc live">${fx.goals.home ?? 0} - ${fx.goals.away ?? 0}</span><span class="livepill"><span class="live-dot"></span>${fx.fixture.status.elapsed? fx.fixture.status.elapsed+"'" : 'CANLI'}</span>`;
  else if(played) mid = `<span class="sc">${fx.goals.home ?? '-'} - ${fx.goals.away ?? '-'}</span><span class="lg">MS${showDay? ' · '+d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}) : ''}</span>`;
  else if(['PST','CANC','ABD'].includes(s)) mid = `<span class="sc">—</span><span class="lg">${s==='PST'?'Ertelendi':'İptal'}</span>`;
  else {
    const dayTxt = showDay ? (()=>{ const t=new Date(); t.setHours(0,0,0,0); const x=new Date(d); x.setHours(0,0,0,0); const df=Math.round((x-t)/864e5); return df===0?'Bugün':df===1?'Yarın':d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}); })() : '';
    mid = `<span class="sc time">${d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span>${dayTxt? `<span class="lg">${dayTxt}</span>`:''}`;
  }
  const id = String(fx.fixture.id);
  const fl = [];
  if(flags && flags.notes.has(id)) fl.push('<span class="mflag">📝 NOT</span>');
  if(flags && flags.watched.has(id)) fl.push('<span class="mflag w">✓ İZLENDİ</span>');
  return `
    <div class="mrow" data-fx="${id}">
      <div class="tm"><img loading="lazy" decoding="async" src="${fx.teams.home.logo}" loading="lazy" decoding="async" alt="" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.home.name)}</span></div>
      <div class="mid">${mid}<span class="lg"><img loading="lazy" decoding="async" src="${fx.league.logo}" loading="lazy" alt="" onerror="this.style.display='none'">${esc(fx.league.name||'')}</span></div>
      <div class="tm away"><span>${esc(fx.teams.away.name)}</span><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" loading="lazy" decoding="async" alt="" onerror="this.style.visibility='hidden'"></div>
      ${fl.length? `<div class="flags">${fl.join('')}</div>` : ''}
    </div>`;
}
async function renderMatchesHome(content, opts){
  opts = opts || {};
  if(!opts.silent) content.innerHTML = '<div class="card" style="padding:8px">'+'<div class="skel"></div>'.repeat(6)+'</div>';
  let data;
  try{ data = await fetchUpcomingFixtures(); }catch(e){ content.innerHTML = '<div class="banner">⚠ '+esc(e.message)+'</div>'; return; }
  if(!document.body.contains(content)) return;
  if(!data){
    content.innerHTML = `
      <div class="card dossier empty">
        <div class="display">Henüz takip edilen lig yok</div>
        <p>Takip ettiğin takımların ligindeki, takip ettiğin oyuncuların takımlarındaki ve Scout Ligleri listendeki maçlar burada otomatik listelenir.</p>
        <p><button class="icon-btn" data-go="discover">🔍 Keşfet'e git</button></p>
      </div>`;
    content.querySelector('[data-go]').onclick = ()=> goView('discover');
    return;
  }
  const all = data.all;
  const flags = await fixtureFlagSets();
  const followedIds = new Set([...state.followed.map(t=>t.id), ...state.followedPlayers.filter(p=>p.team).map(p=>p.team.id)]);
  const f = state.matchFilter || 'all';
  const filtered = all.filter(fx=>{
    if(f==='live') return LIVE_STATUSES.includes(fx.fixture.status.short);
    if(f==='mine') return followedIds.has(fx.teams.home.id) || followedIds.has(fx.teams.away.id);
    if(f==='notes') return flags.notes.has(String(fx.fixture.id));
    if(f==='played') return fxIsPlayed(fx);
    return true;
  });
  const liveCount = all.filter(fx=>LIVE_STATUSES.includes(fx.fixture.status.short)).length;
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  function dayLabel(d){
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diff = Math.round((dd-todayD)/864e5);
    if(diff===0) return 'Bugün';
    if(diff===1) return 'Yarın';
    if(diff===-1) return 'Dün';
    return dd.toLocaleDateString('tr-TR', {day:'numeric', month:'long', weekday:'long'});
  }
  const groups = {};
  filtered.forEach(fx=>{ const l = dayLabel(fx.fixture.date); (groups[l]=groups[l]||[]).push(fx); });
  // Dun en sona degil, kendi tarihine gore basta durur; ama once bugune kaydiralim
  const chips = [['all','Tümü',all.length],['live','🔴 Canlı',liveCount],['mine','⭐ Takımlarım',null],['played','Bitenler',null],['notes','📝 Notlu',null]];
  const html = `
    <div class="mfilter">${chips.map(([k,l,c])=>`<button data-mf="${k}" class="${f===k?'active':''}">${l}${c!==null&&c!==undefined&&k!=='all'? ' · '+c : ''}</button>`).join('')}</div>
    ${data.failed? `<div class="refresh-note">⚠ ${data.failed}/${data.total} kaynak yüklenemedi (istek limiti olabilir)</div>` : ''}
    ${!filtered.length ? `<div class="card empty" style="margin-top:12px"><div class="display">Bu filtrede maç yok</div><p>Başka bir filtre seç.</p></div>` : Object.entries(groups).map(([label, fixtures])=>`
      <div class="sect-h"><span>${esc(label)}</span><span style="letter-spacing:0">${fixtures.length} maç</span></div>
      <div class="card" style="padding:4px 6px">${fixtures.map(fx=> matchRowHtml(fx, flags)).join('')}</div>
    `).join('')}
  `;
  content.innerHTML = html;
  content.querySelectorAll('[data-mf]').forEach(b=>{ b.onclick = ()=>{ state.matchFilter = b.getAttribute('data-mf'); renderMatchesHome(content, {silent:true}); }; });
  content.querySelectorAll('[data-fx]').forEach(row=>{
    row.onclick = ()=>{ const fx = all.find(x=>String(x.fixture.id)===row.getAttribute('data-fx')); if(fx) openFixtureModal(fx); };
  });
  // bugune kaydir (ilk acilista)
  if(!opts.silent){
    const heads = [...content.querySelectorAll('.sect-h span:first-child')];
    const t = heads.find(h=>h.textContent==='Bugün');
    if(t && heads[0]!==t){ setTimeout(()=>{ const y = t.getBoundingClientRect().top + window.scrollY - 12; window.scrollTo({top:y, behavior:'smooth'}); }, 60); }
  }
}

async function fetchCareerStatistics(playerId, priority){
  // once oyuncunun hangi sezonlarda verisi oldugunu 1 istekle ogren, sonra sadece o sezonlari cek
  // (eskiden her oyuncu icin koru korune 15 sezon = 15 istek atiliyordu -> limit doluyordu)
  const base = defaultSeason();
  let years = [];
  try{
    const seasons = await apiFetch('/players/seasons', {player:playerId}, priority);
    years = (seasons||[]).map(Number).filter(y=> y && y<=base+1).sort((a,b)=>b-a).slice(0,15);
  }catch(e){ if(e.message==='İptal edildi') throw e; }
  if(!years.length){ for(let y=base; y>=base-7; y--) years.push(y); }
  const results = await Promise.allSettled(years.map(y=>apiFetch('/players', {id:playerId, season:y}, priority)));
  let combined = [];
  let failed = 0;
  results.forEach((r,i)=>{
    if(r.status!=='fulfilled'){ failed++; return; }
    if(r.value && r.value[0] && r.value[0].statistics){
      r.value[0].statistics.forEach(s=>{
        combined.push({...s, league:{...(s.league||{}), name: ((s.league&&s.league.name)||'Turnuva')+' ('+years[i]+')'}});
      });
    }
  });
  if(failed && failed===results.length) throw new Error('Kariyer verisi alınamadı');
  return combined;
}

            <div style="display:flex; align-items:center; gap:5px; margin-top:3px; font-size:12px; color:var(--ink2); flex-wrap:wrap;">
              ${teamInfo? `<img loading="lazy" decoding="async" src="${teamInfo.logo||''}" loading="lazy" style="width:15px;height:15px;object-fit:contain;" onerror="this.style.visibility='hidden'"><span>${esc(teamInfo.name||'')}</span>` : '<span>Takım bilgisi yok</span>'}
              ${g.position? `<span>· ${esc(POSITION_TR[g.position]||g.position)}</span>` : ''}
            </div>
          </div>
        </div>
        ${scoutData || roleTag || verdictTag ? `
          <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;">
            ${scoutData? `<span style="background:var(--accent); color:var(--accent-ink); font-size:10.5px; font-weight:800; border-radius:99px; padding:3px 9px;">🎯 ${esc(scoutData.label)}</span>` : ''}
            ${roleTag? `<span style="background:var(--soft); font-size:10.5px; font-weight:700; border-radius:99px; padding:3px 9px;">${esc(roleTag)}</span>` : ''}
            ${verdictTag? `<span style="background:var(--soft); font-size:10.5px; font-weight:700; border-radius:99px; padding:3px 9px;">✅ ${esc(verdictTag)}</span>` : ''}
          </div>` : ''}
        ${statsBlock}
      </div>`;
  }
  function visibleRows(){
    let list = rows.filter(({st, scout})=>{
      if(filterVals.league!=='all' && (!st || !st.league || String(st.league.id)!==filterVals.league)) return false;
      if(filterVals.team!=='all' && (!st || !st.team || String(st.team.id)!==filterVals.team)) return false;
      if(filterVals.pos!=='all' && (!st || !st.games || st.games.position!==filterVals.pos)) return false;
      if(filterVals.scoutPos!=='all' && (!scout || scout.scoutPosition!==filterVals.scoutPos)) return false;
      return true;
    });
    const v = (row, f)=> row.agg ? f(row.agg) : -1;
    if(activeSort==='goals') list.sort((a,b)=> v(b,x=>x.goals.total||0) - v(a,x=>x.goals.total||0));
    else if(activeSort==='assists') list.sort((a,b)=> v(b,x=>x.goals.assists||0) - v(a,x=>x.goals.assists||0));
    else if(activeSort==='rating') list.sort((a,b)=> v(b,x=>parseFloat(x.games.rating)||0) - v(a,x=>parseFloat(x.games.rating)||0));
    return list;
  }
  function renderList(){
    const grid = document.getElementById('myPlayersInnerGrid');
    if(!grid) return;
    const list = visibleRows();
    if(!list.length){ grid.innerHTML = '<div class="card empty"><p>Bu filtrelere uyan oyuncu yok.</p></div>'; return; }
    grid.innerHTML = list.map(cardHtml).join('');
    wireGrid(grid);
  }
  function updateCard(row){
    const grid = document.getElementById('myPlayersInnerGrid');
    if(!grid) return;
    const el = grid.querySelector(`[data-pid="${row.fp.id}"]`);
    if(activeSort!=='default'){ renderList(); return; }
    if(el){ el.outerHTML = cardHtml(row); wireGrid(grid); }
  }
  function wireGrid(grid){
    grid.querySelectorAll('[data-pid]').forEach(card=>{
      card.onclick = (e)=>{
        const rb = e.target.closest('.mp-retry');
        if(rb){ e.stopPropagation(); const row = rows.find(x=>String(x.fp.id)===rb.getAttribute('data-retry')); if(row){ row.status='loading'; updateCard(row); loadOne(row, 'high').then(()=>{ updateCard(row); buildFilters(); }); } return; }
        const fp = state.followedPlayers.find(x=>String(x.id)===card.getAttribute('data-pid'));
        if(fp) openPlayerModalById(fp.id, fp.team||null, isCareer ? state.season : seasonNum);
      };
    });
  }
  function buildFilters(){
    const box = document.getElementById('myPlayersFilters'); if(!box) return;
    const leagueSet = new Map(), teamSet = new Map(), posSet = new Set(), scoutPosSet = new Set();
    rows.forEach(({st, scout})=>{
      if(st && st.league) leagueSet.set(st.league.id, st.league);
      if(st && st.team) teamSet.set(st.team.id, st.team);
      if(st && st.games && st.games.position) posSet.add(st.games.position);
      if(scout && scout.scoutPosition) scoutPosSet.add(scout.scoutPosition);
    });
    const sel = (id, key, all, items)=> `<select id="${id}" data-fk="${key}" class="note-area" style="flex:1;min-width:140px;width:auto"><option value="all">${all}</option>${items}</select>`;
    box.innerHTML = [
      leagueSet.size>1 ? sel('myPlayersLeagueFilter','league','Tüm Ligler',[...leagueSet.values()].map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')) : '',
      teamSet.size>1 ? sel('myPlayersTeamFilter','team','Tüm Takımlar',[...teamSet.values()].map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')) : '',
      posSet.size>1 ? sel('myPlayersPosFilter','pos','Tüm Mevkiler',[...posSet].map(p=>`<option value="${esc(p)}">${esc(POSITION_TR[p]||p)}</option>`).join('')) : '',
      scoutPosSet.size>0 ? sel('myPlayersScoutPosFilter','scoutPos','Tüm Scout Mevkileri',[...scoutPosSet].map(k=>`<option value="${k}">🎯 ${esc(POSITION_SCOUT_DATA[k]?POSITION_SCOUT_DATA[k].label:k)}</option>`).join('')) : ''
    ].join('');
    box.style.display = box.innerHTML.trim() ? '' : 'none';
    box.querySelectorAll('select').forEach(s=>{ s.value = filterVals[s.getAttribute('data-fk')] || 'all'; if(s.value==='') s.value='all'; s.onchange = ()=>{ filterVals[s.getAttribute('data-fk')] = s.value; renderList(); }; });
  }
  function progress(){
    const el = document.getElementById('myPlayersProgress'); if(!el) return;
    const done = rows.filter(r=>r.status!=='loading').length, fail = rows.filter(r=>r.status==='error').length;
    el.innerHTML = done<rows.length ? `<span class="spin"></span> ${done}/${rows.length} oyuncu yüklendi` : (fail? `⚠ ${fail} oyuncu yüklenemedi — kartındaki "Tekrar dene"ye bas` : '');
  }
  async function loadOne(row, priority){
    const fp = row.fp;
    row.fallback = false; row.err = '';
    try{
      const note = await getNotePayload('player', fp.id);
      row.scout = (note && note.payload) || null;
      let statistics;
      if(isCareer){
        statistics = await fetchCareerStatistics(fp.id, priority);
      } else {
        const resp = await apiFetch('/players', {id:fp.id, season:seasonNum}, priority);   // hata olursa catch'e duser - eski sezonu YANLIS diye gostermeyiz
        statistics = (resp[0] && resp[0].statistics) || [];
        statistics = statistics.filter(s=> s.games && (s.games.appearences||0) > 0 || (s.games && s.games.minutes));
        if(!statistics.length){
          const fb = await apiFetch('/players', {id:fp.id, season:seasonNum-1}, priority);
          const fbs = ((fb[0] && fb[0].statistics) || []).filter(s=> s.games && (s.games.appearences||0) > 0);
          if(fbs.length){ statistics = fbs; row.fallback = true; }
        }
      }
      if(!statistics.length){ row.status = 'empty'; row.st = null; row.agg = null; return; }
      // mevcut takimini one al (transfer sonrasi eski takim gorunmesin)
      const curTeamId = fp.team && fp.team.id;
      const curEntries = curTeamId ? statistics.filter(s=> s.team && s.team.id===curTeamId) : [];
      row.st = pickPrimaryStats(curEntries.length ? curEntries : statistics);
      row.agg = aggregateStats(statistics);
      row.agg.comps = statistics.length;
      row.status = 'ok';
    }catch(e){
      if(e && e.message==='İptal edildi'){ row.status = 'error'; row.err = 'Yükleme durduruldu'; return; }
      row.status = 'error'; row.err = e && e.message ? e.message.slice(0,80) : 'Yüklenemedi';
    }
  }

  body.querySelectorAll('#myPlayersSortBar button').forEach(btn=>{
    btn.onclick = ()=>{
      body.querySelectorAll('#myPlayersSortBar button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeSort = btn.getAttribute('data-sort');
      renderList();
    };
  });
  renderList(); progress(); buildFilters();

  // 4'er 4'er yukle, her biten kart aninda dolsun
  let idx = 0;
  async function worker(){
    while(idx < rows.length){
      const row = rows[idx++];
      await loadOne(row, 'normal');
      if(window.__mpGen!==myGen || !document.body.contains(body)) return;
      updateCard(row); progress();
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  if(window.__mpGen!==myGen || !document.body.contains(body)) return;
  buildFilters(); progress();
}


function renderMyTeamCards(teams, flagMap, container){
  container.innerHTML = teams.map(t=>{
    const flag = flagMap[t.country] || '';
    return `
      <div class="card dossier team-card" data-open="${t.id}" style="cursor:pointer;">
        <img loading="lazy" decoding="async" src="${t.logo||''}" onerror="this.style.visibility='hidden'">
        <div class="info" style="flex:1; min-width:0;">
          <b>${esc(t.name)}</b>
          <div style="display:flex; align-items:center; gap:5px; margin-top:2px; font-size:11.5px; color:var(--chalk-dim);">
            ${flag? `<img loading="lazy" decoding="async" src="${flag}" style="width:15px;height:11px;object-fit:cover; border-radius:2px; flex-shrink:0;" onerror="this.style.visibility='hidden'">` : ''}
            <span>${esc(t.country||'')}</span>
            <span class="league-name-slot" data-tid="${t.id}">${t.league? ' · '+esc(t.league.name) : ''}</span>
          </div>
        </div>
        <img loading="lazy" decoding="async" class="league-logo-slot" data-tid="${t.id}" src="${t.league&&t.league.logo||''}" style="width:24px;height:24px;object-fit:contain; flex-shrink:0; ${t.league&&t.league.logo?'':'display:none;'}" onerror="this.style.visibility='hidden'">
      </div>
    `;
  }).join('');
  container.querySelectorAll('[data-open]').forEach(card=>{
    card.onclick = ()=>{
      const team = teams.find(t=>String(t.id)===card.getAttribute('data-open'));
      if(team) openTeam(team);
    };
  });
  // lig bilgisi eksik olan takip edilen takimlar icin (genelde genel takim aramasindan eklenenler)
  // ligi arka planda cekip hem karta hem kalici listeye ekliyoruz. leagueChecked bayragi ile
  // basarisiz olan takimlar icin bile bir daha DENEMIYORUZ - yoksa her Takimlarim girisinde
  // ayni basarisiz takimlar icin sonsuza kadar tekrar istek atilip yavasliga sebep oluyordu.
  teams.filter(t=>!t.league && !t.leagueChecked).forEach(async (t)=>{
    try{
      const leagues = await apiFetch('/leagues', {team:t.id, season:state.season}, 'high');
      const primary = leagues.find(l=>l.league.type==='League') || leagues[0];
      const followedEntry = state.followed.find(f=>f.id===t.id);
      if(!primary){
        t.leagueChecked = true;
        if(followedEntry){ followedEntry.leagueChecked = true; await saveFollowed(); }
        return;
      }
      const leagueMeta = {id:primary.league.id, name:primary.league.name, logo:primary.league.logo};
      t.league = leagueMeta;
      t.leagueChecked = true;
      if(followedEntry){ followedEntry.league = leagueMeta; followedEntry.leagueChecked = true; await saveFollowed(); }
      const nameSlot = container.querySelector('.league-name-slot[data-tid="'+t.id+'"]');
      if(nameSlot) nameSlot.textContent = ' · '+primary.league.name;
      const logoSlot = container.querySelector('.league-logo-slot[data-tid="'+t.id+'"]');
      if(logoSlot){ logoSlot.src = primary.league.logo||''; logoSlot.style.display = ''; }
    }catch(e){}
  });
}

async function loadTeamExtras(team, flagImg, venueBox){
  try{
    const countries = await getCountries();
    const c = countries.find(c=>c.name===team.country);
    if(c && c.flag && flagImg){ flagImg.src = c.flag; flagImg.style.display = 'inline-block'; }
  }catch(e){}
  try{
    const resp = await apiFetch('/teams', {id:team.id});
    const info = resp[0];
    if(!info || !venueBox) return;
    const parts = [];
    if(info.team && info.team.founded) parts.push('Kuruluş: '+info.team.founded);
    if(info.venue && info.venue.name) parts.push('Stadyum: '+info.venue.name + (info.venue.capacity? ' (Kapasite: '+info.venue.capacity.toLocaleString('tr-TR')+')' : ''));
    if(info.venue && info.venue.city) parts.push('Şehir: '+info.venue.city);
    venueBox.textContent = parts.join(' · ');
  }catch(e){}
}

async function loadAllStandings(team, container){
  container.innerHTML = '<div class="loading">Turnuvalar bulunuyor...</div>';
  try{
    const leagues = await apiFetch('/leagues', {team:team.id, season:state.teamSeason});
    if(!leagues.length){ container.innerHTML = '<div class="empty display">Turnuva Bulunamadı</div>'; return; }

    container.innerHTML = `
      <div class="subtabs" id="compTabs">
        <button data-cid="all" class="active">Tümü</button>
        ${leagues.map(l=>`<button data-cid="${l.league.id}">${esc(l.league.name)}</button>`).join('')}
      </div>
      <div id="compContent"></div>
    `;
    const compContent = document.getElementById('compContent');
    document.querySelectorAll('#compTabs button').forEach(btn=>{
      btn.onclick = ()=>{
        document.querySelectorAll('#compTabs button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const cid = btn.getAttribute('data-cid');
        if(cid==='all') renderAllCompetitions(); else renderOneCompetition(leagues.find(l=>String(l.league.id)===cid));
      };
    });

    async function renderCompetitionBlock(l, box){
      box.innerHTML = '<div class="loading">Yükleniyor...</div>';
      try{
        const [standingsResp, fixtures] = await Promise.all([
          apiFetch('/standings', {league:l.league.id, season:state.teamSeason}).catch(()=>[]),
          apiFetch('/fixtures', {team:team.id, league:l.league.id, season:state.teamSeason}).catch(()=>[])
        ]);
        const groups = (standingsResp.length && standingsResp[0].league && standingsResp[0].league.standings) ? standingsResp[0].league.standings : [];
        let html = '';

        if(groups.length && groups[0].length){
          html += groups.map((grp,gi)=>`
            <div class="card dossier">
              ${groups.length>1? '<h3 style="font-size:13px;margin:0 0 8px;">Grup '+(gi+1)+'</h3>':''}
              <table class="standings">
                <thead><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AG</th><th>YG</th><th>Av</th><th>P</th></tr></thead>
                <tbody>
                  ${grp.map(row=>{
                    const zc = zoneColor(row.description);
                    const isThisTeam = row.team.id===team.id;
                    return `
                    <tr class="standings-row" data-tid="${row.team.id}" data-tname="${esc(row.team.name)}" data-tlogo="${esc(row.team.logo||'')}" style="cursor:pointer; ${zc?'border-left:4px solid '+zc+';':''} ${isThisTeam?'background:rgba(216,166,58,0.18); font-weight:700;':''}" title="${esc(row.description||'')}">
                      <td class="rank">${row.rank}</td>
                      <td class="team"><img loading="lazy" decoding="async" src="${row.team.logo}" onerror="this.style.visibility='hidden'">${esc(row.team.name)}</td>
                      <td class="num">${row.all.played}</td>
                      <td class="num">${row.all.win}</td>
                      <td class="num">${row.all.draw}</td>
                      <td class="num">${row.all.lose}</td>
                      <td class="num">${row.all.goals.for}</td>
                      <td class="num">${row.all.goals.against}</td>
                      <td class="num">${row.goalsDiff}</td>
                      <td class="num" style="font-weight:700;">${row.points}</td>
                    </tr>
                  `;}).join('')}
                </tbody>
              </table>
            </div>
          `).join('');
        }

        // grup asamasi disindaki (eleme) turlari her zaman ayrica goster: son 16, ceyrek final, yari final, final...
        const byRound = {};
        fixtures.forEach(fx=>{
          const round = fx.league.round || 'Diğer';
          if(round.toLowerCase().includes('group')) return; // bu zaten tablo ile gosteriliyor
          if(!byRound[round]) byRound[round] = [];
          byRound[round].push(fx);
        });
        const roundNames = Object.keys(byRound).sort((a,b)=>{
          const da = new Date(byRound[a][0].fixture.date), db = new Date(byRound[b][0].fixture.date);
          return da-db;
        });
        if(roundNames.length){
          html += roundNames.map(rn=>{
            const matches = byRound[rn].slice().sort((a,b)=> new Date(a.fixture.date)-new Date(b.fixture.date));
            return `
              <div class="card dossier">
                <h3 style="font-size:13px; margin:0 0 8px;">${esc(rn)}</h3>
                ${matches.map(fx=>{
                  const res = fixtureResultForTeam(fx, team.id);
                  const played = ['FT','AET','PEN'].includes(fx.fixture.status.short);
                  const score = played ? (fx.goals.home ?? '-')+' - '+(fx.goals.away ?? '-') : new Date(fx.fixture.date).toLocaleDateString('tr-TR');
                  return `
                  <div class="fx-row" data-fx="${fx.fixture.id}" style="cursor:pointer;">
                    <div class="fx-teams">
                      <img loading="lazy" decoding="async" src="${fx.teams.home.logo}" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.home.name)}</span>
                      <span style="opacity:.5;">vs</span>
                      <span>${esc(fx.teams.away.name)}</span><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" onerror="this.style.visibility='hidden'">

        box.querySelectorAll('.standings-row').forEach(row=>{

            const otherTeam = { id: parseInt(row.getAttribute('data-tid'),10), name: row.getAttribute('data-tname'), logo: row.getAttribute('data-tlogo'), country: team.country, league: {id:l.league.id, name:l.league.name, logo:l.league.logo} };
            openTeam(otherTeam, state.teamSeason);

        box.querySelectorAll('[data-fx]').forEach(row=>{
          row.onclick = ()=>{
            const fx = fixtures.find(f=>String(f.fixture.id)===row.getAttribute('data-fx'));
            if(fx) openFixtureModal(fx);
          };
        });
      }catch(e){ box.innerHTML = '<p style="font-size:12px; color:var(--ink2);">Veri alınamadı: '+esc(e.message)+'</p>'; }

    function renderOneCompetition(l){

        <div style="display:flex; align-items:center; gap:8px; margin:6px 0 8px;">
          <img loading="lazy" decoding="async" src="${l.league.logo||''}" style="width:20px;height:20px;object-fit:contain;" onerror="this.style.visibility='hidden'">

        </div>
        <div id="compBlock"></div>
      `;
      renderCompetitionBlock(l, document.getElementById('compBlock'));
    }

function fixtureResultForTeam(fx, teamId){
  const played = ['FT','AET','PEN'].includes(fx.fixture.status.short);
  if(!played) return null;
  const isHome = fx.teams.home.id===teamId;
  const gf = isHome? fx.goals.home : fx.goals.away;
  const ga = isHome? fx.goals.away : fx.goals.home;
  if(gf==null||ga==null) return null;
  if(gf>ga) return {letter:'G', color:'var(--good)'};
  if(gf<ga) return {letter:'M', color:'var(--bad)'};
  return {letter:'B', color:'#F2B544'};
}

}

      .sort((a,b)=> new Date(b.fixture.date)-new Date(a.fixture.date)).slice(0,5)

function inferPositionLabel(formation, row, colIndex, colsInRow){
  if(row===1) return 'Kaleci';
  const parts = (formation||'').split('-').map(Number).filter(n=>!isNaN(n) && n>0);
  const totalLines = parts.length || 3; // formasyon okunamazsa güvenli varsayım: 3 hat (def/mid/att)
  const lineIndex = row - 2; // 0-tabanli: 0=savunma hatti, son=hucum hatti
  const isDefense = lineIndex<=0;
  const isAttack = lineIndex>=totalLines-1;
  if(isDefense){
    if(colsInRow===1) return 'Stoper';
    if(colIndex===1) return 'Sol Bek';
    if(colIndex===colsInRow) return 'Sağ Bek';
    return 'Stoper';
  }
  if(isAttack){
    if(colsInRow===1) return 'Forvet';
    if(colIndex===1) return 'Sol Kanat';
    if(colIndex===colsInRow) return 'Sağ Kanat';
    return 'Forvet';
  }
  const midCount = totalLines - 2;
  const isLastMidLine = lineIndex === totalLines-2;
  const isFirstMidLine = lineIndex === 1;
  // hucuma en yakin orta saha hatti genisse (3+ kisi), kenarlari aslinda kanat oyuncusudur (orn. 4-2-3-1'in "3" bandi)
  if(isLastMidLine && colsInRow>=3){
    if(colIndex===1) return 'Sol Kanat';
    if(colIndex===colsInRow) return 'Sağ Kanat';
    return 'Ofansif Orta Saha';
  }
  if(midCount<=1) return 'Merkez Orta Saha';
  if(isFirstMidLine) return 'Ön Libero';
  if(isLastMidLine) return 'Ofansif Orta Saha';
  return 'Merkez Orta Saha';
}

function guessScoutPositionKey(pos, r, maxRow, col, rowCount){
  if(pos==='G') return 'gk';
  const isWide = rowCount>=3 && (col===1 || col===rowCount);
  if(pos==='D') return isWide ? 'fb' : 'cb';
  if(pos==='F') return isWide ? 'wing' : 'st';
  if(pos==='M'){
    if(isWide && rowCount>=4) return 'wing';
    if(r<=2) return 'cdm';
    if(r>=maxRow-1) return 'cam';
    return 'cm';
  }
  return 'cm';
}
