  async function loadPositionBox(forceRefresh){
    const box = overlay.querySelector('#pPosBox');
    if(!team || !team.id){ box.innerHTML = '<p style="font-size:12px;color:var(--ink2);">Bunun için bir takım bağlamından açman gerekiyor (Kadro üzerinden gir).</p>'; return; }
    try{
      let occ = forceRefresh ? null : await getCachedPositionHistory(p.player.id, team.id, 'career');
      if(!occ){
        if(forceRefresh) box.innerHTML = '<div class="loading">Yenileniyor... (birden çok sezon taranıyor, biraz sürebilir)</div>';
        occ = await buildPositionHistory(p.player.id, team.id);
        if(occ.length) await setCachedPositionHistory(p.player.id, team.id, 'career', occ);
      }
      if(!occ.length){ box.innerHTML = '<p style="font-size:12px;color:var(--ink2);">Bu kulüpte diziliş verisi bulunamadı.</p>'; return; }
      const groups = {};
      occ.forEach(o=>{
        if(!groups[o.label]) groups[o.label] = {count:0, matches:[]};
        groups[o.label].count++;
        groups[o.label].matches.push(o);
      });
      const ranked = Object.entries(groups).sort((a,b)=>b[1].count-a[1].count);
      const primary = ranked[0];
      const secondary = ranked.slice(1,3); // en fazla 2 yan mevki goster, sade kalsin
      const total = occ.length;

      // her mevki icin sabit, gercekci saha konumu — ham koordinat ortalamasi farkli dizilislerde kayip
      // birbirine cok yakin dusebiliyor ve noktalar ust uste biniyordu; sabit konum bunu tamamen onluyor
      const POSITION_CANONICAL = {
        'Kaleci': {x:50, y:92}, 'Sol Bek': {x:14, y:72}, 'Stoper': {x:50, y:76}, 'Sağ Bek': {x:86, y:72},
        'Ön Libero': {x:50, y:60}, 'Merkez Orta Saha': {x:50, y:46}, 'Ofansif Orta Saha': {x:50, y:27},
        'Sol Kanat': {x:10, y:20}, 'Forvet': {x:50, y:9}, 'Sağ Kanat': {x:90, y:20}
      };
      function posFor(label){ return POSITION_CANONICAL[label] || {x:50, y:50}; }

      function dotHtml(entry, size, color, rank, label){
        const pos = posFor(label);
        return `
          <div style="position:absolute; left:${pos.x}%; top:${pos.y}%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; z-index:${rank===1?3:2};">
            <div style="width:${size}px; height:${size}px; border-radius:50%; background:${color}; border:2.5px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-family:var(--font-head);font-weight:800; font-size:${size>20?13:11}px; color:${rank===1?'var(--ink)':'#fff'}; flex-shrink:0;">${rank}</div>
            <div style="margin-top:3px; font-family:var(--font-head);font-weight:800; font-size:${rank===1?11.5:9.5}px; color:#fff; text-shadow:0 0 5px #000, 0 0 5px #000, 0 1px 2px #000; white-space:nowrap; letter-spacing:.3px;">${esc(label)}</div>
          </div>
        `;
      }
      const zoneLabels = `
        <div style="position:absolute; top:6%; left:50%; transform:translateX(-50%); font-family:var(--font-head);font-weight:800; font-size:9px; color:rgba(255,255,255,0.38); letter-spacing:1.5px; pointer-events:none;">HÜCUM</div>
        <div style="position:absolute; top:47%; left:50%; transform:translate(-50%,-50%); font-family:var(--font-head);font-weight:800; font-size:9px; color:rgba(255,255,255,0.32); letter-spacing:1.5px; pointer-events:none;">ORTA SAHA</div>
        <div style="position:absolute; top:88%; left:50%; transform:translateX(-50%); font-family:var(--font-head);font-weight:800; font-size:9px; color:rgba(255,255,255,0.38); letter-spacing:1.5px; pointer-events:none;">SAVUNMA</div>
      `;
      const dots = zoneLabels + [
        ...secondary.map((s,i)=>dotHtml(s, 24, 'rgba(70,54,22,0.92)', i+2, s[0])),
        dotHtml(primary, 32, 'var(--gold)', 1, primary[0])
      ].join('');

      function pctBar(entry, rank, color){
        const pct = Math.round(entry[1].count/total*100);
        const big = rank===1;
        return `
          <div class="pos-toggle" data-label="${esc(entry[0])}" style="cursor:pointer; display:flex; align-items:center; gap:8px; margin-bottom:${big?10:6}px; ${big? 'background:rgba(216,166,58,0.12); border-radius:8px; padding:6px 8px;' : ''}">
            <span style="width:${big?24:18}px; height:${big?24:18}px; border-radius:50%; background:${color}; color:${rank===1?'var(--ink)':'#fff'}; font-family:var(--font-head);font-weight:800; font-size:${big?13:10}px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${rank}</span>
            <span style="font-family:var(--font-head);font-weight:800; font-size:${big?19:13.5}px; flex:1;">${esc(entry[0])}</span>
            <span style="font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700; font-size:${big?12.5:11.5}px; color:var(--ink2);">${entry[1].count} maç · %${pct}</span>
            <span style="font-size:10px; color:var(--ink2);">▾</span>
          </div>
          <div class="pos-matches" data-for="${esc(entry[0])}" style="display:none; margin:-4px 0 8px 30px; max-height:140px; overflow-y:auto;"></div>
        `;
      }

      box.innerHTML = `
        <div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;">
          <div class="pitch-wrap" style="max-width:260px; flex-shrink:0;">${pitchMarkingsHtml()}${dots}</div>
          <div style="flex:1; min-width:180px;">
            ${pctBar(primary, 1, 'var(--gold)')}
            ${secondary.map((s,i)=>pctBar(s, i+2, 'rgba(90,70,30,0.85)')).join('')}
          </div>
        </div>
        <p style="font-size:10px; color:var(--ink2); margin-top:10px;">Kariyer bazlı: bu kulüpteki son ${total} maçın başlangıç dizilişinden hesaplandı (birden çok sezon). Gerçek zamanlı saha hareketi verisi değildir. Bir mevkiye tıklayınca hangi maçlardan geldiğini görebilirsin. <a href="#" id="pPosRefresh" style="color:var(--gold);">Yenile</a></p>
      `;
      overlay.querySelector('#pPosRefresh').onclick = (e)=>{ e.preventDefault(); loadPositionBox(true); };
      overlay.querySelectorAll('.pos-toggle').forEach(row=>{
        row.onclick = ()=>{
          const label = row.getAttribute('data-label');
          const listBox = overlay.querySelector('.pos-matches[data-for="'+CSS.escape(label)+'"]');
          if(!listBox) return;
          if(listBox.style.display==='none'){
            const matches = (groups[label] && groups[label].matches) || [];
            listBox.innerHTML = matches.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).map(m=>`
              <div style="font-size:11px; color:var(--ink2); padding:3px 0; border-bottom:1px dashed var(--soft);">${new Date(m.date).toLocaleDateString('tr-TR')} · vs ${esc(m.opponent)}</div>
            `).join('');
            listBox.style.display = 'block';
          } else {
            listBox.style.display = 'none';
          }
        };
      });
    }catch(e){ box.innerHTML = '<p style="font-size:12px;color:var(--ink2);">Hesaplanamadı: '+esc(e.message)+'</p>'; }
  }
  loadPositionBox(false);

  function recalcOverall(){
    const all = [
      ...collectAttrs2(overlay, TECH_ATTRS),
      ...collectAttrs2(overlay, MENTAL_ATTRS),
      ...collectAttrs2(overlay, PHYSICAL_ATTRS),
      ...(isGK ? collectAttrs2(overlay, GK_ATTRS) : [])
    ];
    const avg = all.reduce((a,b)=>a+b,0)/all.length;
    const badge = overlay.querySelector('.overall-badge');
    const overallEl = overlay.querySelector('#pOverall');
    overallEl.textContent = attrLevelLabel(avg);
    overallEl.dataset.avg = avg.toFixed(2);
    badge.style.background = scoreColor(avg,4);
  }
  function collectAttrs2(root, attrs){
    return attrs.map(([key])=>{
      const active = root.querySelector('.attr-level-btn.active[data-attr="'+key+'"]');
      return active ? parseInt(active.getAttribute('data-level'),10) : 2;
    });
  }

  wireAttrRows(overlay, recalcOverall);
  recalcOverall();

  function renderPositionForm(){
    const posKey = overlay.querySelector('#pPositionSelect').value;
    const data = POSITION_SCOUT_DATA[posKey];
    const box = overlay.querySelector('#pPositionFormBox');
    const savedQ = saved.questions || {};
    const roleField = scoutChipFieldHtml('pos_role', data.label+' Rolü', '', data.roles, savedQ.pos_role);
    const qFields = data.questions.map(([key,label,chipOptions])=> scoutChipFieldHtml(key,label,'',chipOptions,savedQ[key])).join('');
    box.innerHTML = roleField + qFields;
    wireScoutChips(box);
  }
  renderPositionForm();
  overlay.querySelector('#pPositionSelect').addEventListener('change', renderPositionForm);
  wireScoutChips(overlay);

  overlay.querySelector('.close').onclick = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#pSave').onclick = async ()=>{
    const questionAnswers = collectChipAnswers(overlay);
    const payload = {
      scoutPosition: overlay.querySelector('#pPositionSelect').value,
      tech: collectAttrs(overlay, TECH_ATTRS),
      mental: collectAttrs(overlay, MENTAL_ATTRS),
      physical: collectAttrs(overlay, PHYSICAL_ATTRS),
      questions: questionAnswers,
      comment: questionAnswers.comment || ''
    };
    if(isGK) payload.gk = collectAttrs(overlay, GK_ATTRS);
    payload.overall = parseFloat(overlay.querySelector('#pOverall').dataset.avg || '2'); // 1-4 seviye ortalamasi
    payload.overallLabel = attrLevelLabel(payload.overall);
    const meta = {label:p.player.name, team: team ? team.name : ''};
    const ok = await setNotePayload('player', p.player.id, payload, meta);
    const flash = overlay.querySelector('#pFlash');
    if(ok){
      flash.classList.add('show'); setTimeout(()=>flash.classList.remove('show'),1600); render();
    } else {
      flash.textContent = 'Kayıt başarısız! Tarayıcı depolaması kapalı olabilir.';
      flash.style.color = 'var(--bad)';
      flash.classList.add('show'); setTimeout(()=>flash.classList.remove('show'),3000);
    }
  };
}

      loadStandingsTable(state.standingsLeague, document.getElementById('stResults'));
    });

}

function zoneColor(desc){
  if(!desc) return null;
  const d = desc.toLowerCase();
  if(d.includes('champions league')) return '#3B82F6';
  if(d.includes('europa') || d.includes('conference')) return '#F59E0B';
  if(d.includes('relegation') || d.includes('descent')) return 'var(--bad)';
  if(d.includes('promotion')) return 'var(--good)';
  return null;
}

async function loadStandingsTable(league, container, season){
  season = season || state.season;
  container.innerHTML = '<div class="loading">Puan durumu yükleniyor...</div>';
  try{
    const [resp, fixtures] = await Promise.all([
      apiFetch('/standings', {league:league.id, season:season}),
      apiFetch('/fixtures', {league:league.id, season:season}).catch(()=>[])
    ]);
    const groups = (resp.length && resp[0].league && resp[0].league.standings) ? resp[0].league.standings : [];
    if(!groups.length && !fixtures.length){ container.innerHTML = '<div class="empty display">Puan durumu bulunamadı</div><p style="text-align:center;color:var(--chalk-dim);font-size:12px;">Sezon yılını değiştirmeyi dene.</p>'; return; }
    const leagueCountry = (resp[0] && resp[0].league && resp[0].league.country) || '';
    const leagueMeta = {id:league.id, name:league.name, logo:league.logo};

    let html = `
      <div class="season-pill" style="margin-bottom:10px; display:inline-flex;">Sezon <select id="standingsSeasonInput">${seasonOptionsHtml(season)}</select></div>
      <button class="icon-btn" id="shareStandingsBtn" style="margin-left:8px;">📸 Paylaşım Kartı</button>
      <div style="font-size:11px; color:var(--chalk-dim); margin-bottom:8px; display:flex; gap:14px; flex-wrap:wrap;">
        <span><span style="display:inline-block; width:10px; height:10px; background:#374DF5; border-radius:2px; margin-right:4px;"></span>Şampiyonlar Ligi</span>
        <span><span style="display:inline-block; width:10px; height:10px; background:#F08A24; border-radius:2px; margin-right:4px;"></span>Avrupa Ligi/Konferans</span>
        <span><span style="display:inline-block; width:10px; height:10px; background:#1FAD4B; border-radius:2px; margin-right:4px;"></span>Yükselme</span>
        <span><span style="display:inline-block; width:10px; height:10px; background:#E0301E; border-radius:2px; margin-right:4px;"></span>Düşme</span>
      </div>
    `;

    if(groups.length){
      html += groups.map((grp,gi)=>`
        <div class="card dossier">
          ${groups.length>1? '<h3 style="font-size:14px;margin:0 0 8px;">Grup '+(gi+1)+'</h3>':''}
          <table class="standings">
            <thead><tr><th>#</th><th>Takım</th><th>O</th><th class="xs">G</th><th class="xs">B</th><th class="xs">M</th><th class="xs2">AG</th><th class="xs2">YG</th><th>Av</th><th>P</th><th class="fm">Form</th></tr></thead>
            <tbody>
              ${grp.map(row=>{
                const zc = zoneColor(row.description);
                return `
                <tr class="standings-row ${followSets().teams.has(row.team.id)?'mine':''}" data-tid="${row.team.id}" data-tname="${esc(row.team.name)}" data-tlogo="${esc(row.team.logo||'')}" style="cursor:pointer;" title="${esc(row.description||'')}">
                  <td class="rank"><span class="rk" style="${row.description? 'background:'+zc+';color:#fff' : ''}">${row.rank}</span></td>
                  <td class="team"><img loading="lazy" decoding="async" src="${row.team.logo}" onerror="this.style.visibility='hidden'">${esc(row.team.name)}</td>
                  <td class="num">${row.all.played}</td>
                  <td class="num xs">${row.all.win}</td>
                  <td class="num xs">${row.all.draw}</td>
                  <td class="num xs">${row.all.lose}</td>
                  <td class="num xs2">${row.all.goals.for}</td>
                  <td class="num xs2">${row.all.goals.against}</td>
                  <td class="num">${row.goalsDiff>0?'+':''}${row.goalsDiff}</td>
                  <td class="num pts">${row.points}</td>
                  <td class="fm">${formHtml(row.form)}</td>
                </tr>
              `;}).join('')}
            </tbody>
          </table>
        </div>
      `).join('');
    }

    // grup asamasi disindaki turlari (son 16, ceyrek final, yari final, final...) tum eslesmeleriyle goster
    const byRound = {};
    fixtures.forEach(fx=>{
      const round = fx.league.round || 'Diğer';
      if(round.toLowerCase().includes('group')) return;
      if(!byRound[round]) byRound[round] = [];
      byRound[round].push(fx);
    });
    const roundNames = Object.keys(byRound).sort((a,b)=>{
      const da = new Date(byRound[a][0].fixture.date), db = new Date(byRound[b][0].fixture.date);
      return da-db;
    });
    if(roundNames.length){
      html += roundNames.map(rn=>{
        const matches = byRound[rn].slice().sort((a,b)=> new Date(a.fixture.date)-new Date(b.fixture.date));
        return `
          <div class="card dossier">
            <h3 style="font-size:13px; margin:0 0 8px;">${esc(rn)}</h3>
            ${matches.map(fx=>{
              const played = ['FT','AET','PEN'].includes(fx.fixture.status.short);
              const score = played ? (fx.goals.home ?? '-')+' - '+(fx.goals.away ?? '-') : new Date(fx.fixture.date).toLocaleDateString('tr-TR');
              return `
              <div class="fx-row" data-fx="${fx.fixture.id}" style="cursor:pointer;">
                <div class="fx-teams">
                  <img loading="lazy" decoding="async" src="${fx.teams.home.logo}" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.home.name)}</span>
                  <span style="opacity:.5;">vs</span>
                  <span>${esc(fx.teams.away.name)}</span><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" onerror="this.style.visibility='hidden'">
                </div>
                <div class="fx-score">${score}</div>
              </div>
            `;}).join('')}
          </div>
        `;
      }).join('');
    }

    html += '<div id="leaderboardsBox" style="margin-top:14px"></div>';
    container.innerHTML = html;
    loadLeaderboards(league, season, groups, document.getElementById('leaderboardsBox'));
    const shareStandingsBtn = document.getElementById('shareStandingsBtn');
    if(shareStandingsBtn) shareStandingsBtn.onclick = ()=>{
      if(!groups.length){ alert('Paylaşılacak puan durumu verisi yok.'); return; }
      openSimpleShareCard('Puan Durumu Kartı', buildStandingsCardHtml(leagueMeta, groups));
    };
    document.getElementById('standingsSeasonInput').addEventListener('change', (e)=>{
      const v = parseInt(e.target.value,10);
      if(v && v>1990 && v<2100) loadStandingsTable(league, container, v);
    });
    container.querySelectorAll('.standings-row').forEach(row=>{
      row.onclick = ()=>{
        const team = {
          id: parseInt(row.getAttribute('data-tid'),10),
          name: row.getAttribute('data-tname'),
          logo: row.getAttribute('data-tlogo'),
          country: leagueCountry,
          league: leagueMeta
        };
        openTeam(team, season);
      };
    });
    container.querySelectorAll('[data-fx]').forEach(row=>{
      row.onclick = ()=>{
        const fx = fixtures.find(f=>String(f.fixture.id)===row.getAttribute('data-fx'));
        if(fx) openFixtureModal(fx);
      };
    });
  }catch(e){ container.innerHTML = '<div class="banner">⚠ '+esc(e.message)+'</div>'; }
}

function wireShowMore(box2, renderFn, fullList, initialCount){
  let expanded = false;
  function draw(){
    const list = expanded ? fullList : fullList.slice(0, initialCount);
    box2.innerHTML = renderFn(list) + (fullList.length>initialCount ? `<button class="icon-btn" id="showMoreBtn" style="margin-top:8px; width:100%;">${expanded? 'Daha Az Göster' : 'Daha Fazla Göster ('+(fullList.length-initialCount)+')'}</button>` : '');
    const btn = box2.querySelector('#showMoreBtn');
    if(btn) btn.onclick = ()=>{ expanded = !expanded; draw(); };
  }
  draw();
}

  box.innerHTML = `
    <div style="display:flex; gap:14px; flex-wrap:wrap;">

    </div>

  // olay delegasyonu - dis kutuya (box) TEK SEFER bagliyoruz, ic kutular (lbScorers vb.) async islemler bitince
  // yeniden ciziliyor olsa da dis kutu sabit kaldigi icin tiklama her zaman calisir
  box.addEventListener('click', (e)=>{

      e.stopPropagation();
      openTeam({id:parseInt(teamLogo.getAttribute('data-team-id'),10), name:teamLogo.getAttribute('data-team-name'), logo:teamLogo.getAttribute('data-team-logo')});

    }

    if(row && row.getAttribute('data-pid')){
      openPlayerModalById(parseInt(row.getAttribute('data-pid'),10), null, undefined);
    }
  });

  (async ()=>{
    try{
      const scorers = await apiFetch('/players/topscorers', {league:league.id, season});
      const box2 = document.getElementById('lbScorers');
      if(!scorers.length){ box2.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Veri yok.</p>'; return; }
      wireShowMore(box2, (list)=> list.map((p,i)=>{
        const st = p.statistics[0];
        return leaderCardHtml(i+1, p.player.photo, p.player.name, st.team&&st.team.logo, '⚽ '+st.goals.total, 'gol', 'var(--good)', [['📅', (st.games.appearences??'-')+' maç'],['🅰️', st.goals.assists??0]], p.player.id, st.team);
      }).join(''), scorers.slice(0,20), 5);
      const btn = document.getElementById('shareScorersBtn');
      if(btn){ btn.style.display = ''; btn.onclick = ()=> openSimpleShareCard('Gol Krallığı Kartı', buildLeaderboardCardHtml('Gol Krallığı', '⚽', scorers, 'goals', 'var(--good)')); }
    }catch(e){ const b=document.getElementById('lbScorers'); if(b) b.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Alınamadı.</p>'; }
  })();

  (async ()=>{
    try{
      const assists = await apiFetch('/players/topassists', {league:league.id, season});
      const box2 = document.getElementById('lbAssists');
      if(!assists.length){ box2.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Veri yok.</p>'; return; }
      wireShowMore(box2, (list)=> list.map((p,i)=>{
        const st = p.statistics[0];
        return leaderCardHtml(i+1, p.player.photo, p.player.name, st.team&&st.team.logo, '🅰️ '+st.goals.assists, 'asist', '#3B82F6', [['📅', (st.games.appearences??'-')+' maç'],['⚽', st.goals.total??0]], p.player.id, st.team);
      }).join(''), assists.slice(0,20), 5);
      const btn = document.getElementById('shareAssistsBtn');
      if(btn){ btn.style.display = ''; btn.onclick = ()=> openSimpleShareCard('Asist Krallığı Kartı', buildLeaderboardCardHtml('Asist Krallığı', '🅰️', assists, 'assists', '#3B82F6')); }
    }catch(e){ const b=document.getElementById('lbAssists'); if(b) b.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Alınamadı.</p>'; }
  })();

  function runKeepersAndRatingsScan(){
    const boxKeepers = document.getElementById('lbKeepers');
    const boxRatings = document.getElementById('lbRatings');
    if(boxKeepers) boxKeepers.innerHTML = '<div class="loading">Kadrolar taranıyor...</div>';
    if(boxRatings) boxRatings.innerHTML = '<div class="loading">Kadrolar taranıyor...</div>';
    (async ()=>{
    try{
      const teams = [];
      standingGroups.forEach(grp=> grp.forEach(row=> teams.push(row.team)));
      const uniqueTeams = [...new Map(teams.map(t=>[t.id,t])).values()].slice(0,24); // cok buyuk ligler icin hiz sinirlamasi
      const results = await Promise.allSettled(uniqueTeams.map(t=>Promise.all([
        apiFetch('/players', {team:t.id, season}),
        apiFetch('/fixtures', {team:t.id, season}).catch(()=>[])
      ]).then(([players, fixtures])=>({team:t, players, fixtures}))));

      const keepers = [];
      const ratedPlayers = [];
      results.forEach(r=>{
        if(r.status!=='fulfilled') return;
        const {team, players, fixtures} = r.value;
        // -- kaleciler --
        const gkList = players.filter(p=>{
          const st = pickPrimaryStats(p.statistics);
          return st.games && st.games.position === 'Goalkeeper' && (st.games.appearences||0) >= 5;
        });
        if(gkList.length){
          gkList.sort((a,b)=> (pickPrimaryStats(b.statistics).games.appearences||0) - (pickPrimaryStats(a.statistics).games.appearences||0));
          const gk = gkList[0];
          const st = pickPrimaryStats(gk.statistics);
          const conceded = (st.goals && st.goals.conceded) || 0;
          const apps = st.games.appearences || 1;
          // clean sheet: TAKIMIN o TURNUVADA (st.league ile ayni - kalecinin istatistiginin geldigi kapsamla tutarli olsun diye)
          // 0 gol yedigi mac sayisi. Turnuva bilgisi eslesmiyorsa (once tum sezon karisik sayiliyordu, "5 mac / 34 clean sheet" gibi
          // anlamsiz sonuclar veriyordu) bu satiri atlayip clean sheet'i null birakiyoruz - yanlis sayi gostermektense hic gostermemek daha dogru
          let cleanSheets = null;
          if(st.league && st.league.id){
            const played = (fixtures||[]).filter(fx=> ['FT','AET','PEN'].includes(fx.fixture.status.short) && fx.league && fx.league.id===st.league.id);
            if(played.length){
              const cs = played.filter(fx=>{
                const isHome = fx.teams.home.id===team.id;
                const conc = isHome ? fx.goals.away : fx.goals.home;
                return conc===0;
              }).length;
              cleanSheets = Math.min(cs, apps); // kalecinin kendi mac sayisini asamaz - baska kalecinin oynadigi maclar karismasin
            }
          }
          keepers.push({player:gk.player, team, perMatch: conceded/apps, conceded, apps, cleanSheets});
        }
        // -- en yuksek reytingliler (tum oyuncular, en az 5 mac) --
        players.forEach(p=>{
          const st = pickPrimaryStats(p.statistics);
          const apps = (st.games && st.games.appearences) || 0;
          const rating = st.games && st.games.rating ? parseFloat(st.games.rating) : null;
          if(apps>=5 && rating!==null){
            ratedPlayers.push({player:p.player, team, rating, apps, goals:(st.goals&&st.goals.total)||0, assists:(st.goals&&st.goals.assists)||0});
          }
        });
      });

      if(!keepers.length){ boxKeepers.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Yeterli veri yok.</p>'; }
      else{
        keepers.forEach(k=>{ k.cleanSheetPct = k.cleanSheets!==null ? Math.round(k.cleanSheets/k.apps*100) : null; });
        // asil onemli olan clean sheet orani - onu olani basa, olmayani sona koyup ona gore siraliyoruz
        keepers.sort((a,b)=>{
          if(a.cleanSheetPct===null && b.cleanSheetPct===null) return a.perMatch - b.perMatch;
          if(a.cleanSheetPct===null) return 1;
          if(b.cleanSheetPct===null) return -1;
          return b.cleanSheetPct - a.cleanSheetPct;
        });
        wireShowMore(boxKeepers, (list)=> list.map((k,i)=> leaderCardHtml(i+1, k.player.photo, k.player.name, k.team.logo, (k.cleanSheetPct!==null? '🧤 '+k.cleanSheetPct+'%' : '-'), 'clean sheet', 'var(--good)', [['📅', k.apps+' maç'],['🧤', k.cleanSheets!==null? k.cleanSheets+' clean sheet' : 'veri yok'],['🥅', k.perMatch.toFixed(2)+' gol/maç']], k.player.id, k.team)).join('')
          + '<p style="font-size:9.5px; color:var(--ink2); margin-top:6px;">En az 5 maça çıkan kaleciler arasından, takım başına kadronun en çok oynayan kalecisi baz alınarak hesaplanmıştır. Clean sheet sayısı, kalecinin istatistiklerinin geldiği aynı turnuvadaki takım maçlarından hesaplanır ve kalecinin kendi maç sayısını geçemez.</p>', keepers.slice(0,20), 5);
      }

      if(!ratedPlayers.length){ boxRatings.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Yeterli veri yok.</p>'; }
      else{
        ratedPlayers.sort((a,b)=> b.rating - a.rating);
        wireShowMore(boxRatings, (list)=> list.map((rp,i)=> leaderCardHtml(i+1, rp.player.photo, rp.player.name, rp.team.logo, '⭐ '+rp.rating.toFixed(2), 'rtg', matchRatingColor(rp.rating), [['📅', rp.apps+' maç'],['⚽', rp.goals??0],['🅰️', rp.assists??0]], rp.player.id, rp.team)).join(''), ratedPlayers.slice(0,20), 5);
      }
    }catch(e){
      if(boxKeepers) boxKeepers.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Hesaplanamadı.</p>';
      if(boxRatings) boxRatings.innerHTML = '<p style="font-size:11.5px;color:var(--ink2);">Hesaplanamadı.</p>';
    }
    })();
  }
  const lbKeepersBtn = document.getElementById('lbKeepersBtn');
  if(lbKeepersBtn) lbKeepersBtn.onclick = runKeepersAndRatingsScan;
  const lbRatingsBtn = document.getElementById('lbRatingsBtn');
  if(lbRatingsBtn) lbRatingsBtn.onclick = runKeepersAndRatingsScan;
}

      if(e.target.closest('.note-del-btn')) return;

      if(delKind) await deleteQuickNoteAll(delKind, delId);
      else if(delType) await deleteNoteRecord(delType, delId);
      renderMyNotesTab(content);
    };
  });
}

const DEV_ROADMAP_STEPS = [
  {key:'temel', label:'Temel Eğitim (Grassroots C)', hint:'Amatör sahalarda başlangıç — TFF\'nin açtığı temel antrenörlük kurslarıyla alınır.'},
  {key:'uefac', label:'UEFA C Lisansı', hint:'Antrenörlüğe resmi giriş kapısı — alt yaş gruplarında / amatörde çalışma yetkisi verir.'},
  {key:'uefab', label:'UEFA B Lisansı', hint:'Profesyonel takımlarda yardımcı antrenörlük için gerekir.'},
  {key:'uefaa', label:'UEFA A Lisansı', hint:'Teknik direktörlüğe geçiş basamağı — alt liglerde teknik sorumlu olabilirsin.'},
  {key:'uefapro', label:'UEFA Pro Lisansı', hint:'En üst seviye — Süper Lig ve Avrupa kupalarında teknik direktörlük için şart.'}
];
const DEV_STATUS_ORDER = ['none','planned','inprogress','done'];
const DEV_STATUS_META = {
  none: {label:'Henüz başlamadım', color:'var(--ink2)'},
  planned: {label:'Planlıyorum', color:'#8a8f98'},
  inprogress: {label:'Devam ediyor', color:'#D98C2B'},
  done: {label:'Tamamladım', color:'var(--good, #2E9E5B)'}
};
function nextDevStatus(s){
  const i = DEV_STATUS_ORDER.indexOf(s||'none');
  return DEV_STATUS_ORDER[(i+1) % DEV_STATUS_ORDER.length];
}
async function getDevRoadmap(){
  try{
    const r = await store.get('devroadmap');
    if(!r || !r.value) return {};
    try{ return JSON.parse(r.value) || {}; }catch(e){ return {}; }
  }catch(e){ return {}; }
}
async function setDevRoadmap(map){
  try{ await store.set('devroadmap', JSON.stringify(map)); return true; }catch(e){ return false; }
}
async function listDevNotes(){
  try{
    const r = await store.list('devnote:');
    if(!r || !r.keys) return [];
    const out = [];
    for(const k of r.keys){
      const v = await store.get(k);
      if(v && v.value){ try{ out.push({id:k.split(':').pop(), ...JSON.parse(v.value)}); }catch(e){} }
    }
    out.sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
    return out;
  }catch(e){ return []; }
}
async function addDevNote(text){
  const id = 'dn'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{ await store.set('devnote:'+id, JSON.stringify({text, done:false, date:new Date().toISOString()})); return true; }catch(e){ return false; }
}
async function toggleDevNoteDone(id, cur){
  try{
    const r = await store.get('devnote:'+id);
    if(!r || !r.value) return false;
    const parsed = JSON.parse(r.value);
    parsed.done = !cur;
    await store.set('devnote:'+id, JSON.stringify(parsed));
    return true;
  }catch(e){ return false; }
}
async function deleteDevNote(id){
  try{ await store.delete('devnote:'+id); return true; }catch(e){ return false; }
}

      if(e.target.closest('.dev-step-note-btn')) return;
      const key = row.getAttribute('data-key');
      const map = await getDevRoadmap();
      const cur = map[key] || {};
      cur.status = nextDevStatus(cur.status);
      map[key] = cur;
      await setDevRoadmap(map);
      renderDevTab(content);
    };
  });
  content.querySelectorAll('.dev-step-note-btn').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const key = btn.getAttribute('data-key');
      const map = await getDevRoadmap();
      const cur = map[key] || {};
      const txt = prompt('Bu basamak için not (örn. hangi kursa başvurdun, ne zaman):', cur.note||'');
      if(txt===null) return;
      cur.note = txt.trim();
      map[key] = cur;
      await setDevRoadmap(map);
      renderDevTab(content);
    };
  });
  const addBtn = content.querySelector('#devNoteAddBtn');
  const input = content.querySelector('#devNoteInput');
  const doAdd = async ()=>{
    const txt = (input.value||'').trim();
    if(!txt) return;
    await addDevNote(txt);
    renderDevTab(content);
  };
  if(addBtn) addBtn.onclick = doAdd;
  if(input) input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });
  content.querySelectorAll('.dev-note-check').forEach(el=>{
    el.onclick = async ()=>{
      await toggleDevNoteDone(el.getAttribute('data-id'), el.getAttribute('data-done')==='1');
      renderDevTab(content);
    };
  });
  content.querySelectorAll('.dev-note-del-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      await deleteDevNote(btn.getAttribute('data-id'));
      renderDevTab(content);
    };
  });
}

const glossaryState = {cat:'all', q:''};
function renderGlossary(content){
  const cats = [{key:'all', label:'Tümü'}, ...GLOSSARY_CATS];
  content.innerHTML = `
    <div class="card dossier" style="margin-bottom:14px;">
      <input type="text" id="glossarySearch" placeholder="Terim ara... (örn. half space, gegenpress, xg)" value="${esc(glossaryState.q)}" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--soft2); font-size:13.5px; margin-bottom:10px;">
      <div class="subtabs" id="glossaryCats" style="margin-bottom:0;">
        ${cats.map(c=>`<button data-cat="${c.key}" class="${glossaryState.cat===c.key?'active':''}">${esc(c.label)}</button>`).join('')}
      </div>
    </div>
    <div id="glossaryCount" style="font-size:11.5px; color:var(--ink2); margin:0 2px 8px;"></div>
    <div id="glossaryList"></div>
  `;
  renderGlossaryList(content);
  content.querySelector('#glossarySearch').oninput = (e)=>{ glossaryState.q = e.target.value; renderGlossaryList(content); };
  content.querySelectorAll('#glossaryCats button').forEach(btn=>{
    btn.onclick = ()=>{ glossaryState.cat = btn.getAttribute('data-cat'); renderGlossary(content); };
  });
}
function renderGlossaryList(content){
  const box = content.querySelector('#glossaryList');
  const countBox = content.querySelector('#glossaryCount');
  const q = (glossaryState.q||'').toLocaleLowerCase('tr');
  const filtered = GLOSSARY_TERMS.filter(t=>{
    if(glossaryState.cat!=='all' && t.cat!==glossaryState.cat) return false;
    if(!q) return true;
    return (t.term+' '+t.def).toLocaleLowerCase('tr').includes(q);
  });
  if(countBox) countBox.textContent = filtered.length+' terim';
  if(!filtered.length){ box.innerHTML = '<div class="card dossier empty"><div class="display">Sonuç Yok</div><p>Aramanı ya da kategori filtresini değiştirmeyi dene.</p></div>'; return; }
  const catMeta = Object.fromEntries(GLOSSARY_CATS.map(c=>[c.key,c]));
  box.innerHTML = `<div class="card dossier">${filtered.map(t=>{
    const c = catMeta[t.cat];
    return `
    <div class="note-review-row" style="align-items:flex-start; cursor:default;">
      <span class="badge" style="background:${c.color}; color:#fff; flex-shrink:0;">${c.icon}</span>
      <div class="nbody" style="min-width:0;"><b>${esc(t.term)}</b><p style="white-space:normal; overflow:visible; text-overflow:unset;">${esc(t.def)}</p></div>
    </div>`;
  }).join('')}</div>`;
}

async function clearAllNotes(){
  const prefixes = ['note:', 'qnote:', 'qnotemeta:', 'tactic2:'];
  for(const prefix of prefixes){
    try{
      const r = await store.list(prefix);
      if(r && r.keys){
        for(const k of r.keys){
          await store.delete(k);
        }
      }
    }catch(e){}
  }
}

  if(t==='light' || t==='dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const dark = t==='dark' || (t==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark ? '#1A1D24' : '#374DF5');
}
function matchRatingColor(v){
  v = parseFloat(v);
  if(isNaN(v)) return '#9AA0AB';
  if(v>=9) return '#374DF5';
  if(v>=8) return '#00A9C2';
  if(v>=7) return '#1FAD4B';
  if(v>=6.5) return '#C9A800';
  if(v>=6) return '#EC7E0A';
  return '#E0301E';
}

function msDayStr(off){ return new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'Europe/Istanbul'}); }
function msDayLabel(off){
  if(off===0) return ['Bugün', new Date().toLocaleDateString('tr-TR',{day:'numeric', month:'short'})];
  if(off===-1) return ['Dün', new Date(Date.now()-864e5).toLocaleDateString('tr-TR',{day:'numeric', month:'short'})];
  if(off===1) return ['Yarın', new Date(Date.now()+864e5).toLocaleDateString('tr-TR',{day:'numeric', month:'short'})];

function sofaRowHtml(fx, flags, teamSet, sideOverride){
  const s = fx.fixture.status.short;
  const live = LIVE_STATUSES.includes(s);
  const played = ['FT','AET','PEN'].includes(s);
  const d = new Date(fx.fixture.date);
  const t = d.toLocaleTimeString('tr-TR',{hour:'2-digit', minute:'2-digit'});
  let st;
  if(live) st = `<div class="st live"><b>${s==='HT' ? 'İY' : (fx.fixture.status.elapsed ? fx.fixture.status.elapsed+"'" : 'Canlı')}</b><span>${t}</span></div>`;
  else if(played) st = `<div class="st"><span>${t}</span><b>${s==='PEN'?'Pen.':s==='AET'?'UZ':'MS'}</b></div>`;
  else if(s==='PST') st = `<div class="st"><span>${t}</span><b>Ert.</b></div>`;
  else if(['CANC','ABD'].includes(s)) st = `<div class="st"><span>${t}</span><b>İptal</b></div>`;
  else st = `<div class="st"><span style="color:var(--ink);font-weight:600">${t}</span></div>`;
  const hw = fx.teams.home.winner===true, aw = fx.teams.away.winner===true;
  const decided = played && (hw || aw);
  const cls = (w)=> decided ? (w ? 'w' : 'l') : '';
  const started = live || played;
  const id = String(fx.fixture.id);
  const mine = teamSet && (teamSet.has(fx.teams.home.id) || teamSet.has(fx.teams.away.id));
  return `<div class="sr ${mine?'mine':''}" data-fx="${id}">
    ${st}
    <div class="tms">
      <div class="tm ${cls(hw)}"><img loading="lazy" decoding="async" src="${fx.teams.home.logo}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.home.name)}</span></div>
      <div class="tm ${cls(aw)}"><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.away.name)}</span></div>
    </div>
    <div class="scs ${live?'live':''}">${started ? `<span class="${decided && !hw?'l':''}">${fx.goals.home ?? 0}</span><span class="${decided && !aw?'l':''}">${fx.goals.away ?? 0}</span>` : ''}</div>

async function renderMatchesHome(content, opts){
  opts = opts || {};
  if(state.matchDay===undefined) state.matchDay = 0;
  if(!state.matchScope){ try{ state.matchScope = localStorage.getItem('scoutdosyasi_mscope') || 'mine'; }catch(e){ state.matchScope = 'mine'; } }
  const day = state.matchDay, ds = msDayStr(day);
  const days = []; for(let i=-3;i<=7;i++) days.push(i);
  const strip = `<div class="daystrip">${days.map(i=>{ const [a,b] = msDayLabel(i); return `<button data-day="${i}" class="${i===day?'active':''}"><span>${a}</span><b>${b}</b></button>`; }).join('')}</div>`;
  if(!opts.silent){
    content.innerHTML = strip + '<div id="mBody"><div class="lgrp" style="padding:6px">'+'<div class="skel"></div>'.repeat(8)+'</div></div>';
    const act = content.querySelector('.daystrip .active'); const ds2 = content.querySelector('.daystrip');
    if(act && ds2) ds2.scrollLeft = act.offsetLeft - (ds2.clientWidth - act.offsetWidth)/2;
    content.querySelectorAll('[data-day]').forEach(b=> b.onclick = ()=>{ state.matchDay = parseInt(b.getAttribute('data-day'),10); renderMatchesHome(content); });
  }
  const body = content.querySelector('#mBody'); if(!body) return;
  let list;
  try{ list = await apiFetch('/fixtures', {date:ds, timezone:'Europe/Istanbul'}, 'high'); }
  catch(e){
    body.innerHTML = `<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Maçlar alınamadı: ${esc(e.message)}</span><button class="icon-btn" id="mRetry">Tekrar dene</button></div>`;
    body.querySelector('#mRetry').onclick = ()=> renderMatchesHome(content);
    return;
  }
  if(state.matchDay!==day || !document.body.contains(body)) return;
  list = list.slice();
  if(day===0){
    try{
      const live = await apiFetch('/fixtures', {live:'all'}, 'high');
      const lm = new Map(live.map(f=>[f.fixture.id, f]));
      list = list.map(f=> lm.get(f.fixture.id) || f);
    }catch(e){}
  }
  const {leagues, teams} = followSets();
  const flags = await fixtureFlagSets();
  const hasFollow = leagues.size || teams.size;
  let scope = state.matchScope;
  if(scope==='mine' && !hasFollow) scope = 'all';
  const isMine = (f)=> leagues.has(f.league.id) || teams.has(f.teams.home.id) || teams.has(f.teams.away.id);
  const counts = {
    mine: list.filter(isMine).length,
    live: list.filter(f=> LIVE_STATUSES.includes(f.fixture.status.short)).length,
    notes: list.filter(f=> flags.notes.has(String(f.fixture.id))).length,
    all: list.length
  };
  let shown = list.filter(f=>{
    if(scope==='mine') return isMine(f);
    if(scope==='live') return LIVE_STATUSES.includes(f.fixture.status.short);
    if(scope==='notes') return flags.notes.has(String(f.fixture.id));
    return true;
  });
  // lige gore grupla
  const groups = new Map();
  shown.forEach(f=>{ const k = f.league.id; if(!groups.has(k)) groups.set(k, {league:f.league, items:[]}); groups.get(k).items.push(f); });
  const rank = (g)=>{ const id = g.league.id; if(leagues.has(id)) return 0; if(g.items.some(f=> teams.has(f.teams.home.id) || teams.has(f.teams.away.id))) return 1; const p = PRIORITY_LEAGUES.indexOf(id); return p>=0 ? 2 + p/100 : 3; };
  const arr = [...groups.values()].sort((a,b)=> rank(a)-rank(b) || String(a.league.country||'').localeCompare(String(b.league.country||''),'tr') || String(a.league.name).localeCompare(String(b.league.name),'tr'));
  arr.forEach(g=> g.items.sort((a,b)=> new Date(a.fixture.date)-new Date(b.fixture.date)));
  const openLimit = scope==='all' ? 10 : 999;
  const chips = [['mine','★ Takip ettiklerim', counts.mine],['live','🔴 Canlı', counts.live],['all','Tüm maçlar', counts.all],['notes','📝 Notlu', counts.notes]].filter(c=> c[0]!=='mine' || hasFollow);
  const groupHtml = (g, i)=>{
    const open = i < openLimit;
    const liveN = g.items.filter(f=> LIVE_STATUSES.includes(f.fixture.status.short)).length;
    return `<div class="lgrp ${open?'':'closed'}" data-lid="${g.league.id}">
      <div class="lgrp-h"><span class="lgl"><img loading="lazy" decoding="async" src="${g.league.logo}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"></span>
        <div><b>${esc(g.league.name)}</b><small>${g.league.flag ? `<img loading="lazy" decoding="async" class="fl" src="${g.league.flag}" loading="lazy" alt="" onerror="this.remove()">` : ''}${esc(g.league.country||'')}${g.league.round ? ' · '+esc(String(g.league.round).replace('Regular Season - ','Hafta ')) : ''}</small></div>
        ${liveN ? `<span class="cnt live"><i class="live-dot"></i>${liveN} canlı</span>` : `<span class="cnt">${g.items.length} maç</span>`}
        <button class="lg-tbl" data-tbl="${g.league.id}" data-lname="${esc(g.league.name)}" data-llogo="${esc(g.league.logo||'')}" title="Puan durumu">Tablo</button><span class="chev">⌄</span></div>
      <div class="lgrp-b">${open ? g.items.map(f=> sofaRowHtml(f, flags, teams)).join('') : ''}    </div>`;
  };
  body.innerHTML = `
    <div class="mfilter">${chips.map(([k,l,c])=>`<button data-sc="${k}" class="${scope===k?'active':''}">${l} <span style="opacity:.6">${c}</span></button>`).join('')}</div>
    ${!arr.length ? `<div class="card empty"><div class="display">${scope==='mine' ? 'Bu gün takip ettiğin maç yok' : scope==='live' ? 'Şu an canlı maç yok' : 'Maç yok'}</div><p>${scope==='mine' ? '“Tüm maçlar”a geçebilir ya da başka bir gün seçebilirsin.' : ''}</p></div>` : arr.map(groupHtml).join('')}`;
  body.querySelectorAll('[data-sc]').forEach(b=> b.onclick = ()=>{ state.matchScope = b.getAttribute('data-sc'); try{ localStorage.setItem('scoutdosyasi_mscope', state.matchScope); }catch(e){} renderMatchesHome(content, {silent:true}); });
  const byId = new Map(list.map(f=>[String(f.fixture.id), f]));
  const wireRows = (root)=> root.querySelectorAll('.sr[data-fx]').forEach(r=> r.onclick = ()=>{ const f = byId.get(r.getAttribute('data-fx')); if(f) openFixtureModal(f); });
  body.querySelectorAll('.lgrp').forEach(gEl=>{
    const tb = gEl.querySelector('.lg-tbl');
    if(tb) tb.onclick = (e)=>{ e.stopPropagation(); state.standingsLeague = {id:parseInt(tb.getAttribute('data-tbl'),10), name:tb.getAttribute('data-lname'), logo:tb.getAttribute('data-llogo')}; goView('standings'); };
    gEl.querySelector('.lgrp-h').onclick = ()=>{
      const b = gEl.querySelector('.lgrp-b');
      if(gEl.classList.contains('closed') && !b.innerHTML){ const g = arr.find(x=> String(x.league.id)===gEl.getAttribute('data-lid')); if(g){ b.innerHTML = g.items.map(f=> sofaRowHtml(f, flags, teams)).join(''); wireRows(b); } }
      gEl.classList.toggle('closed');
    };
  });
  wireRows(body);
  // canli mac varsa listeyi dakikada bir tazele
  clearTimeout(window.__mTimer);
  if(day===0 && counts.live){
    window.__mTimer = setTimeout(()=>{ if(state.view==='matches' && state.matchDay===0 && document.body.contains(body) && !document.hidden && !document.querySelector('.modal-overlay')) renderMatchesHome(content, {silent:true}); }, 60000);
  }
}

// ---------- MAÇ DETAY: olaylar + bilgi + en iyiler ----------
function modernEventsHtml(events, fx){
  const icon = (ev)=>{
    if(ev.type==='Goal') return ev.detail==='Own Goal' ? '⚽<small style="color:var(--bad)">KK</small>' : ev.detail==='Penalty' ? '⚽<small>P</small>' : ev.detail==='Missed Penalty' ? '❌' : '⚽';
    if(ev.type==='Card') return ev.detail==='Yellow Card' ? '🟨' : '🟥';
    if(ev.type==='subst') return '🔄';
    if(ev.type==='Var') return '📺';
    return '•';
  };
  const link = (pl, team)=> pl && pl.name ? `<a href="#" class="ev-player-link" data-pid="${pl.id||''}" data-team-id="${team.id}" data-team-name="${esc(team.name)}" data-team-logo="${esc(team.logo||'')}">${esc(pl.name)}</a>` : '';
  // devre ara skorlarini hesapla
  let h = 0, a = 0, htH = null, htA = null, htDone = false;
  const rows = [];
  events.forEach(ev=>{
    if(!htDone && ev.time.elapsed>45){ htDone = true; htH = h; htA = a; rows.push(`<div class="ev-ht"><span>İY ${h} - ${a}</span></div>`); }
    if(ev.type==='Goal' && ev.detail!=='Missed Penalty'){ if(ev.team.id===fx.teams.home.id) h++; else a++; }
    const isHome = ev.team && ev.team.id===fx.teams.home.id;
    let sub = '';
    if(ev.type==='Goal' && ev.assist && ev.assist.name) sub = 'Asist: '+link(ev.assist, ev.team);
    else if(ev.type==='subst' && ev.assist && ev.assist.name) sub = '↔ '+link(ev.assist, ev.team);
    else if(ev.comments) sub = esc(ev.comments);
    const scoreTag = ev.type==='Goal' && ev.detail!=='Missed Penalty' ? ` <span style="color:var(--ink2);font-weight:600">(${h}-${a})</span>` : '';
    const main = link(ev.player, ev.team) + scoreTag;
    const c = `<div class="ev-c ${isHome?'h':'a'}">${isHome? `<div class="tx"><b>${main}</b>${sub?`<small>${sub}</small>`:''}</div><span class="ic">${icon(ev)}</span>` : `<span class="ic">${icon(ev)}</span><div class="tx"><b>${main}</b>${sub?`<small>${sub}</small>`:''}</div>`}</div>`;
    rows.push(`<div class="ev-r ${ev.type==='Goal'&&ev.detail!=='Missed Penalty'?'goal':''}">${isHome? c : '<div></div>'}<span class="ev-m">${ev.time.elapsed}${ev.time.extra?'+'+ev.time.extra:''}'</span>${isHome? '<div></div>' : c}</div>`);
  });
  if(['FT','AET','PEN'].includes(fx.fixture.status.short)) rows.push(`<div class="ev-ht"><span>MS ${fx.goals.home ?? h} - ${fx.goals.away ?? a}</span></div>`);
  const pid = 'bp'+fx.fixture.id+Math.random().toString(36).slice(2,6);
  setTimeout(()=> fillBestPlayers(fx, document.getElementById(pid)), 0);
  return `<div class="bestp" id="${pid}"></div>
    <div class="sect-h">Maç olayları</div>
    <div class="evt">${rows.join('') || '<div class="empty" style="padding:14px">Olay yok</div>'}</div>
    ${matchInfoHtml(fx)}`;
}
function matchInfoHtml(fx){
  const rows = [];
  if(fx.league) rows.push(['Turnuva', esc(fx.league.name||'')+(fx.league.round? ' · '+esc(String(fx.league.round).replace('Regular Season - ','Hafta ')) : '')]);
  rows.push(['Tarih', new Date(fx.fixture.date).toLocaleString('tr-TR',{weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'})]);
  if(fx.fixture.venue && fx.fixture.venue.name) rows.push(['Stadyum', esc(fx.fixture.venue.name)+(fx.fixture.venue.city? ', '+esc(fx.fixture.venue.city) : '')]);
  if(fx.fixture.referee) rows.push(['Hakem', esc(fx.fixture.referee)]);
  return `<div class="sect-h">Maç bilgileri</div><div class="info-card">${rows.map(([k,v])=>`<div class="info-row"><span>${k}</span><span>${v}</span></div>`).join('')}</div>`;
}
async function fillBestPlayers(fx, el){

        <b>${esc(x.p.name)}</b><small><img loading="lazy" decoding="async" src="${x.team.logo}" alt="" onerror="this.remove()">${x.g? '⚽'+(x.g>1?x.g:'') : ''}${x.as? ' 🅰️'+(x.as>1?x.as:'') : ''}</small>
        ${ratingChip(x.r)}
      </div>`).join('')}</div>`;
    el.querySelectorAll('.bp').forEach(c=> c.onclick = ()=> openPlayerModalById(parseInt(c.getAttribute('data-pid'),10), {id:parseInt(c.getAttribute('data-team-id'),10), name:c.getAttribute('data-team-name'), logo:c.getAttribute('data-team-logo')}, undefined, fx));
  }catch(e){}
}

async function renderLineupsFull(lineups, events, lineupsBox, fx, overlay, loadMatchDetailsRef){
  let statsMap = {};
  try{
    const ps = await apiFetch('/fixtures/players', {fixture:fx.fixture.id}, 'high');
    (ps||[]).forEach(tb=> (tb.players||[]).forEach(p=>{ const s = (p.statistics && p.statistics[0]) || {}; statsMap[p.player.id] = {...s, photo:p.player.photo}; }));
  }catch(e){}
  const subOut = {}, subIn = {}, gl = {}, as = {}, og = new Set();
  const xi = new Set(); (lineups||[]).forEach(l=> (l.startXI||[]).forEach(x=> x.player && xi.add(x.player.id)));
  (events||[]).forEach(ev=>{
    if(ev.type==='Goal'){
      if(ev.detail==='Own Goal'){ if(ev.player && ev.player.id) og.add(ev.player.id); }
      else if(ev.detail!=='Missed Penalty'){ if(ev.player && ev.player.id) gl[ev.player.id] = (gl[ev.player.id]||0)+1; if(ev.assist && ev.assist.id) as[ev.assist.id] = (as[ev.assist.id]||0)+1; }
    }
    if(ev.type==='subst'){ const m = ev.time && ev.time.elapsed; [ev.player, ev.assist].forEach(pl=>{ if(!pl || !pl.id) return; if(xi.has(pl.id)) subOut[pl.id] = m; else subIn[pl.id] = m; }); }
  });
  const homeL = lineups.find(l=> l.team.id===fx.teams.home.id) || lineups[0];
  const awayL = lineups.find(l=> l !== homeL) || null;
  const avg = (l)=>{ const r = (l.startXI||[]).map(x=> statsMap[x.player.id] && statsMap[x.player.id].games && parseFloat(statsMap[x.player.id].games.rating)).filter(v=>v); return r.length ? r.reduce((a,b)=>a+b,0)/r.length : null; };
  const head = (l)=> l ? `<div class="lu1-h"><img loading="lazy" decoding="async" src="${l.team.logo}" alt="" onerror="this.style.display='none'"><span class="nm">${esc(l.team.name)}</span><span class="fm">${esc(l.formation||'')}</span>${ratingChip(avg(l))}</div>` : '';
  const playerDot = (p, l, side, x, y, r, maxRow, i, count)=>{
    const st = statsMap[p.id] || {}; const games = st.games || {}, goals = st.goals || {}, cards = st.cards || {};
    const g = Math.max(goals.total||0, gl[p.id]||0), a = Math.max(goals.assists||0, as[p.id]||0);
    const ev = []; if(g) ev.push('⚽'+(g>1?g:'')); if(a) ev.push('🅰️'); if(cards.red) ev.push('🟥'); else if(cards.yellow) ev.push('🟨'); if(og.has(p.id)) ev.push('KK');
    const last = (p.name||'').split(' ').slice(-1)[0];
    return `<div class="pl3 ${side} lineup-slot-click" data-pid="${p.id}" data-team-id="${l.team.id}" data-team-name="${esc(l.team.name)}" data-team-logo="${esc(l.team.logo||'')}" style="left:${x}%;top:${y}%">
      <div class="ph"><div class="av">${st.photo? `<img loading="lazy" decoding="async" src="${st.photo}" loading="lazy" alt="" onerror="this.parentElement.textContent='${esc(p.number ?? '')}'">` : esc(p.number ?? '')}</div>
        ${games.rating ? ratingChip(games.rating) : ''}
        ${ev.length? `<span class="ev">${ev.map(e=>`<span>${e}</span>`).join('')}</span>` : ''}
        ${subOut[p.id]!==undefined? `<span class="so">↓${subOut[p.id]}'</span>` : ''}
        <button class="mp-note-btn" data-pid="${p.id}" data-pname="${esc(p.name)}" data-poskey="${guessScoutPositionKey(p.pos, r, maxRow, i+1, count)}" title="Bu maça özel not">📝</button>
      </div>
      <span class="nm"><em>${esc(p.number ?? '')}</em>${esc(last)}</span>
    </div>`;
  };
  const half = (l, side)=>{
    if(!l) return '';
    const withGrid = (l.startXI||[]).map(x=>x.player).filter(p=>p.grid);
    if(!withGrid.length) return '';
    const rows = {}; withGrid.forEach(p=>{ const [r,c] = p.grid.split(':').map(Number); (rows[r] = rows[r]||[]).push({...p, col:c}); });
    const keys = Object.keys(rows).map(Number).sort((a,b)=>a-b); const maxRow = Math.max(...keys, 1);
    let out = '';
    keys.forEach(r=>{
      const rp = rows[r].slice().sort((a,b)=> side==='home' ? a.col-b.col : b.col-a.col);
      const t = (r-1)/((maxRow-1)||1);
      const y = side==='home' ? 94 - t*39 : 6 + t*39;
      rp.forEach((p,i)=>{ const x = ((i+1)/(rp.length+1))*100; out += playerDot(p, l, side, x, y, r, maxRow, i, rp.length); });
    });
    return out;
  };
  const hasGrid = [homeL, awayL].some(l=> l && (l.startXI||[]).some(x=> x.player && x.player.grid));
  const bench = (l)=>{
    if(!l) return '';
    const subs = (l.substitutes||[]).slice().sort((a,b)=> (subIn[b.player.id]!==undefined) - (subIn[a.player.id]!==undefined));
    const xiList = hasGrid ? '' : (l.startXI||[]).map(x=> benchRow(x.player, l, statsMap, subIn, gl, as)).join('');
    return `<div class="bench2"><h5><img loading="lazy" decoding="async" src="${l.team.logo}" alt="" onerror="this.style.display='none'">${esc(l.team.name)}${l.coach&&l.coach.name? ` <span style="color:var(--ink2);font-weight:500">· ${esc(l.coach.name)}</span>`:''}</h5>
      ${xiList ? '<div style="font:700 11px var(--font-ui);color:var(--ink2);margin:6px 2px">İlk 11</div>'+xiList : ''}
      <div style="font:700 11px var(--font-ui);color:var(--ink2);margin:6px 2px">Yedekler</div>
      ${subs.map(x=> benchRow(x.player, l, statsMap, subIn, gl, as)).join('') || '<div class="bn-row" style="cursor:default;color:var(--ink2)">Yok</div>'}</div>`;
  };
  lineupsBox.innerHTML = `
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px"><button class="icon-btn" id="luNotesBtn">📝 Oyuncu notu</button><button class="icon-btn" id="refreshLineupsBtn">🔄 Yenile</button></div>
    ${hasGrid ? `<div class="lu1">${head(awayL)}<div class="pitch3"><div class="ln p-mid"></div><div class="ln p-c"></div><div class="ln p-t1"></div><div class="ln p-t2"></div><div class="ln p-b1"></div><div class="ln p-b2"></div>${half(awayL,'away')}${half(homeL,'home')}</div>${head(homeL)}</div>` : ''}
    <div class="bench3">${bench(homeL)}${bench(awayL)}</div>
    <p style="font:500 11px var(--font-ui);color:var(--ink2);margin:10px 2px 0">Renkli rozet: maç reytingi · 📝 bu maça özel oyuncu notu</p>`;
  lineupsBox.querySelectorAll('.ev-player-link, .lineup-slot-click').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('.mp-note-btn')) return;
      e.preventDefault();
      const pid = el.getAttribute('data-pid'); if(!pid) return;
      openPlayerModalById(parseInt(pid,10), {id:parseInt(el.getAttribute('data-team-id'),10), name:el.getAttribute('data-team-name'), logo:el.getAttribute('data-team-logo')}, undefined, fx);
    };
  });
  lineupsBox.querySelectorAll('.mp-note-btn').forEach(async btn=>{
    const pid = parseInt(btn.getAttribute('data-pid'),10);
    btn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); openMatchPlayerNoteModal(fx, pid, btn.getAttribute('data-pname'), btn, btn.getAttribute('data-poskey')); };
    const ex = await getNotePayload('matchplayer', fx.fixture.id+'_'+pid);
    if(ex && ex.payload && ((ex.payload.note && ex.payload.note.trim()) || (ex.payload.rating!==null && ex.payload.rating!==undefined))) btn.classList.add('has');
  });
  const nb = lineupsBox.querySelector('#luNotesBtn');
  if(nb) nb.onclick = ()=>{ lineupsBox.classList.toggle('notes-on'); nb.classList.toggle('on', lineupsBox.classList.contains('notes-on')); if(lineupsBox.classList.contains('notes-on')) showToast('Not eklemek için oyuncunun üstündeki 📝 simgesine dokun'); };
  const rb = lineupsBox.querySelector('#refreshLineupsBtn');
  if(rb && loadMatchDetailsRef) rb.onclick = ()=>{ rb.textContent = 'Yenileniyor…'; loadMatchDetailsRef(fx); };
}
function benchRow(p, l, statsMap, subIn, gl, as){
  const st = statsMap[p.id] || {}; const r = st.games && st.games.rating ? parseFloat(st.games.rating) : null;
  const inMin = subIn[p.id]; const g = gl[p.id]||0, a = as[p.id]||0;
  const posKey = p.pos==='G'?'gk':p.pos==='D'?'cb':p.pos==='F'?'st':'cm';
  const posTr = {G:'K', D:'D', M:'O', F:'F'}[p.pos] || '';
  return `<div class="bn-row ev-player-link" data-pid="${p.id}" data-team-id="${l.team.id}" data-team-name="${esc(l.team.name)}" data-team-logo="${esc(l.team.logo||'')}">
    <span class="av">${st.photo? `<img loading="lazy" decoding="async" src="${st.photo}" loading="lazy" alt="" onerror="this.parentElement.textContent='${esc(p.number ?? '')}'">` : esc(p.number ?? '')}</span>
    <span class="n"><small>${esc(p.number ?? '')}</small>${esc(p.name)}${g? ' ⚽'+(g>1?g:''):''}${a? ' 🅰️':''} <small style="margin-left:4px">${posTr}</small></span>
    ${inMin!==undefined? `<span class="in">↑ ${inMin}'</span>`:''}
    ${r? ratingChip(r) : ''}
    <button class="mp-note-btn" data-pid="${p.id}" data-pname="${esc(p.name)}" data-poskey="${posKey}" title="Bu maça özel not">📝</button>
  </div>`;
}

function fixtureResultForTeam(fx, teamId){
  const played = ['FT','AET','PEN'].includes(fx.fixture.status.short);
  if(!played) return null;
  const isHome = fx.teams.home.id===teamId;
  const gf = isHome? fx.goals.home : fx.goals.away, ga = isHome? fx.goals.away : fx.goals.home;
  if(gf==null||ga==null) return null;
  if(gf>ga) return {letter:'G', color:'#1FAD4B'};
  if(gf<ga) return {letter:'M', color:'#E0301E'};
  return {letter:'B', color:'#9AA0AB'};
}
function resultBadgeHtml(res){
  if(!res) return '';
  return `<span style="display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:${res.color};color:#fff;font:700 11.5px var(--font-ui)">${res.letter}</span>`;
}
async function loadFixtures(team, container){
  container.innerHTML = '<div class="lgrp" style="padding:6px">'+'<div class="skel"></div>'.repeat(6)+'</div>';
  try{
    const all = (await apiFetch('/fixtures', {team:team.id, season:state.teamSeason}, 'high')).slice();
    if(!all.length){ container.innerHTML = '<div class="card empty"><div class="display">Maç bulunamadı</div><p>Sezon yılını değiştirmeyi dene.</p></div>'; return; }
    all.sort((a,b)=> new Date(a.fixture.date)-new Date(b.fixture.date));
    const flags = await fixtureFlagSets();
    const form = all.filter(f=>['FT','AET','PEN'].includes(f.fixture.status.short)).slice(-5).map(f=>fixtureResultForTeam(f, team.id)).filter(Boolean);
    const months = new Map();
    all.forEach(f=>{ const k = new Date(f.fixture.date).toLocaleDateString('tr-TR',{month:'long', year:'numeric'}); if(!months.has(k)) months.set(k, []); months.get(k).push(f); });
    container.innerHTML = `
      ${form.length ? `<div class="lgrp" style="padding:12px;display:flex;align-items:center;gap:8px"><b style="font:700 13px var(--font-ui);margin-right:4px">Son form</b>${form.map(resultBadgeHtml).join('')}</div>` : ''}
      ${[...months.entries()].map(([m, list])=>`<div class="sect-h">${esc(m)}</div><div class="lgrp">${list.map(f=> sofaRowHtml(f, flags, null, resultBadgeHtml(fixtureResultForTeam(f, team.id)))).join('')}</div>`).join('')}`;
    container.querySelectorAll('.sr[data-fx]').forEach(r=> r.onclick = ()=>{ const f = all.find(x=> String(x.fixture.id)===r.getAttribute('data-fx')); if(f) openFixtureModal(f); });
    const next = all.find(f=> !['FT','AET','PEN','PST','CANC','ABD'].includes(f.fixture.status.short));
    if(next){ const el = container.querySelector(`.sr[data-fx="${next.fixture.id}"]`); if(el){ el.style.background = 'var(--sel)'; } }
  }catch(e){ container.innerHTML = '<div class="banner">⚠ '+esc(e.message)+'</div>'; }
}

function zoneColor(desc){
  if(!desc) return null;
  const d = desc.toLowerCase();
  if(d.includes('champions league')) return '#374DF5';
  if(d.includes('europa league')) return '#F08A24';
  if(d.includes('conference')) return '#14B8A6';
  if(d.includes('relegation') && !d.includes('play')) return '#E0301E';
  if(d.includes('relegation')) return '#F59E0B';
  if(d.includes('promotion') && d.includes('play')) return '#7C3AED';
  if(d.includes('promotion')) return '#1FAD4B';
  return '#8A93A3';
}
function formHtml(form){
  if(!form) return '';
  return String(form).slice(-5).split('').map(c=>{ const m = {W:['G','#1FAD4B'], D:['B','#9AA0AB'], L:['M','#E0301E']}[c]; return m ? `<span class="fm-b" style="background:${m[1]}">${m[0]}</span>` : ''; }).join('');
}
function hoursUntil(d){
  const ms = new Date(d) - Date.now(); if(ms <= 0 || ms > 6*3600e3) return '';
  const h = Math.floor(ms/3600e3), m = Math.floor((ms%3600e3)/60e3);
  return h ? `${h}s ${m}dk` : `${m} dk`;
}

// maç satırı: İY skoru, geri sayım, canlı ilerleme çubuğu
function sofaRowHtml(fx, flags, teamSet, sideOverride){
  const s = fx.fixture.status.short;
  const live = LIVE_STATUSES.includes(s);
  const played = ['FT','AET','PEN'].includes(s);
  const t = new Date(fx.fixture.date).toLocaleTimeString('tr-TR',{hour:'2-digit', minute:'2-digit'});
  const ht = fx.score && fx.score.halftime && fx.score.halftime.home!=null ? `İY ${fx.score.halftime.home}-${fx.score.halftime.away}` : '';
  let st;
  if(live) st = `<div class="st live"><b>${s==='HT' ? 'İY' : (fx.fixture.status.elapsed ? fx.fixture.status.elapsed+"'" : 'Canlı')}</b><span>${s==='HT' ? 'Devre' : 'Canlı'}</span></div>`;
  else if(played) st = `<div class="st"><b>${s==='PEN'?'Pen.':s==='AET'?'UZ':'MS'}</b><span>${ht || t}</span></div>`;
  else if(s==='PST') st = `<div class="st"><span>${t}</span><b>Ert.</b></div>`;
  else if(['CANC','ABD'].includes(s)) st = `<div class="st"><span>${t}</span><b>İptal</b></div>`;
  else { const cd = hoursUntil(fx.fixture.date); st = `<div class="st"><b style="color:var(--ink)">${t}</b>${cd? `<span class="cd">${cd}</span>` : ''}</div>`; }
  // hangi ligde/kupada oynandigini kucuk bir rozetle gosteriyoruz - ozellikle takimin kendi mac gecmisinde
  // (farkli turnuvalar ay basligi altinda karisik gorunebiliyordu)
  if(fx.league && fx.league.logo){
    const leagueBadge = `<img loading="lazy" decoding="async" src="${fx.league.logo}" title="${esc(fx.league.name||'')}" onerror="this.style.display='none'" style="width:14px;height:14px;object-fit:contain;margin-top:3px;opacity:.85;">`;
    st = st.replace('</div>', leagueBadge+'</div>');
  }
  const hw = fx.teams.home.winner===true, aw = fx.teams.away.winner===true;
  const decided = played && (hw || aw);
  const cls = (w)=> decided ? (w ? 'w' : 'l') : '';
  const started = live || played;
  const id = String(fx.fixture.id);
  const mine = teamSet && (teamSet.has(fx.teams.home.id) || teamSet.has(fx.teams.away.id));
  const fh = teamSet && teamSet.has(fx.teams.home.id), fa = teamSet && teamSet.has(fx.teams.away.id);
  const prog = live && fx.fixture.status.elapsed ? Math.min(100, fx.fixture.status.elapsed/90*100) : 0;
  let side;
  if(sideOverride!==undefined) side = sideOverride + (flags && flags.notes.has(id) ? '<span class="nd">📝</span>' : '');
  else side = (flags && flags.notes.has(id) ? '<span class="nd" title="Notun var">📝</span>' : '') + (flags && flags.watched.has(id) ? '<span class="nd" title="İzledin">👁️</span>' : '');
  return `<div class="sr ${mine?'mine':''} ${live?'is-live':''}" data-fx="${id}">
    ${st}
    <div class="tms">
      <div class="tm ${cls(hw)}"><img loading="lazy" decoding="async" src="${fx.teams.home.logo}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.home.name)}</span>${fh? '<i class="star">★</i>' : ''}</div>
      <div class="tm ${cls(aw)}"><img loading="lazy" decoding="async" src="${fx.teams.away.logo}" loading="lazy" alt="" onerror="this.style.visibility='hidden'"><span>${esc(fx.teams.away.name)}</span>${fa? '<i class="star">★</i>' : ''}</div>
    </div>
    <div class="scs ${live?'live':''}">${started ? `<span class="${decided && !hw?'l':''}">${fx.goals.home ?? 0}</span><span class="${decided && !aw?'l':''}">${fx.goals.away ?? 0}</span>` : ''}</div>
    <div class="side">${side}</div>
    ${prog ? `<i class="prog" style="width:${prog}%"></i>` : ''}
  </div>`;
}

// ---------- MAÇ AKIŞI (zaman çizelgesi grafiği) ----------
function matchFlowSvg(events, fx){
  const s = fx.fixture.status.short;
  const live = LIVE_STATUSES.includes(s);
  const played = ['FT','AET','PEN'].includes(s);
  // sadece gol ve kartlar - degisiklikler asagidaki "Mac olaylari" listesinde zaten var, burada kalabalik etmesin
  const relevant = events.filter(e=> (e.type==='Goal' && e.detail!=='Missed Penalty') || e.type==='Card');
  const maxMin = Math.max(90, ...relevant.map(e=> (e.time.elapsed||0) + (e.time.extra||0)), live ? (fx.fixture.status.elapsed||0) : 0);
  const now = live ? (fx.fixture.status.elapsed||0) : (played ? maxMin : 0);
  const pct = (m)=> Math.min(100, Math.max(0, (m/maxMin)*100));
  // NOT: oncesinde etiketler dakikaya gore % konumla sabitlenip satira gore cakisma onleniyordu, ama dar (telefon)
  // ekranlarda yuzde cinsinden "yeterli" bosluk bile gercek pikselde yetersiz kaliyor, isimler uzun olunca yine
  // ustuste biniyordu. Artik dakikaya gore SIRALI, sarilan (flex-wrap) bir kronolojik satir kullaniyoruz -
  // boylece hangi ekran genisliginde olursa olsun cakisma matematiksel olarak imkansiz, sadece asagi satira sariyor
  const sortByMin = (list)=> list.slice().sort((a,b)=> ((a.time.elapsed||0)+(a.time.extra||0)) - ((b.time.elapsed||0)+(b.time.extra||0)));
  const homeEvs = sortByMin(relevant.filter(e=> e.team && e.team.id===fx.teams.home.id));
  const awayEvs = sortByMin(relevant.filter(e=> e.team && e.team.id===fx.teams.away.id));
  const chipHtml = (e, side)=>{
    const m = (e.time.elapsed||0) + (e.time.extra||0);
    const isGoal = e.type==='Goal';
    const og = isGoal && e.detail==='Own Goal';
    const pen = isGoal && e.detail==='Penalty';
    const icon = isGoal ? '⚽' : (e.detail==='Yellow Card' ? '🟨' : '🟥');
    const name = e.player && e.player.name ? shortName(e.player.name) : '';
    const suffix = og ? ' (KK)' : pen ? ' (P)' : '';
    return `<div class="flow-chip ${side}" title="${esc(m+"' "+(name||'')+suffix)}">
      <span class="ic">${icon}</span><span class="nm">${esc(name)}${esc(suffix)}</span><span class="mn">${m}'</span>
    </div>`;
  };
  return `<div class="flow">
    <div class="flow-h"><span class="h"><img loading="lazy" decoding="async" src="${fx.teams.home.logo}" alt="" onerror="this.remove()">${esc(fx.teams.home.name)}</span><b>Maç akışı</b><span class="a">${esc(fx.teams.away.name)}<img loading="lazy" decoding="async" src="${fx.teams.away.logo}" alt="" onerror="this.remove()"></span></div>
    <div class="flow-stage">
      ${homeEvs.length ? `<div class="flow-row home">${homeEvs.map(e=>chipHtml(e,'home')).join('')}</div>` : ''}
      <div class="flow-bar-track">
        <i class="flow-bar-fill" style="width:${now?pct(now):0}%"></i>
        <span class="flow-bar-ht" style="left:${pct(45)}%"></span>
        ${live ? `<span class="flow-bar-live" style="left:${pct(now)}%"></span>` : ''}
      </div>
      <div class="flow-ticks"><span>0'</span><span>İY</span><span>${maxMin}'</span></div>
      ${awayEvs.length ? `<div class="flow-row away">${awayEvs.map(e=>chipHtml(e,'away')).join('')}</div>` : ''}
    </div>
    ${relevant.length ? '' : '<div class="flow-empty">Henüz gol veya kart yok</div>'}
    <div class="flow-lg"><span><i style="background:var(--home)"></i>${esc(fx.teams.home.name)}</span><span><i style="background:var(--away)"></i>${esc(fx.teams.away.name)}</span><span>🟨 Sarı kart</span><span>🟥 Kırmızı kart</span></div>
  </div>`;
}
async function fillKeyStats(fx, el){
  if(!el) return;
  const s = fx.fixture.status.short;
  if(!(['FT','AET','PEN'].includes(s) || LIVE_STATUSES.includes(s))) return;
  try{
    const stats = await apiFetch('/fixtures/statistics', {fixture:fx.fixture.id}, 'high');
    if(!stats || stats.length<2 || !document.body.contains(el)) return;
    const f = (i,t)=>{ const x = ((stats[i]||{}).statistics||[]).find(z=>z.type===t); return x && x.value!=null ? x.value : null; };
    const items = [['Ball Possession','Topa sahip olma'],['expected_goals','xG'],['Total Shots','Şut'],['Shots on Goal','İsabetli şut'],['Corner Kicks','Korner'],['Passes %','Pas isabeti']]
      .map(([t,l])=>[l, f(0,t), f(1,t)]).filter(r=> r[1]!==null || r[2]!==null);
    if(!items.length) return;
    const n = (v)=> parseFloat(String(v??0).replace('%',''))||0;
    el.innerHTML = `<div class="sect-h">Önemli istatistikler</div><div class="kst">${items.map(([l,h,a])=>{ const hv=n(h), av=n(a), tot=(hv+av)||1; return `<div class="kst-i"><div class="kst-v"><b class="${hv>av?'win h':''}">${esc(h??0)}</b><span>${l}</span><b class="${av>hv?'win a':''}">${esc(a??0)}</b></div><div class="kst-bar"><i class="h" style="width:${hv/tot*100}%"></i><i class="a" style="width:${av/tot*100}%"></i></div></div>`; }).join('')}</div>`;
  }catch(e){}
}
function modernEventsHtml(events, fx){
  const icon = (ev)=>{
    if(ev.type==='Goal') return ev.detail==='Own Goal' ? '⚽<small style="color:var(--bad)">KK</small>' : ev.detail==='Penalty' ? '⚽<small>P</small>' : ev.detail==='Missed Penalty' ? '❌' : '⚽';
    if(ev.type==='Card') return ev.detail==='Yellow Card' ? '🟨' : '🟥';
    if(ev.type==='subst') return '🔄';
    if(ev.type==='Var') return '📺';
    return '•';
  };
  const link = (pl, team)=> pl && pl.name ? `<a href="#" class="ev-player-link" data-pid="${pl.id||''}" data-team-id="${team.id}" data-team-name="${esc(team.name)}" data-team-logo="${esc(team.logo||'')}">${esc(pl.name)}</a>` : '';
  let h = 0, a = 0, htDone = false;
  const rows = [];
  events.forEach(ev=>{
    if(!htDone && ev.time.elapsed>45){ htDone = true; rows.push(`<div class="ev-ht"><span>İY ${h} - ${a}</span></div>`); }
    if(ev.type==='Goal' && ev.detail!=='Missed Penalty'){ if(ev.team.id===fx.teams.home.id) h++; else a++; }
    const isHome = ev.team && ev.team.id===fx.teams.home.id;
    let sub = '';
    if(ev.type==='Goal' && ev.assist && ev.assist.name) sub = 'Asist: '+link(ev.assist, ev.team);
    else if(ev.type==='subst' && ev.assist && ev.assist.name) sub = '↔ '+link(ev.assist, ev.team);
    else if(ev.comments) sub = esc(ev.comments);
    const scoreTag = ev.type==='Goal' && ev.detail!=='Missed Penalty' ? `<span class="ev-sc">${h}-${a}</span>` : '';
    // isim cok uzun olunca eskiden skor etiketiyle ayni <b> icine girip ikisi birden "..." ile kesiliyordu
    // (skor gorunmez oluyordu) - artik isim kendi basina kisaliyor, skor rozeti her zaman tam gorunuyor
    const main = `<b>${link(ev.player, ev.team)}</b>${scoreTag}`;
    const c = `<div class="ev-c ${isHome?'h':'a'}">${isHome? `<div class="tx"><div class="tx-top">${main}</div>${sub?`<small>${sub}</small>`:''}</div><span class="ic">${icon(ev)}</span>` : `<span class="ic">${icon(ev)}</span><div class="tx"><div class="tx-top">${main}</div>${sub?`<small>${sub}</small>`:''}</div>`}</div>`;
    rows.push(`<div class="ev-r ${ev.type==='Goal'&&ev.detail!=='Missed Penalty'?'goal':''}">${isHome? c : '<div></div>'}<span class="ev-m">${ev.time.elapsed}${ev.time.extra?'+'+ev.time.extra:''}'</span>${isHome? '<div></div>' : c}</div>`);
  });
  if(['FT','AET','PEN'].includes(fx.fixture.status.short)) rows.push(`<div class="ev-ht"><span>MS ${fx.goals.home ?? h} - ${fx.goals.away ?? a}</span></div>`);
  const uid = fx.fixture.id+Math.random().toString(36).slice(2,6);
  setTimeout(()=>{ fillBestPlayers(fx, document.getElementById('bp'+uid)); fillKeyStats(fx, document.getElementById('ks'+uid)); }, 0);
  return `${matchFlowSvg(events, fx)}
    <div class="bestp" id="bp${uid}"></div>
    <div id="ks${uid}"></div>
    <div class="sect-h">Maç olayları</div>
    <div class="evt">${rows.join('') || '<div class="empty" style="padding:14px">Olay yok</div>'}</div>
    ${matchInfoHtml(fx)}`;
}

// ---------- OYUNCU İSTATİSTİKLERİ TABLOSU ----------
async function renderPlayersTab(fx, box){
  box.innerHTML = '<div class="lgrp" style="padding:6px">'+'<div class="skel"></div>'.repeat(6)+'</div>';
